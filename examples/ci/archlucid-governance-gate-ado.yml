# Reference Azure DevOps pipeline — ArchLucid CI/CD governance gate.
# Register as a PR validation pipeline; link variable group `archlucid-ci` with:
#   ARCHLUCID_API_URL (plain), ARCHLUCID_API_KEY (secret), optional ARCHLUCID_UI_BASE_URL.

trigger: none

pr:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - docs/architecture/*
      - infra/*
      - terraform/*
      - .archlucid/*
      - examples/ci/architecture-request.ci.json

pool:
  vmImage: ubuntu-latest

variables:
  - group: archlucid-ci
  - name: ARCHLUCID_REQUEST_FILE
    value: .archlucid/architecture-request.json
  - name: ARCHLUCID_CORRELATION_ID
    value: ado-pr-$(System.PullRequest.PullRequestNumber)-$(Build.BuildId)

steps:
  - checkout: self
    fetchDepth: 1

  - bash: |
      set -euo pipefail
      sudo apt-get update -yq
      sudo apt-get install -yq jq
      if [[ ! -f "$ARCHLUCID_REQUEST_FILE" ]]; then
        echo "Using template examples/ci/architecture-request.ci.json"
        mkdir -p .archlucid
        cp examples/ci/architecture-request.ci.json "$ARCHLUCID_REQUEST_FILE"
      fi
      PR_NUM="$(System.PullRequest.PullRequestNumber)"
      if [[ -n "$PR_NUM" && "$PR_NUM" != "\$(System.PullRequest.PullRequestNumber)" ]]; then
        jq --arg pr "$PR_NUM" --arg repo "$(Build.Repository.Name)" \
          '.description = ("ADO PR #" + $pr + " in " + $repo + " — automated governance gate review.")' \
          "$ARCHLUCID_REQUEST_FILE" > "$ARCHLUCID_REQUEST_FILE.tmp"
        mv "$ARCHLUCID_REQUEST_FILE.tmp" "$ARCHLUCID_REQUEST_FILE"
      fi
      chmod +x examples/ci/archlucid-governance-gate.sh
      examples/ci/archlucid-governance-gate.sh | tee "$(Agent.TempDirectory)/archlucid-governance-gate.log"
    displayName: ArchLucid governance gate
    env:
      ARCHLUCID_API_URL: $(ARCHLUCID_API_URL)
      ARCHLUCID_API_KEY: $(ARCHLUCID_API_KEY)
      ARCHLUCID_UI_BASE_URL: $(ARCHLUCID_UI_BASE_URL)

  - task: PublishBuildArtifacts@1
    displayName: Publish governance gate log
    condition: always()
    inputs:
      PathtoPublish: $(Agent.TempDirectory)/archlucid-governance-gate.log
      ArtifactName: archlucid-governance-gate-log
      publishLocation: Container
