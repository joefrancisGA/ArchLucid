name: "Terraform init (registry-resilient)"
description: "Cache Terraform provider plugins and retry init when registry.terraform.io rate-limits (HTTP 429) or GitHub checksum endpoints time out (HTTP 504)."
inputs:
  working-directory:
    description: "Directory containing the Terraform root module"
    required: true
runs:
  using: "composite"
  steps:
    - name: Cache Terraform provider plugins
      uses: actions/cache@v4
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-plugins-${{ runner.os }}-${{ hashFiles('infra/**/.terraform.lock.hcl', 'deploy/**/.terraform.lock.hcl') }}
        restore-keys: |
          terraform-plugins-${{ runner.os }}-

    - name: terraform init (no backend)
      shell: bash
      run: |
        set -euo pipefail
        bash scripts/ci/terraform_init_registry_resilient.sh "${{ inputs.working-directory }}"
