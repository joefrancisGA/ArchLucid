name: "Wait for SQL Server"
description: "Poll SQL Server from the runner until login succeeds and master is ONLINE (beyond Docker service healthcheck)."
inputs:
  sa-password:
    description: "SA password for the CI SQL Server service container."
    required: false
    default: "LocalTesting123!"
  server:
    description: "SQL Server host:port for sqlcmd."
    required: false
    default: "127.0.0.1,1433"
  max-attempts:
    description: "Maximum poll attempts before failing the step."
    required: false
    default: "90"
  sleep-seconds:
    description: "Seconds to wait between poll attempts."
    required: false
    default: "2"
runs:
  using: "composite"
  steps:
    - name: Wait for SQL Server to accept connections
      shell: bash
      run: |
        set -euo pipefail
        export SA_PASSWORD='${{ inputs.sa-password }}'
        export SQL_SERVER='${{ inputs.server }}'
        export SQL_WAIT_MAX_ATTEMPTS='${{ inputs.max-attempts }}'
        export SQL_WAIT_SLEEP_SECONDS='${{ inputs.sleep-seconds }}'
        bash scripts/ci/wait-for-sqlserver.sh
