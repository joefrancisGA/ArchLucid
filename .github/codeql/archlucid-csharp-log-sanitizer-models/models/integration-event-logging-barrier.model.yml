      - ["ArchLucid.Core.Integration", "IntegrationEventTypes", "AlertFiredV1", "", "file-content-store", "manual"]
      - ["ArchLucid.Core.Integration", "IntegrationEventTypes", "AlertResolvedV1", "", "file-content-store", "manual"]
      - ["ArchLucid.Core.Integration", "IntegrationEventTypes", "AdvisoryScanCompletedV1", "", "file-content-store", "manual"]
      - ["ArchLucid.Core.Integration", "IntegrationEventTypes", "ComplianceDriftEscalatedV1", "", "file-content-store", "manual"]
