extensions:
  # TB-611: IntegrationEventTypes canonical URNs and SanitizedLogger* helpers are operational
  # identifiers (not credentials). neutralModel(summary) marks void helpers as flow-neutral so
  # cs/exposure-of-sensitive-information does not anchor at caller lines before LogSanitizer runs.
  - addsTo:
      pack: codeql/csharp-all
      extensible: neutralModel
    data:
      - ["ArchLucid.Core.Diagnostics", "SanitizedLoggerWarningExtensions", "LogWarningIntegrationEventServiceBusPublishFailed", "(Microsoft.Extensions.Logging.ILogger,System.Exception,System.String)", "summary", "manual"]
      - ["ArchLucid.Core.Diagnostics", "SanitizedLoggerWarningExtensions", "LogWarningIntegrationEventSerializationFailed", "(Microsoft.Extensions.Logging.ILogger,System.Exception,System.String)", "summary", "manual"]
      - ["ArchLucid.Core.Diagnostics", "SanitizedLoggerWarningExtensions", "LogWarningIntegrationEventOutboxEnqueueFailed", "(Microsoft.Extensions.Logging.ILogger,System.Exception,System.String)", "summary", "manual"]
      - ["ArchLucid.Core.Diagnostics", "SanitizedLoggerWarningExtensions", "LogWarningIntegrationEventBestEffortPublishFailed", "(Microsoft.Extensions.Logging.ILogger,System.Exception,System.String)", "summary", "manual"]
      - ["ArchLucid.Core.Diagnostics", "SanitizedLoggerHostLeaderElectionExtensions", "LogDebugHostLeaderLeaseNotHeldFollowerWait", "(Microsoft.Extensions.Logging.ILogger,System.String,System.Int32)", "summary", "manual"]
      - ["ArchLucid.Core.Diagnostics", "SanitizedLoggerHostLeaderElectionExtensions", "LogInformationHostLeaderLeaseAcquired", "(Microsoft.Extensions.Logging.ILogger,System.String,System.String)", "summary", "manual"]
