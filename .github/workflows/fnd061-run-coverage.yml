name: FND-061 run coverage authorization

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Api/Controllers/Authority/RunCoverageController*.cs'
      - 'ArchLucid.Api/Support/ArchitectureShareAccessGate.cs'
      - 'ArchLucid.Api.Tests/RunCoverageController*Tests.cs'
      - '.github/workflows/fnd061-run-coverage.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  coverage-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-authorization-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-authorization-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj -c Release
          --filter 'FullyQualifiedName~RunCoverageController'
          --logger 'console;verbosity=normal'
