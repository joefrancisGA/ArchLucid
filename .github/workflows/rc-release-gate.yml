# RC / release branch hard gates — advisory on ordinary PR CI, blocking here.
# Policy: docs/runbooks/RC_RELEASE_GATE.md

name: RC release gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  high-risk-guards:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tenant isolation defense-in-depth (blocking)
        run: python scripts/ci/assert_tenant_isolation_defense_in_depth.py

      - name: Mutating route idempotency posture drift (blocking)
        run: python scripts/ci/detect_mutating_route_idempotency_drift.py

      - name: Audit matrix vs OpenAPI mutations (blocking)
        run: python scripts/ci/assert_openapi_mutations_in_audit_matrix.py

      - name: Audit matrix vs controller routes (blocking)
        run: python scripts/ci/check_audit_matrix.py

      - name: Buyer-facing canonical claim drift (blocking)
        run: python scripts/ci/check_buyer_claim_drift.py

      - name: Procurement claim coherence (blocking)
        run: python scripts/ci/check_procurement_claim_coherence.py

      - name: Proof-confidence taxonomy drift (blocking)
        run: python scripts/ci/check_proof_confidence_taxonomy_drift.py

      - name: Public pricing placeholder hard guard (blocking)
        run: python scripts/ci/assert_public_pricing_placeholder_guard.py

      - name: Release runbook/script parity (blocking)
        run: python scripts/ci/check_release_runbook_script_parity.py

      - name: Sponsor packet contract (blocking)
        run: python scripts/ci/check_sponsor_packet_contract.py

      - name: ROI surface consistency (blocking)
        run: python scripts/ci/check_roi_surface_consistency.py

      - name: Route tier policy nav parity (blocking)
        run: |
          python scripts/ci/assert_route_tier_policy_nav.py \
            --markdown-report "${{ runner.temp }}/route-tier-policy-nav-parity.md" \
            --json-summary-out "${{ runner.temp }}/route-tier-policy-nav-parity.json"

      - name: Sponsor evidence label consistency (blocking)
        run: python scripts/ci/check_sponsor_evidence_label_consistency.py

      - name: Upload route tier policy nav RC artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: route-tier-policy-nav-parity
          path: ${{ runner.temp }}/route-tier-policy-nav-parity.*
          if-no-files-found: warn

      - name: High-risk guard unit tests
        run: |
          python -m unittest discover -s scripts/ci/tests -p "test_tenant_isolation_defense_in_depth.py"
          python -m unittest discover -s scripts/ci/tests -p "test_mutating_route_idempotency_drift.py"
          python -m unittest discover -s scripts/ci/tests -p "test_assert_openapi_mutations_in_audit_matrix.py"
          python -m unittest discover -s scripts/ci/tests -p "test_check_buyer_claim_drift.py"
          python -m unittest discover -s scripts/ci/tests -p "test_assert_public_pricing_placeholder_guard.py"
          python -m unittest discover -s scripts/ci/tests -p "test_check_release_runbook_script_parity.py"
          python -m unittest discover -s scripts/ci/tests -p "test_assert_route_tier_policy_nav.py"
          python -m unittest discover -s scripts/ci/tests -p "test_check_sponsor_evidence_label_consistency.py"

  observability-readiness:
    if: github.event.repository.fork == false
    needs: release-evidence-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Emit observability export readiness (RC artifact)
        run: |
          python scripts/report_observability_export_readiness.py \
            --environment Production \
            --out "${{ runner.temp }}/observability-export-readiness.md"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: observability-export-readiness
          path: ${{ runner.temp }}/observability-export-readiness.*
          if-no-files-found: warn

  release-evidence-gates:
    if: github.event.repository.fork == false
    needs: high-risk-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Release evidence gate unit tests
        run: |
          python -m unittest discover -s scripts/ci/tests -p "test_release_evidence*.py"
          python -m unittest discover -s scripts/ci/tests -p "test_assert_rc_strict_signoff.py"
          python -m unittest discover -s scripts/ci/tests -p "test_report_pricing_quote_response_weekly.py"
          python -m unittest discover -s scripts/ci/tests -p "test_check_proof_confidence_taxonomy_drift.py"
          python -m unittest discover -s scripts/ci/tests -p "test_emit_real_model_canary_gate.py"

      - name: Strict RC rollup self-test (empty bundle must fail)
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          if python scripts/ci/build_release_confidence_rollup.py \
            --repo-root . \
            --bundle-dir "$TMP" \
            --json-out "$TMP/rollup.json" \
            --markdown-out "$TMP/rollup.md" \
            --strict-rc; then
            echo "::error::strict RC rollup must fail on empty evidence bundle"
            exit 1
          fi

      - name: Release evidence bundle validate self-test (incomplete must fail)
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          if python scripts/ci/release_evidence_bundle.py validate \
            --dir "$TMP" \
            --profile release-readiness \
            --strict-buyer-rc; then
            echo "::error::release evidence validate must fail on empty bundle"
            exit 1
          fi

  real-mode-claim-gate:
    if: github.event.repository.fork == false
    needs: release-evidence-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Emit real-mode claim gate (simulator-only RC honest posture)
        env:
          ARCHLUCID_RC_RELEASE_CONTEXT: "1"
          ARCHLUCID_RELEASE_SIMULATOR_ONLY: "1"
        run: |
          python scripts/ci/check_release_real_mode_claim.py \
            --allow-simulator-only \
            --rc-strict-claims \
            --json-out "${{ runner.temp }}/real-mode-claim-gate.json" \
            --markdown-out "${{ runner.temp }}/real-mode-claim-gate.md"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-mode-claim-gate
          path: ${{ runner.temp }}/real-mode-claim-gate.*
          if-no-files-found: warn

  real-model-canary:
    if: github.event.repository.fork == false
    needs: real-mode-claim-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Emit real-model canary gate artifact (RC strict)
        env:
          ARCHLUCID_RC_RELEASE_CONTEXT: "1"
          ARCHLUCID_REAL_MODE_CANARY_WAIVER: "1"
          ARCHLUCID_REAL_MODE_CANARY_WAIVER_OWNER: "rc-release-gate-workflow"
          ARCHLUCID_REAL_MODE_CANARY_WAIVER_RATIONALE: "Repository CI validates gate artifact shape; live canary or owner waiver required at RC signoff"
        run: |
          python scripts/ci/emit_real_model_canary_gate.py \
            --json-out "${{ runner.temp }}/real-model-canary-gate.json" \
            --markdown-out "${{ runner.temp }}/real-model-canary-gate.md" \
            --rc-strict

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-model-canary-gate
          path: ${{ runner.temp }}/real-model-canary-gate.*
          if-no-files-found: warn

  rc-signoff-gate:
    if: github.event.repository.fork == false
    needs:
      - real-mode-claim-gate
      - real-model-canary
      - observability-readiness
      - high-risk-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compose RC signoff artifacts (shape validation)
        env:
          ARCHLUCID_RC_RELEASE_CONTEXT: "1"
          ARCHLUCID_RELEASE_SIMULATOR_ONLY: "1"
          ARCHLUCID_REAL_MODE_CANARY_WAIVER: "1"
          ARCHLUCID_REAL_MODE_CANARY_WAIVER_OWNER: "rc-release-gate-workflow"
          ARCHLUCID_REAL_MODE_CANARY_WAIVER_RATIONALE: "Repository CI validates RC signoff artifact shape; live canary required at buyer-facing RC cut"
        run: |
          set -euo pipefail
          BUNDLE="${{ runner.temp }}/rc-signoff-bundle"
          mkdir -p "$BUNDLE"
          python scripts/ci/check_release_real_mode_claim.py \
            --allow-simulator-only \
            --rc-strict-claims \
            --json-out "$BUNDLE/real-mode-claim-gate.json" \
            --markdown-out "$BUNDLE/real-mode-claim-gate.md"
          python scripts/ci/emit_real_model_canary_gate.py \
            --json-out "$BUNDLE/real-model-canary-gate.json" \
            --markdown-out "$BUNDLE/real-model-canary-gate.md" \
            --rc-strict
          python scripts/report_observability_export_readiness.py \
            --environment Production \
            --out "$BUNDLE/observability-export-readiness.md"
          python scripts/ci/assert_route_tier_policy_nav.py \
            --markdown-report "$BUNDLE/route-tier-policy-nav-parity.md" \
            --json-summary-out "$BUNDLE/route-tier-policy-nav-parity.json"
          printf '%s\n' '{"schema":"archlucid.release-readiness-index.v1","rollup":"WARN","claimGateDisposition":"PASS"}' \
            > "$BUNDLE/release-readiness-index.json"
          python scripts/ci/build_pilot_critical_performance_evidence.py \
            --bundle-dir "$BUNDLE" \
            --environment-label Production \
            --json-out "$BUNDLE/pilot-critical-performance-evidence.json" \
            --markdown-out "$BUNDLE/pilot-critical-performance-evidence.md"
          python scripts/ci/report_saq_release_gate.py \
            --repo-root . \
            --json-out "$BUNDLE/saq-release-gate.json" \
            --markdown-out "$BUNDLE/saq-release-gate.md"
          cp scripts/ci/fixtures/pilot-readiness-bundle/live-pass-gate.json \
            "$BUNDLE/pilot-readiness-live-release-gate.json"
          python scripts/ci/build_release_confidence_rollup.py \
            --repo-root . \
            --bundle-dir "$BUNDLE" \
            --json-out "$BUNDLE/release-confidence-rollup.json" \
            --markdown-out "$BUNDLE/release-confidence-rollup.md"
          python scripts/ci/build_rc_evidence_signoff_bundle.py \
            --repo-root . \
            --bundle-dir "$BUNDLE" \
            --json-out "$BUNDLE/rc-evidence-signoff-bundle.json" \
            --markdown-out "$BUNDLE/rc-evidence-signoff-bundle.md"
          python scripts/ci/build_rc_go_no_go_verdict.py \
            --repo-root . \
            --bundle-dir "$BUNDLE" \
            --json-out "$BUNDLE/rc-go-no-go-verdict.json" \
            --markdown-out "$BUNDLE/rc-go-no-go-verdict.md"

      - name: Assert strict RC signoff outputs reference machine-readable artifacts
        run: |
          set -euo pipefail
          BUNDLE="${{ runner.temp }}/rc-signoff-bundle"
          python scripts/ci/assert_rc_strict_signoff.py \
            --bundle-dir "$BUNDLE" \
            --json-out "$BUNDLE/rc-strict-signoff-assertion-shape.json"

      - name: Assert strict RC mode fails closed when signoff is incomplete
        run: |
          set -euo pipefail
          BUNDLE="${{ runner.temp }}/rc-signoff-bundle"
          if python scripts/ci/build_rc_evidence_signoff_bundle.py \
            --repo-root . \
            --bundle-dir "$BUNDLE" \
            --json-out "$BUNDLE/rc-evidence-signoff-bundle-strict-check.json" \
            --markdown-out "$BUNDLE/rc-evidence-signoff-bundle-strict-check.md" \
            --strict-rc; then
            echo "::error::strict RC signoff must fail when high-risk gates are SKIPPED"
            exit 1
          fi
          if python scripts/ci/assert_rc_strict_signoff.py \
            --bundle-dir "$BUNDLE" \
            --require-pass \
            --require-live-parity-artifact; then
            echo "::error::strict RC assertion must fail when strictDisposition/verdict are not PASS"
            exit 1
          fi
          echo "Strict RC fail-closed guard verified (incomplete bundle correctly blocked)."

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc-signoff-gate
          path: ${{ runner.temp }}/rc-signoff-bundle/**
          if-no-files-found: warn

  ui-e2e-live-rc:
    if: github.event.repository.fork == false
    needs: high-risk-guards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Restore and build API (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Api/ArchLucid.Api.csproj --no-restore -c Release

      - name: Install UI deps and build Next (standalone)
        working-directory: archlucid-ui
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_E2E_ALLOW_DEMO_BLOCKED_ROUTES: "1"
        run: |
          npm ci
          npm run build

      - name: Create SQL catalog for live API e2e
        run: |
          set -e
          docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -Q "IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name = N'ArchLucidLiveE2eRc') CREATE DATABASE ArchLucidLiveE2eRc;"

      - name: Start ArchLucid.Api (background)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5128
          ConnectionStrings__ArchLucid: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidLiveE2eRc"
          ArchLucid__StorageProvider: Sql
          ArchLucidAuth__Mode: DevelopmentBypass
          ArchLucidAuth__AllowTestActorHeaders: "true"
          Authentication__ApiKey__DevelopmentBypassAll: "true"
          # Trial live specs expect Noop checkout (env wins over optional appsettings.SaaS.json).
          Billing__Provider: Noop
          AgentExecution__Mode: Simulator
          Observability__Prometheus__Enabled: "true"
          Observability__Prometheus__RequireScrapeAuthentication: "false"
          RateLimiting__Registration__PermitLimit: "500"
          ArchLucid__E2eHarness__SharedSecret: "ci-live-e2e-harness-secret-min16!"
          Cors__AllowedOrigins__0: "http://127.0.0.1:3000"
          Cors__AllowedOrigins__1: "http://localhost:3000"
          DataConsistency__InitialDelaySeconds: "0"
          HostLeaderElection__Enabled: "false"
          Demo__Enabled: "true"
          Demo__SeedOnStartup: "true"
          Demo__AnonymousViewer__Enabled: "true"
        run: |
          set -e
          nohup dotnet run --no-build -c Release --project ArchLucid.Api/ArchLucid.Api.csproj > "${RUNNER_TEMP}/live-api-rc.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/live-api-rc.pid"

      - name: Wait for API readiness
        run: bash scripts/ci/wait-for-api-ready.sh "${RUNNER_TEMP}/live-api-rc.log"

      - name: Wait for demo preview (release-gate smokes)
        env:
          ARCHLUCID_API_LOG_FILE: ${{ runner.temp }}/live-api-rc.log
          ARCHLUCID_DEMO_PREVIEW_WAIT_ATTEMPTS: "90"
          ARCHLUCID_DEMO_WORKSPACES_MANIFEST: fixtures/demo-workspaces/demo-workspaces.fixture.manifest.json
        run: bash scripts/ci/wait-for-demo-preview.sh

      - name: Wait for DB-backed pilot-run-deltas (release-gate smokes)
        env:
          ARCHLUCID_API_LOG_FILE: ${{ runner.temp }}/live-api-rc.log
          ARCHLUCID_DB_PILOT_WAIT_ATTEMPTS: "60"
          ARCHLUCID_DEMO_WORKSPACES_MANIFEST: fixtures/demo-workspaces/demo-workspaces.fixture.manifest.json
        run: bash scripts/ci/wait-for-db-backed-pilot-endpoint.sh

      - name: Run blocking live UI/API/SQL release-gate Playwright subset
        working-directory: archlucid-ui
        env:
          CI: true
          API_URL: http://127.0.0.1:5128
          ARCHLUCID_API_LOG_FILE: ${{ runner.temp }}/live-api-rc.log
          LIVE_API_URL: http://127.0.0.1:5128
          LIVE_E2E_SKIP_NEXT_BUILD: "1"
          LIVE_E2E_HARNESS_SECRET: "ci-live-e2e-harness-secret-min16!"
          NODE_OPTIONS: --max-old-space-size=6144
          E2E_INFRA_MAX_ATTEMPTS: "12"
          E2E_INFRA_DB_MAX_ATTEMPTS: "25"
          E2E_INFRA_BASE_DELAY_MS: "1000"
          E2E_INFRA_PROBE_ATTEMPTS: "45"
          LIVE_JWT_TOKEN: ""
          LIVE_API_KEY: ""
          LIVE_API_KEY_READONLY: ""
          ARCHLUCID_DEMO_WORKSPACES_MANIFEST: fixtures/demo-workspaces/demo-workspaces.fixture.manifest.json
        run: |
          npx playwright install --with-deps chromium
          bash ../scripts/ci/wait-for-api-ready.sh "${ARCHLUCID_API_LOG_FILE}"
          bash ../scripts/ci/wait-for-db-backed-pilot-endpoint.sh
          npx playwright test --grep @release-gate

      - name: Upload Playwright test-results (traces)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-rc-test-results
          path: archlucid-ui/test-results
          if-no-files-found: warn

      - name: Upload live API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-rc-api-log
          path: ${{ runner.temp }}/live-api-rc.log
          if-no-files-found: warn

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-rc-playwright-report
          path: archlucid-ui/playwright-report
          if-no-files-found: warn
