# RC / release branch hard gates — advisory on ordinary PR CI, blocking here.
# Policy: docs/runbooks/RC_RELEASE_GATE.md

name: RC release gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  high-risk-guards:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tenant isolation defense-in-depth (blocking)
        run: python scripts/ci/assert_tenant_isolation_defense_in_depth.py

      - name: Mutating route idempotency posture drift (blocking)
        run: python scripts/ci/detect_mutating_route_idempotency_drift.py

      - name: Audit matrix vs OpenAPI mutations (blocking)
        run: python scripts/ci/assert_openapi_mutations_in_audit_matrix.py

      - name: Audit matrix vs controller routes (blocking)
        run: python scripts/ci/check_audit_matrix.py

      - name: Buyer-facing canonical claim drift (blocking)
        run: python scripts/ci/check_buyer_claim_drift.py

      - name: Public pricing placeholder hard guard (blocking)
        run: python scripts/ci/assert_public_pricing_placeholder_guard.py

      - name: Release runbook/script parity (blocking)
        run: python scripts/ci/check_release_runbook_script_parity.py

      - name: Sponsor packet contract (blocking)
        run: python scripts/ci/check_sponsor_packet_contract.py

      - name: ROI surface consistency (blocking)
        run: python scripts/ci/check_roi_surface_consistency.py

      - name: High-risk guard unit tests
        run: |
          python -m unittest discover -s scripts/ci/tests -p "test_tenant_isolation_defense_in_depth.py"
          python -m unittest discover -s scripts/ci/tests -p "test_mutating_route_idempotency_drift.py"
          python -m unittest discover -s scripts/ci/tests -p "test_assert_openapi_mutations_in_audit_matrix.py"
          python -m unittest discover -s scripts/ci/tests -p "test_check_buyer_claim_drift.py"
          python -m unittest discover -s scripts/ci/tests -p "test_assert_public_pricing_placeholder_guard.py"
          python -m unittest discover -s scripts/ci/tests -p "test_check_release_runbook_script_parity.py"

  real-model-canary:
    if: github.event.repository.fork == false
    needs: high-risk-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Emit real-model canary gate artifact (RC strict)
        env:
          ARCHLUCID_RC_RELEASE_CONTEXT: "1"
        run: |
          python scripts/ci/emit_real_model_canary_gate.py \
            --json-out "${{ runner.temp }}/real-model-canary-gate.json" \
            --markdown-out "${{ runner.temp }}/real-model-canary-gate.md" \
            --rc-strict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-model-canary-gate
          path: ${{ runner.temp }}/real-model-canary-gate.*
          if-no-files-found: warn
