# Release-candidate eval corpus: strict recall + simulator quality gate + mandatory real-mode evidence path.
# Does not run on ordinary PRs; owners supply OPENAI/AOAI evidence via env on dispatch or RC tags.

name: agent-eval-corpus-rc

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  eval-corpus-rc:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert committed real-mode exemplar exists
        run: python3 scripts/ci/assert_eval_corpus_rc_has_real_exemplar.py

      - name: Run RC eval corpus wrapper (strict + real-mode evidence required)
        env:
          ARCHLUCID_EVAL_CORPUS_MARKDOWN_REPORT: ${{ runner.temp }}/eval-corpus-rc.md
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_SMOKE_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-smoke.real.json
        run: bash scripts/ci/run_eval_agent_corpus_rc.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-corpus-rc
          path: ${{ runner.temp }}/eval-corpus-rc.md
          if-no-files-found: warn
