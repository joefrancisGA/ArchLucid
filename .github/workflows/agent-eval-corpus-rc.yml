# Release-candidate eval corpus: strict recall + simulator/real quality gates + mandatory real-mode evidence path.
# Does not run on ordinary PRs; owners supply OPENAI/AOAI evidence via env on dispatch or RC tags.

name: agent-eval-corpus-rc

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc*"
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  eval-corpus-rc:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert committed real-mode exemplar exists
        run: python3 scripts/ci/assert_eval_corpus_rc_has_real_exemplar.py

      - name: Real-mode AI quality evidence (RC strict + budget-aware live optional)
        run: |
          bash scripts/ci/run_real_mode_ai_quality_evidence_ci.sh \
            --output-dir artifacts/ci/real-mode-ai-quality-evidence-rc \
            --invoke-live-when-budget-allows

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-corpus-rc
          path: artifacts/ci/real-mode-ai-quality-evidence-rc/
          if-no-files-found: warn
