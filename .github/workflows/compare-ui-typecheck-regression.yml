name: Compare UI typecheck regression

on:
  pull_request:
    branches: [master]
    paths:
      - 'archlucid-ui/src/app/(operator)/insights/compare-two-reviews/_sections/**'
      - '.github/workflows/compare-ui-typecheck-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-ui-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json
      - run: npm --prefix archlucid-ui ci
      - run: npm --prefix archlucid-ui run typecheck
