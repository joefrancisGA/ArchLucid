name: FND-010 Evidence Authorization Boundary

on:
  pull_request:
    branches: [master, main, architecture/fnd005-full-record-replay]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p 'test_fnd010_evidence_authorization.py' -v
