name: FND-010 Evidence Authorization Boundary

# Ordinary PR coverage is supplied by fnd015-consolidated-reference-verification.yml.
on:
  pull_request:
    branches: [architecture/fnd005-full-record-replay]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p 'test_fnd010_evidence_authorization.py' -v
