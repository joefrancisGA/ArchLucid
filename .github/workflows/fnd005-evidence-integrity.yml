name: FND-005 Evidence Integrity Verification

# Ordinary PR coverage is supplied by fnd015-consolidated-reference-verification.yml.
on:
  pull_request:
    branches: [architecture/fnd005-evidence-integrity-verifier]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  evidence-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install schema validator required by FND-005 contract tests
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Verify FND-005 evidence contracts
        run: python -m unittest discover -s scripts/tests -p 'test_fnd005_*.py' -v
