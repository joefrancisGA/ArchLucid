# Measures assemblies outside the master push corset (see scripts/ci/run_trunk_matrix_measurement.sh).
# Does not replace full ci.yml workflow_dispatch — quantifies the gap between corset-green and full-matrix.
name: Trunk matrix measurement

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: trunk-matrix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  measure:
    name: ".NET: trunk matrix measurement"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v7

      - name: Wait for SQL Server to be ready (service warm-up)
        uses: ./.github/actions/wait-for-sqlserver

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and build Active slnf
        run: dotnet build ArchLucid.Active.slnf -c Release

      - name: Run trunk matrix measurement script
        env:
          ARCHLUCID_SQL_TEST: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests"
        run: bash scripts/ci/run_trunk_matrix_measurement.sh | tee trunk-matrix-measurement.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trunk-matrix-measurement-log
          path: trunk-matrix-measurement.log
          retention-days: 14
