name: Remediation optimistic concurrency

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Core/Persistence/ApplicationPorts/InfraEvidence/IRemediationInstanceRepository.cs'
      - 'ArchLucid.Persistence/InfraEvidence/SqlRemediationInstanceRepository.cs'
      - 'scripts/ci/tests/test_remediation_optimistic_concurrency.py'
      - '.github/workflows/remediation-optimistic-concurrency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/ci/tests -p test_remediation_optimistic_concurrency.py -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ArchLucid.Persistence/ArchLucid.Persistence.csproj --configuration Release
