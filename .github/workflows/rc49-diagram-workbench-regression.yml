# Focused RC49 diagram contract regression; does not run full master CI.
name: RC49 diagram workbench regression

on:
  pull_request:
    branches: [RC49]
    paths:
      - "archlucid-ui/src/app/(operator)/governance/infrastructure/diagrams/DiagramsWorkbenchClient.tsx"
      - "archlucid-ui/src/app/(operator)/governance/infrastructure/diagrams/DiagramsWorkbenchClient.test.tsx"
      - ".github/workflows/rc49-diagram-workbench-regression.yml"

permissions:
  contents: read

jobs:
  diagram-workbench:
    name: "RC49: diagram workbench Vitest"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json
      - name: Validate diagram selection, scope, and provenance
        working-directory: archlucid-ui
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
          npm run test:vitest-single-worker -- 'src/app/(operator)/governance/infrastructure/diagrams/DiagramsWorkbenchClient.test.tsx'
