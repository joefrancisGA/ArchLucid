name: Remediation SQL role permissions guard

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Persistence/Migrations/426_RemediationRoleWritePermissions.sql'
      - 'ArchLucid.Persistence/Scripts/ArchLucid.sql'
      - 'ArchLucid.Host.Core/Startup/Validation/Rules/SqlSealedEvidenceImmutabilityRules.cs'
      - 'ArchLucid.Host.Core/Startup/Validation/Rules/SqlDatabaseImmutabilityProbeHelpers.cs'
      - 'ArchLucid.Persistence/InfraEvidence/SqlAzureInventorySnapshotRepository.Delete.cs'
      - 'ArchLucid.Persistence.Tests/Sql/RemediationSqlRolePrivilegesTests.cs'
      - 'scripts/ci/tests/test_remediation_sql_role_permissions.py'
      - 'scripts/ci/tests/test_remediation_atomic_update_contract.py'
      - '.github/workflows/remediation-sql-role-permissions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/ci/tests -p test_remediation_sql_role_permissions.py -v
      - run: python -m unittest discover -s scripts/ci/tests -p test_remediation_atomic_update_contract.py -v
