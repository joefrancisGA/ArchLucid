name: ArchLucid staging cold-start evidence contracts

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'ArchLucid.Api/Program.cs'
      - 'scripts/ci/capture_archlucid_staging_cold_start.py'
      - 'scripts/ci/test_capture_archlucid_staging_cold_start.py'
      - 'scripts/ci/join_archlucid_staging_phase_logs.py'
      - 'scripts/ci/test_join_archlucid_staging_phase_logs.py'
      - '.github/workflows/cd-staging-on-merge.yml'
      - '.github/workflows/cd.yml'
      - '.github/workflows/archlucid-cold-start-evidence.yml'
      - '.github/workflows/archlucid-staging-unmeasured.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate capture, missing data, secret-safety and CD step ordering
        run: python3 -m unittest scripts.ci.test_capture_archlucid_staging_cold_start scripts.ci.test_join_archlucid_staging_phase_logs -v
