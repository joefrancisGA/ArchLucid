# Manual launch load drill — public showcase UI burst + authenticated API read burst (LATEST_EXPOSURE §20 Tier 3).
name: "Performance: launch load drill (manual)"

on:
  workflow_dispatch:
    inputs:
      showcase_peak_vus:
        description: Peak VUs for public showcase burst
        required: false
        default: "30"
      auth_peak_vus:
        description: Peak VUs for authenticated read burst
        required: false
        default: "10"

concurrency:
  group: k6-launch-load-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launch-load-drill:
    name: Launch load drill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: archlucid-ui/.nvmrc
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build API (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Api/ArchLucid.Api.csproj --no-restore -c Release

      - name: Install UI deps & build Next (standalone)
        working-directory: archlucid-ui
        run: |
          npm ci
          npm run build

      - name: Install k6
        run: bash scripts/ci/install_k6_apt.sh

      - name: Start mock API + standalone UI
        working-directory: archlucid-ui
        env:
          MOCK_E2E_SKIP_NEXT_BUILD: "1"
        run: |
          npx tsx e2e/start-e2e-with-mock.ts > "${RUNNER_TEMP}/launch-drill-ui.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/launch-drill-ui.pid"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/welcome >/dev/null; then
              echo "UI ready"
              exit 0
            fi
            sleep 2
          done
          echo "UI failed to become ready"
          cat "${RUNNER_TEMP}/launch-drill-ui.log"
          exit 1

      - name: Create catalog + start API (Simulator)
        run: bash scripts/ci/start_api_for_k6.sh ArchLucidLaunchDrill "${RUNNER_TEMP}/launch-drill-api.log" "${RUNNER_TEMP}/launch-drill-api.pid"

      - name: Run launch load drill
        env:
          ARCHLUCID_UI_BASE_URL: http://127.0.0.1:3000
          ARCHLUCID_BASE_URL: http://127.0.0.1:5128
          K6_SHOWCASE_PEAK_VUS: ${{ inputs.showcase_peak_vus }}
          K6_AUTH_PEAK_VUS: ${{ inputs.auth_peak_vus }}
          LAUNCH_DRILL_OUT_DIR: artifacts/launch-load-drill/ci-${{ github.run_id }}
        run: bash scripts/ci/run_launch_load_drill.sh

      - name: Upload drill artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: launch-load-drill-${{ github.run_id }}
          path: artifacts/launch-load-drill/
          if-no-files-found: warn

      - name: Stop UI
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/launch-drill-ui.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/launch-drill-ui.pid")" || true
          fi
