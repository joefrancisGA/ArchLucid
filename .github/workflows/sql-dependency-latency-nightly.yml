# Nightly SQL dependency latency digest (AppDependencies p50/p95/p99) emailed to the owner.
# Policy: docs/runbooks/SQL_DEPENDENCY_LATENCY_NIGHTLY.md

name: "Ops: SQL dependency latency nightly"

on:
  workflow_dispatch:
  schedule:
    # 06:00 America/New_York — before the daily error digest.
    - cron: "0 6 * * *"
      timezone: America/New_York

permissions:
  id-token: write
  contents: read

jobs:
  sql-dependency-latency-nightly:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - name: Eligibility
        id: eligibility
        run: |
          set -euo pipefail
          if [ "${{ vars.APP_INSIGHTS_DAILY_REPORT_ENABLED }}" = "false" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Skip: repository variable APP_INSIGHTS_DAILY_REPORT_ENABLED=false."
            exit 0
          fi
          if [ -z "${{ vars.ARCHLUCID_LOG_ANALYTICS_WORKSPACE_ID }}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Skip: set repository variable ARCHLUCID_LOG_ANALYTICS_WORKSPACE_ID."
            exit 0
          fi
          if [ -z "${{ secrets.APP_INSIGHTS_REPORT_EMAIL_TO }}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Skip: set dev environment secret APP_INSIGHTS_REPORT_EMAIL_TO."
            exit 0
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@v7
        if: steps.eligibility.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - uses: azure/login@v3
        if: steps.eligibility.outputs.enabled == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate SQL latency digest
        if: steps.eligibility.outputs.enabled == 'true'
        env:
          ARCHLUCID_LOG_ANALYTICS_WORKSPACE_ID: ${{ vars.ARCHLUCID_LOG_ANALYTICS_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          DATE_UTC="$(date -u +%Y-%m-%d)"
          OUT_DIR="${GITHUB_WORKSPACE}/artifacts/sql-dependency-latency/${DATE_UTC}"
          mkdir -p "${OUT_DIR}"
          python3 scripts/ci/report_sql_dependency_latency_nightly.py \
            --environment dev \
            --window-hours 24 \
            --json-out "${OUT_DIR}/sql-latency-report.json" \
            --markdown-out "${OUT_DIR}/sql-latency-report.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "## SQL dependency latency (${DATE_UTC})" >> "${GITHUB_STEP_SUMMARY}"
            head -n 50 "${OUT_DIR}/sql-latency-report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: SQL latency digest unit tests
        if: steps.eligibility.outputs.enabled == 'true'
        run: python -m unittest discover -s scripts/ci/tests -p "test_report_sql_dependency_latency_nightly.py"

      - name: Email nightly digest
        if: steps.eligibility.outputs.enabled == 'true'
        continue-on-error: true
        env:
          APP_INSIGHTS_REPORT_EMAIL_TO: ${{ secrets.APP_INSIGHTS_REPORT_EMAIL_TO }}
          ACS_EMAIL_ENDPOINT: ${{ vars.ACS_EMAIL_ENDPOINT }}
          ACS_EMAIL_SENDER_ADDRESS: ${{ vars.ACS_EMAIL_SENDER_ADDRESS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_ADDRESS: ${{ secrets.SMTP_FROM_ADDRESS }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
        run: |
          set -euo pipefail
          DATE_UTC="$(date -u +%Y-%m-%d)"
          OUT_DIR="${GITHUB_WORKSPACE}/artifacts/sql-dependency-latency/${DATE_UTC}"
          python3 scripts/ci/app_insights_report_email.py \
            --report-json "${OUT_DIR}/sql-latency-report.json" \
            --markdown-path "${OUT_DIR}/sql-latency-report.md"

      - uses: actions/upload-artifact@v7
        if: steps.eligibility.outputs.enabled == 'true'
        with:
          name: sql-dependency-latency-${{ github.run_id }}
          path: artifacts/sql-dependency-latency/
          if-no-files-found: error
