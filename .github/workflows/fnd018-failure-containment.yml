name: FND-018 Failure Containment Reference
on:
  pull_request:
    branches: [master, main, architecture/fnd018-failure-containment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containment-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run bounded resilience controls tests
        run: python -m unittest discover -s scripts/tests -p 'test_fnd018_resilience_controls.py' -v
      - name: Run FND-018 containment reference tests
        run: python -m unittest discover -s scripts/tests -p 'test_fnd018_failure_containment.py' -v
