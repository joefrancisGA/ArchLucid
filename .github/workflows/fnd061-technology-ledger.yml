name: FND-061 technology ledger authorization

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Api/Controllers/Authority/TechnologyLedgerController*.cs'
      - 'ArchLucid.Api/Support/ArchitectureShareAccessGate.cs'
      - 'ArchLucid.Api.Tests/TechnologyLedgerController*Tests.cs'
      - '.github/workflows/fnd061-technology-ledger.yml'

permissions:
  contents: read

jobs:
  technology-ledger-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj -c Release
          --filter 'FullyQualifiedName~TechnologyLedgerController'
          --logger 'console;verbosity=normal'
