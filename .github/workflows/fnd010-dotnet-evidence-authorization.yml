name: FND-010 .NET Evidence Authorization
on:
  pull_request:
    branches: [master, main, architecture/fnd010-scim-acl-authority, architecture/fnd010-run-ownership-guard, architecture/fnd010-central-decision-service, architecture/fnd010-decision-audit-worker, architecture/fnd010-remediation-policy-boundary]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run targeted FND-010 .NET authorization suites
        run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj
          --filter "FullyQualifiedName~DurableAuthorizationAuditTests|FullyQualifiedName~RemediationCentralAuthorizationTests|FullyQualifiedName~CentralAuthorizationAuditWorkerTests|FullyQualifiedName~CentralAuthorizationDecisionsTests|FullyQualifiedName~EvidenceReadAuthorizationGateTests|FullyQualifiedName~ScimProjectEvidenceEntitlementAuthorityTests|FullyQualifiedName~SecureNowSnapshotHttpBoundaryTests|FullyQualifiedName~SecureNowSnapshotExchangeContractTests"
