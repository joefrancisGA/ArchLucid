name: FND-010 Explanation Share Authorization
on:
  pull_request:
    branches: [master, main]
    paths:
      - 'ArchLucid.Api/Controllers/Planning/ExplanationController*.cs'
      - 'ArchLucid.Api.Tests/ExplanationController*Tests.cs'
      - 'ArchLucid.Api/Support/ArchitectureShareAccessGate.cs'
      - 'ArchLucid.AgentRuntime/Explanation/CachingRunExplanationSummaryService.cs'
      - 'ArchLucid.AgentRuntime.Tests/Explanation/CachingRunExplanationSummaryServiceTests.cs'
      - 'ArchLucid.Application/Explanation/FindingLlmAuditService.cs'
      - 'ArchLucid.Application.Tests/Explanation/FindingLlmAuditServiceTests.cs'
      - '.github/workflows/fnd010-explanation-share-authorization.yml'
permissions:
  contents: read
concurrency:
  group: fnd010-explanation-share-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  explanation-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify explanation boundary and current sharing
        run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj
          --filter "FullyQualifiedName~ExplanationControllerTests|FullyQualifiedName~ExplanationControllerShareAccessTests|FullyQualifiedName~ArchitectureShareAccessGateNotFoundPolicyTests"
  explanation-cache-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify explanation cache scope isolation
        run: >-
          dotnet test ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj
          --filter "FullyQualifiedName~CachingRunExplanationSummaryServiceTests"
      - name: Verify scoped preferred trace resolution
        run: >-
          dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj
          --filter "FullyQualifiedName~FindingLlmAuditServiceTests|FullyQualifiedName~HolisticCriticServiceTests"
