name: Remediation scoped fallback safety

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Core/Persistence/ApplicationPorts/InfraEvidence/IRemediationInstanceRepository.cs'
      - 'scripts/ci/tests/test_remediation_scoped_write_fallback.py'
      - '.github/workflows/remediation-scoped-fallback-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/ci/tests -p test_remediation_scoped_write_fallback.py -v
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ArchLucid.Persistence/ArchLucid.Persistence.csproj --configuration Release
