# Continuous deployment: multi-job pipeline (build → Terraform plan/apply → Container Apps → smoke → optional rollback → NuGet → notify).
# Azure auth: OIDC only (`azure/login@v2`, `id-token: write`). Do not use AZURE_CREDENTIALS or stored SP passwords.
#
# Per GitHub Environment (`dev` / `staging` / `production`), configure required reviewers + secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   ACR_LOGIN_SERVER (optional; skips image push when unset)
#   ACR_NAME — optional explicit registry name for `az acr login --name`
#   TF_WORKING_DIRECTORY — optional, e.g. infra/terraform-container-apps (copy .example tfvars to dev.tfvars / terraform.tfvars / production.tfvars)
#   TF_BACKEND_TF — multiline secret: full contents of the gitignored backend.tf (terraform{} block with this
#     environment's azurerm backend + state key). Without it Terraform inits EMPTY LOCAL state on the runner,
#     so the plan proposes re-creating live infrastructure; CD warns on plan-only runs and refuses to apply.
#   DEV_TFVARS — optional multiline secret (GitHub Environment `dev` only): full contents of dev.tfvars written before `terraform plan` so CD works without committing gitignored tfvars
#   NUGET_API_KEY — optional; pushes ArchLucid.Api.Client when set (production path)
#   AZURE_RESOURCE_GROUP, CONTAINER_APP_API_NAME — optional; `az containerapp update` after image push (TB-657: CD owns runtime image tags; Terraform `lifecycle.ignore_changes` on container image)
#   CONTAINER_APP_WORKER_NAME — optional; worker uses the same image as the API (ArchLucid.Api Dockerfile publishes Worker.dll; CA command is already set in Terraform)
#     Pre-deploy, CD mirrors the API app's SQL settings onto the worker and fails closed when they are missing
#     (scripts/ci/cd_heal_worker_sql_config.py) — Terraform does not declare ConnectionStrings for any app.
#   CONTAINER_APP_UI_NAME — optional operator UI Container App (same archlucid-ui image)
#   CONTAINER_APP_MARKETING_UI_NAME — optional marketing UI Container App (same image; TB-2016 dual-CA split)
#   SMOKE_TEST_BASE_URL — required for staging/production post-deploy smoke; optional skip for dev only
#   ARCHLUCID_API_KEY — required for product-path smoke + deployment-evidence OpenAPI; also healed onto UI/marketing
#                       Container Apps as secret al-ui-apikey → ARCHLUCID_API_KEY (Staging ApiKey proxy auth)
#   Dev private-beta auth (optional): set repo var DEV_PRIVATE_BETA_AUTH_ENABLED=true + vars/secrets below; CD switches
#     dev API to JwtBearer + email OTP and bakes jwt/OIDC NEXT_PUBLIC_* into the UI image. Smoke mints a Bearer JWT.
#     Vars: DEV_OPERATOR_UI_BASE_URL, DEV_JWT_LOCAL_ISSUER, DEV_JWT_LOCAL_AUDIENCE, NEXT_PUBLIC_OIDC_* (optional)
#     Secrets (dev environment): DEV_JWT_PRIVATE_KEY_PEM, DEV_JWT_PUBLIC_KEY_PEM, DEV_EMAIL_OTP_HASH_PEPPER
#   ARCHLUCID_CONTENT_SAFETY_ENDPOINT / ARCHLUCID_CONTENT_SAFETY_API_KEY — optional but required for Staging/Production-like
#     API hosts; CD heals ArchLucid__ContentSafety__* + Container App secret al-cs-key (ArchLucid-owned account only)
#   Product-path smoke: scripts/ci/cd_post_deploy_product_smoke.py (workspaces + why-archlucid read, UI /api/health, BFF)
#   CD_MAINTENANCE_WINDOW_OVERRIDE — optional repo var "true" for break-glass dev deploy outside 22:00-23:00 America/New_York
#
#
# Dev schedule: nightly 22:00 America/New_York (target=dev, action=deploy). Manual staging/production remain workflow_dispatch only.
# Dev Contoso seed: target=dev pins ASPNETCORE_ENVIRONMENT=Staging + Demo__Enabled + Demo__EnableShowcaseSeed
#   + Demo__SaaSGuestSeedEnabled on the API (auto-heal in pre-deploy config check; Contoso summary required in
#   product smoke; SaaSGuestSeed enables POST /v1/demo/seed on Staging). Staging/production keep Demo off.
# Triggers: workflow_dispatch (on-demand) plus the dev schedule above. GitHub schedules always run from the default branch tip.
# Dev maintenance: deploy allowed during hour 22 ET; post-deploy validation must pass before 23:00 ET or rollback runs (when CD_ROLLBACK_ON_SMOKE_FAILURE=true).
#   SMOKE_SYNTHETIC_PATH — optional repo var; recommended /api/auth/me (authenticated warm-path GET after /version; requires ARCHLUCID_API_KEY)
#   CD_POST_DEPLOY_MAX_ATTEMPTS / CD_POST_DEPLOY_RETRY_WAIT_SECONDS — optional repo vars for retry loop (cold start)
#   CD_CANARY_ENABLED — optional repo var "true" to split API traffic after deploy (requires api_revision_mode=Multiple in Terraform)
#   CD_CANARY_INITIAL_PERCENT — optional repo var (default 10) initial weight on the new revision
#   CD_CANARY_BAKE_MINUTES — optional repo var; sleep minutes between split and smoke (0 skips)
#   CD_NOTIFY_WEBHOOK_URL — optional Slack-compatible JSON webhook
#   TERRAFORM_DATA_REGION_ALLOWLIST_EXTRA — optional comma-separated Azure regions merged into CD
#     Terraform plan location allowlist (after `terraform show -json`), e.g. a shared global Front Door region
#   After `terraform show -json`, CD also runs scripts/ci/assert_sql_backup_regions.py against the same plan JSON
#     (requested_backup_storage_redundancy must be Geo or Zone by default; omit --allowed to use that policy).
#
# Rollback: set repository variable CD_ROLLBACK_ON_SMOKE_FAILURE=true to restore last-known-good revisions when smoke fails.
# Manual rollback: workflow_dispatch with action=rollback + rollback_build_id (immutable BUILD_ID / git SHA).
# Helpers: scripts/ci/cd_rollback.py, cd_capture_last_known_good.py, cd_plan_rollback.py.
#
# Traceability: one immutable BUILD_ID (git commit SHA) is set at the start of build-push-images and stamped into
# API/UI build-args, OCI labels, IMAGE_TAG (default), and ARCHLUCID_BUILD_COMMIT_SHA. Friendly latest-* aliases are
# additional tags only — deploy never uses mutable `latest` as the primary identity.
# Container Apps: deploy uses `registry/repo@sha256:<digest>` from the build-push job when the build-push step exports
# a digest (immutable manifest). `CD_DEPLOY_RUN` plus a unique `--revision-suffix` still forces a new revision when the
# image string would otherwise match a prior deploy (ACA can skip pulls / new revision for identical `:tag` refs).
# Ingress traffic is pinned using `latestRevisionName` from the same `az containerapp update` stdout (avoids a stale
# follow-up `show`). API follows canary for traffic when enabled.
name: CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy runs the full pipeline; rollback runs only manual rollback for the target environment"
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      run_terraform_apply:
        description: "Run terraform apply after plan (requires TF_WORKING_DIRECTORY and configured backend)"
        required: true
        type: boolean
        default: false
      rollback_build_id:
        description: "Required when action=rollback: immutable BUILD_ID (git SHA) to restore from ACR"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  actions: write

concurrency:
  group: archlucid-cd-${{ github.event.inputs.target || 'dev' }}
  cancel-in-progress: false

# Align JavaScript actions with Node 24 (GitHub default June 2026). Docker uses setup-buildx@v4 / build-push@v7 (Node 24).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CD_TARGET: ${{ github.event.inputs.target || 'dev' }}
  CD_ACTION: ${{ github.event.inputs.action || 'deploy' }}

jobs:
  build-push-images:
    name: Build and push images (${{ github.event.inputs.target || 'dev' }})
    if: (github.event.inputs.action || 'deploy') == 'deploy'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    outputs:
      build_id: ${{ steps.build_identity.outputs.build_id }}
      image_tag: ${{ steps.image_tag_out.outputs.image_tag }}
      build_timestamp: ${{ steps.build_metadata.outputs.build_timestamp }}
      images_pushed: ${{ steps.acr.outputs.configured }}
      api_image_digest: ${{ steps.require_digests.outputs.api_image_digest }}
      ui_image_digest: ${{ steps.require_digests.outputs.ui_image_digest }}
    env:
      TF_DIR: ${{ secrets.TF_WORKING_DIRECTORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dev maintenance window guard
        env:
          CD_MAINTENANCE_WINDOW_OVERRIDE: ${{ vars.CD_MAINTENANCE_WINDOW_OVERRIDE }}
        run: bash scripts/ci/cd-maintenance-window-guard.sh "${{ github.event.inputs.target || 'dev' }}"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set BUILD_ID, image tag, and latest alias
        id: build_identity
        run: |
          BUILD_ID="${{ github.sha }}"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          TAG="${{ vars.IMAGE_TAG }}"
          if [ -z "$TAG" ]; then TAG="$BUILD_ID"; fi
          if [ "$TAG" = "latest" ] || [[ "$TAG" == latest-* ]]; then
            echo "::error::IMAGE_TAG must not be a mutable latest* tag (got: $TAG). Use BUILD_ID (git SHA)."
            exit 1
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          if [ "${{ github.event.inputs.target || 'dev' }}" = "staging" ]; then
            echo "LATEST_ALIAS=latest-staging" >> "$GITHUB_ENV"
          elif [ "${{ github.event.inputs.target || 'dev' }}" = "dev" ]; then
            echo "LATEST_ALIAS=latest-dev" >> "$GITHUB_ENV"
          else
            echo "LATEST_ALIAS=latest-production" >> "$GITHUB_ENV"
          fi

      - name: Capture deployment build metadata
        id: build_metadata
        run: |
          BUILD_TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "BUILD_TIMESTAMP=$BUILD_TS" >> "$GITHUB_ENV"
          echo "DEPLOY_ENV=${{ github.event.inputs.target || 'dev' }}" >> "$GITHUB_ENV"
          echo "build_timestamp=$BUILD_TS" >> "$GITHUB_OUTPUT"

      - name: Assert BUILD_ID / OCI label / lineage / target-preflight contract
        run: |
          python3 scripts/ci/oci_build_identity.py --assert-workflows
          python3 scripts/ci/oci_build_identity.py --assert-image-tag "$IMAGE_TAG"
          python3 scripts/ci/cd_deployment_lineage.py --assert-workflows
          python3 scripts/ci/cd_deploy_target_preflight.py --assert-workflows

      - name: Export image_tag output
        id: image_tag_out
        run: echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Detect ACR configuration
        id: acr
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          if [ -n "${ACR_LOGIN_SERVER:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ACR_LOGIN_SERVER not set — skipping image build/push."
          fi

      - name: Azure deployment-target preflight
        env:
          EXPECTED_AZURE_TENANT_ID: ${{ vars.EXPECTED_AZURE_TENANT_ID }}
          EXPECTED_AZURE_SUBSCRIPTION_ID: ${{ vars.EXPECTED_AZURE_SUBSCRIPTION_ID }}
          EXPECTED_AZURE_RESOURCE_GROUP: ${{ vars.EXPECTED_AZURE_RESOURCE_GROUP }}
          EXPECTED_AZURE_LOCATION: ${{ vars.EXPECTED_AZURE_LOCATION }}
          EXPECTED_ACR_LOGIN_SERVER: ${{ vars.EXPECTED_ACR_LOGIN_SERVER }}
          EXPECTED_CONTAINER_APP_API_NAME: ${{ vars.EXPECTED_CONTAINER_APP_API_NAME }}
          EXPECTED_CONTAINER_APP_WORKER_NAME: ${{ vars.EXPECTED_CONTAINER_APP_WORKER_NAME }}
          EXPECTED_CONTAINER_APP_UI_NAME: ${{ vars.EXPECTED_CONTAINER_APP_UI_NAME }}
          EXPECTED_CONTAINER_APP_ENVIRONMENT_NAME: ${{ vars.EXPECTED_CONTAINER_APP_ENVIRONMENT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
        run: |
          set -euo pipefail
          ARGS=(
            --environment "${{ github.event.inputs.target || 'dev' }}"
            --build-id "${BUILD_ID}"
            --summary-path "artifacts/deploy-target-preflight-build-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.md"
          )
          if [ "${{ steps.acr.outputs.configured }}" = "true" ] \
            && [ -n "${AZURE_RESOURCE_GROUP:-}" ] \
            && [ -n "${CONTAINER_APP_API_NAME:-}" ]; then
            ARGS+=(--check-resources)
          fi
          python3 scripts/ci/cd_deploy_target_preflight.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assert Persistence Pilots sources for API Docker context
        if: steps.acr.outputs.configured == 'true'
        run: python3 scripts/ci/assert_persistence_pilots_docker_context.py

      - name: Set up Docker Buildx
        if: steps.acr.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Prefetch Microsoft .NET base images (MCR + BuildKit HEAD 403 mitigation)
        if: steps.acr.outputs.configured == 'true'
        run: bash scripts/ci/prefetch-docker-dotnet-base-images.sh

      - name: Log in to ACR
        if: steps.acr.outputs.configured == 'true'
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          REG_NAME="${ACR_NAME:-${ACR_LOGIN_SERVER%%.*}}"
          az acr login --name "$REG_NAME"

      - name: Build and push API image (BuildKit + GHA cache)
        id: build_push_api
        if: steps.acr.outputs.configured == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ArchLucid.Api/Dockerfile
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/archlucid-api:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/archlucid-api:${{ env.LATEST_ALIAS }}
          labels: |
            org.opencontainers.image.title=archlucid-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.BUILD_ID }}
            org.opencontainers.image.version=${{ env.BUILD_ID }}
            org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}
          build-args: |
            BUILD_SHA=${{ env.BUILD_ID }}
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            DEPLOY_ENV=${{ env.DEPLOY_ENV }}
            DEPLOY_STAMP=${{ github.run_id }}-${{ github.run_attempt }}
          push: true
          pull: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api-docker-smoke-v2
          cache-to: type=gha,scope=api-docker-smoke-v2,mode=max

      - name: Build and push UI image (BuildKit + GHA cache)
        id: build_push_ui
        if: steps.acr.outputs.configured == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: archlucid-ui/Dockerfile
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/archlucid-ui:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/archlucid-ui:${{ env.LATEST_ALIAS }}
          labels: |
            org.opencontainers.image.title=archlucid-ui
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.BUILD_ID }}
            org.opencontainers.image.version=${{ env.BUILD_ID }}
            org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}
          build-args: |
            BUILD_SHA=${{ env.BUILD_ID }}
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            DEPLOY_ENV=${{ env.DEPLOY_ENV }}
            NEXT_PUBLIC_BUILD_COMMIT_SHA=${{ env.BUILD_ID }}
            NEXT_PUBLIC_BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            NEXT_PUBLIC_DEPLOY_STAMP=${{ github.run_id }}-${{ github.run_attempt }}
            NEXT_PUBLIC_DEPLOY_ENV=${{ env.DEPLOY_ENV }}
            NEXT_PUBLIC_API_UPSTREAM_HOST=${{ vars.API_UPSTREAM_HOST }}
            NEXT_PUBLIC_ARCHLUCID_AUTH_MODE=${{ vars.DEV_PRIVATE_BETA_AUTH_ENABLED == 'true' && 'jwt' || '' }}
            NEXT_PUBLIC_ARCHLUCID_EMAIL_OTP_ENABLED=${{ vars.DEV_PRIVATE_BETA_AUTH_ENABLED == 'true' && 'true' || '' }}
            NEXT_PUBLIC_OIDC_AUTHORITY=${{ vars.NEXT_PUBLIC_OIDC_AUTHORITY }}
            NEXT_PUBLIC_OIDC_CLIENT_ID=${{ vars.NEXT_PUBLIC_OIDC_CLIENT_ID }}
            NEXT_PUBLIC_OIDC_SCOPES=${{ vars.NEXT_PUBLIC_OIDC_SCOPES }}
            NEXT_PUBLIC_OIDC_REDIRECT_URI=${{ vars.NEXT_PUBLIC_OIDC_REDIRECT_URI }}
            NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI=${{ vars.NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI }}
          push: true
          pull: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ui-docker-smoke-v2
          cache-to: type=gha,scope=ui-docker-smoke-v2,mode=max

      - name: Require immutable digests from this build
        id: require_digests
        if: steps.acr.outputs.configured == 'true'
        env:
          API_DIGEST: ${{ steps.build_push_api.outputs.digest }}
          UI_DIGEST: ${{ steps.build_push_ui.outputs.digest }}
        run: |
          set -euo pipefail
          python3 scripts/ci/cd_deployment_lineage.py --require-digest "$API_DIGEST" --digest-name API_IMAGE_DIGEST
          python3 scripts/ci/cd_deployment_lineage.py --require-digest "$UI_DIGEST" --digest-name UI_IMAGE_DIGEST
          echo "api_image_digest=${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ui_image_digest=${UI_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Immutable digests for this run: API=${API_DIGEST} UI=${UI_DIGEST} tag=${IMAGE_TAG} BUILD_ID=${BUILD_ID}"

  terraform-plan:
    name: Terraform plan (${{ github.event.inputs.target || 'dev' }})
    needs: build-push-images
    if: (github.event.inputs.action || 'deploy') == 'deploy'
    # Image-only deploys (apply=false) must not brick on TF drift/WIP; apply=true still requires a green plan.
    continue-on-error: ${{ github.event.inputs.run_terraform_apply != 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    outputs:
      plan_created: ${{ steps.plan_gate.outputs.plan_created }}
    env:
      TF_DIR: ${{ secrets.TF_WORKING_DIRECTORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Materialize dev.tfvars from secret (optional)
        if: (github.event.inputs.target || 'dev') == 'dev'
        env:
          DEV_TFVARS: ${{ secrets.DEV_TFVARS }}
          # Additive overlay: lets an agent/operator append new flags (e.g. enable_api_sql_runtime_identity)
          # without needing to read back and re-merge the primary DEV_TFVARS secret (write-only in GitHub).
          DEV_TFVARS_EXTRA: ${{ secrets.DEV_TFVARS_EXTRA }}
        run: |
          if [ -z "${TF_DIR:-}" ]; then
            exit 0
          fi
          if [ -z "${DEV_TFVARS:-}" ] && [ -z "${DEV_TFVARS_EXTRA:-}" ]; then
            exit 0
          fi
          : > "${TF_DIR}/dev.tfvars"
          if [ -n "${DEV_TFVARS:-}" ]; then
            printf '%s\n' "$DEV_TFVARS" >> "${TF_DIR}/dev.tfvars"
          fi
          if [ -n "${DEV_TFVARS_EXTRA:-}" ]; then
            printf '%s\n' "$DEV_TFVARS_EXTRA" >> "${TF_DIR}/dev.tfvars"
          fi

      # backend.tf is gitignored (infra/terraform-container-apps/.gitignore), so a CI checkout carries no
      # backend block and plain `terraform init` silently selects the implicit local backend — empty state
      # on the runner disk. Materialize it from a secret, the same way dev.tfvars is materialized above.
      # Scoping the secret per GitHub Environment keeps each target on its own state key.
      - name: Materialize backend.tf from secret (optional)
        env:
          TF_BACKEND_TF: ${{ secrets.TF_BACKEND_TF }}
        run: |
          if [ -z "${TF_DIR:-}" ]; then
            exit 0
          fi
          if [ -z "${TF_BACKEND_TF:-}" ]; then
            echo "TF_BACKEND_TF not set — Terraform would use local state; the remote-state check reports this."
            exit 0
          fi
          printf '%s\n' "$TF_BACKEND_TF" > "${TF_DIR}/backend.tf"
          echo "Wrote ${TF_DIR}/backend.tf from the TF_BACKEND_TF secret."

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure deployment-target preflight
        env:
          EXPECTED_AZURE_TENANT_ID: ${{ vars.EXPECTED_AZURE_TENANT_ID }}
          EXPECTED_AZURE_SUBSCRIPTION_ID: ${{ vars.EXPECTED_AZURE_SUBSCRIPTION_ID }}
          EXPECTED_AZURE_RESOURCE_GROUP: ${{ vars.EXPECTED_AZURE_RESOURCE_GROUP }}
          EXPECTED_AZURE_LOCATION: ${{ vars.EXPECTED_AZURE_LOCATION }}
          EXPECTED_ACR_LOGIN_SERVER: ${{ vars.EXPECTED_ACR_LOGIN_SERVER }}
          EXPECTED_CONTAINER_APP_API_NAME: ${{ vars.EXPECTED_CONTAINER_APP_API_NAME }}
          EXPECTED_CONTAINER_APP_WORKER_NAME: ${{ vars.EXPECTED_CONTAINER_APP_WORKER_NAME }}
          EXPECTED_CONTAINER_APP_UI_NAME: ${{ vars.EXPECTED_CONTAINER_APP_UI_NAME }}
          EXPECTED_CONTAINER_APP_ENVIRONMENT_NAME: ${{ vars.EXPECTED_CONTAINER_APP_ENVIRONMENT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
          BUILD_ID: ${{ needs.build-push-images.outputs.build_id }}
        run: |
          set -euo pipefail
          ARGS=(
            --environment "${{ github.event.inputs.target || 'dev' }}"
            --build-id "${BUILD_ID:-${{ github.sha }}}"
            --summary-path "artifacts/deploy-target-preflight-plan-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.md"
          )
          if [ -n "${ACR_LOGIN_SERVER:-}" ] && [ -n "${AZURE_RESOURCE_GROUP:-}" ] && [ -n "${CONTAINER_APP_API_NAME:-}" ]; then
            ARGS+=(--check-resources)
          fi
          python3 scripts/ci/cd_deploy_target_preflight.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terraform plan gate
        id: plan_gate
        run: |
          if [ -z "${TF_DIR:-}" ]; then
            echo "TF_WORKING_DIRECTORY not set — skipping Terraform plan."
            echo "plan_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "plan_created=true" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.plan_gate.outputs.plan_created == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init and plan
        if: steps.plan_gate.outputs.plan_created == 'true'
        env:
          TARGET: ${{ github.event.inputs.target || 'dev' }}
          RUN_TERRAFORM_APPLY: ${{ github.event.inputs.run_terraform_apply }}
        run: |
          cd "$TF_DIR"
          terraform init -input=false
          # Without remote state the plan below proposes creating infrastructure that already exists, so
          # both the plan artifact and the guard assertions that read it are fiction. Warn on plan-only
          # runs (this job is continue-on-error there) and refuse when this run will actually apply.
          REQUIRE_REMOTE=""
          if [ "${RUN_TERRAFORM_APPLY:-}" = "true" ]; then
            REQUIRE_REMOTE="--require-remote"
          fi
          python3 "$GITHUB_WORKSPACE/scripts/ci/cd_assert_terraform_remote_state.py" \
            --terraform-dir . $REQUIRE_REMOTE || exit 1
          VAR_FILE_ARGS=""
          if [ "$TARGET" = "production" ] && [ -f production.tfvars ]; then
            VAR_FILE_ARGS="-var-file=production.tfvars"
          elif [ "$TARGET" = "staging" ] && [ -f terraform.tfvars ]; then
            VAR_FILE_ARGS="-var-file=terraform.tfvars"
          elif [ "$TARGET" = "dev" ] && [ -f dev.tfvars ]; then
            VAR_FILE_ARGS="-var-file=dev.tfvars"
          fi
          # terraform.tfvars is auto-loaded when present; explicit -var-file documents operator intent per target.
          terraform plan -input=false -out=tfplan $VAR_FILE_ARGS

      - name: Assert Terraform plan guards (regions + SQL backup redundancy)
        if: steps.plan_gate.outputs.plan_created == 'true'
        run: |
          cd "$TF_DIR"
          terraform show -json tfplan > "$RUNNER_TEMP/tfplan.json"
          python3 "$GITHUB_WORKSPACE/scripts/ci/assert_terraform_plan_data_regions.py" "$RUNNER_TEMP/tfplan.json"
          python3 "$GITHUB_WORKSPACE/scripts/ci/assert_sql_backup_regions.py" "$RUNNER_TEMP/tfplan.json"
          python3 "$GITHUB_WORKSPACE/scripts/ci/write_sql_backup_verification_artifact.py" \
            "$RUNNER_TEMP/tfplan.json" \
            "$GITHUB_WORKSPACE/archlucid-ui/public/sql-backup-region-verification.json"

      - name: Stage Terraform plan for artifact upload
        if: steps.plan_gate.outputs.plan_created == 'true'
        run: mkdir -p "$GITHUB_WORKSPACE/.cd-tfplan" && cp "$TF_DIR/tfplan" "$GITHUB_WORKSPACE/.cd-tfplan/tfplan"

      - name: Upload Terraform plan artifact
        if: steps.plan_gate.outputs.plan_created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.event.inputs.target || 'dev' }}
          path: .cd-tfplan/tfplan
          if-no-files-found: error

      - name: Terraform plan summary
        if: steps.plan_gate.outputs.plan_created == 'true'
        run: |
          cd "$TF_DIR"
          echo "## Terraform plan (${{ github.event.inputs.target || 'dev' }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```hcl' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: Terraform apply (${{ github.event.inputs.target || 'dev' }})
    needs: terraform-plan
    if: |
      (github.event.inputs.action || 'deploy') == 'deploy' &&
      (github.event.inputs.run_terraform_apply == true || github.event.inputs.run_terraform_apply == 'true') &&
      needs.terraform-plan.outputs.plan_created == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    env:
      TF_DIR: ${{ secrets.TF_WORKING_DIRECTORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure deployment-target preflight
        env:
          EXPECTED_AZURE_TENANT_ID: ${{ vars.EXPECTED_AZURE_TENANT_ID }}
          EXPECTED_AZURE_SUBSCRIPTION_ID: ${{ vars.EXPECTED_AZURE_SUBSCRIPTION_ID }}
          EXPECTED_AZURE_RESOURCE_GROUP: ${{ vars.EXPECTED_AZURE_RESOURCE_GROUP }}
          EXPECTED_AZURE_LOCATION: ${{ vars.EXPECTED_AZURE_LOCATION }}
          EXPECTED_ACR_LOGIN_SERVER: ${{ vars.EXPECTED_ACR_LOGIN_SERVER }}
          EXPECTED_CONTAINER_APP_API_NAME: ${{ vars.EXPECTED_CONTAINER_APP_API_NAME }}
          EXPECTED_CONTAINER_APP_WORKER_NAME: ${{ vars.EXPECTED_CONTAINER_APP_WORKER_NAME }}
          EXPECTED_CONTAINER_APP_UI_NAME: ${{ vars.EXPECTED_CONTAINER_APP_UI_NAME }}
          EXPECTED_CONTAINER_APP_ENVIRONMENT_NAME: ${{ vars.EXPECTED_CONTAINER_APP_ENVIRONMENT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
        run: |
          set -euo pipefail
          ARGS=(
            --environment "${{ github.event.inputs.target || 'dev' }}"
            --build-id "${{ github.sha }}"
            --summary-path "artifacts/deploy-target-preflight-apply-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.md"
          )
          if [ -n "${ACR_LOGIN_SERVER:-}" ] && [ -n "${AZURE_RESOURCE_GROUP:-}" ] && [ -n "${CONTAINER_APP_API_NAME:-}" ]; then
            ARGS+=(--check-resources)
          fi
          python3 scripts/ci/cd_deploy_target_preflight.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # Same gitignored-backend.tf problem as the plan job: without this, apply would initialize empty
      # local state and create a second copy of live infrastructure instead of converging it.
      - name: Materialize backend.tf from secret (optional)
        env:
          TF_BACKEND_TF: ${{ secrets.TF_BACKEND_TF }}
        run: |
          if [ -z "${TF_DIR:-}" ] || [ -z "${TF_BACKEND_TF:-}" ]; then
            exit 0
          fi
          printf '%s\n' "$TF_BACKEND_TF" > "${TF_DIR}/backend.tf"
          echo "Wrote ${TF_DIR}/backend.tf from the TF_BACKEND_TF secret."

      - name: Download Terraform plan
        uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ github.event.inputs.target || 'dev' }}
          path: ${{ runner.temp }}/tfplan-artifact

      - name: Terraform init and apply
        run: |
          cd "$TF_DIR"
          terraform init -input=false
          # Hard requirement here: applying against empty local state would create a second copy of live
          # infrastructure rather than converging the existing one.
          python3 "$GITHUB_WORKSPACE/scripts/ci/cd_assert_terraform_remote_state.py" \
            --terraform-dir . --require-remote || exit 1
          PLAN_FILE=$(find "${{ runner.temp }}/tfplan-artifact" -name tfplan -type f | head -1)
          if [ -z "$PLAN_FILE" ] || [ ! -f "$PLAN_FILE" ]; then
            echo "Could not locate downloaded tfplan under ${{ runner.temp }}/tfplan-artifact"
            exit 1
          fi
          cp "$PLAN_FILE" ./tfplan
          terraform apply -input=false tfplan

  deploy-container-apps:
    name: Deploy Container Apps (${{ github.event.inputs.target || 'dev' }})
    needs: [build-push-images, terraform-plan, terraform-apply]
    if: |
      always() &&
      (github.event.inputs.action || 'deploy') == 'deploy' &&
      needs.build-push-images.result == 'success' &&
      (needs.terraform-plan.result == 'success' || github.event.inputs.run_terraform_apply != 'true') &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    outputs:
      revision_before: ${{ steps.api_rev_before.outputs.revision }}
      revision_after: ${{ steps.api_rev_after.outputs.revision }}
      api_rev_before_skip: ${{ steps.api_rev_before.outputs.skip }}
      worker_revision_before: ${{ steps.worker_rev_before.outputs.revision }}
      worker_revision_after: ${{ steps.worker_rev_after.outputs.revision }}
      worker_rev_before_skip: ${{ steps.worker_rev_before.outputs.skip }}
      ui_revision_before: ${{ steps.ui_rev_before.outputs.revision }}
      ui_revision_after: ${{ steps.containerapp_update.outputs.u_latest }}
      ui_rev_before_skip: ${{ steps.ui_rev_before.outputs.skip }}
      ui_fqdn: ${{ steps.ui_fqdn.outputs.fqdn }}
      deploy_ran: ${{ steps.lineage_gate.outputs.deploy_ran }}
      verify_result: ${{ steps.verify_image.outputs.verify_result }}
      lkg_artifact: ${{ steps.capture_lkg.outputs.artifact_name }}
    env:
      BUILD_ID: ${{ needs.build-push-images.outputs.build_id }}
      IMAGE_TAG: ${{ needs.build-push-images.outputs.image_tag }}
      BUILD_TIMESTAMP: ${{ needs.build-push-images.outputs.build_timestamp }}
      API_IMAGE_DIGEST: ${{ needs.build-push-images.outputs.api_image_digest }}
      UI_IMAGE_DIGEST: ${{ needs.build-push-images.outputs.ui_image_digest }}
      IMAGES_PUSHED: ${{ needs.build-push-images.outputs.images_pushed }}
    steps:
      # Required before the RAG auto-heal step below: it invokes scripts/deploy/*.ps1 from
      # this job's workspace, which is otherwise empty (deploy-container-apps has no other
      # step that checks out the repo).
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure deployment-target preflight
        env:
          EXPECTED_AZURE_TENANT_ID: ${{ vars.EXPECTED_AZURE_TENANT_ID }}
          EXPECTED_AZURE_SUBSCRIPTION_ID: ${{ vars.EXPECTED_AZURE_SUBSCRIPTION_ID }}
          EXPECTED_AZURE_RESOURCE_GROUP: ${{ vars.EXPECTED_AZURE_RESOURCE_GROUP }}
          EXPECTED_AZURE_LOCATION: ${{ vars.EXPECTED_AZURE_LOCATION }}
          EXPECTED_ACR_LOGIN_SERVER: ${{ vars.EXPECTED_ACR_LOGIN_SERVER }}
          EXPECTED_CONTAINER_APP_API_NAME: ${{ vars.EXPECTED_CONTAINER_APP_API_NAME }}
          EXPECTED_CONTAINER_APP_WORKER_NAME: ${{ vars.EXPECTED_CONTAINER_APP_WORKER_NAME }}
          EXPECTED_CONTAINER_APP_UI_NAME: ${{ vars.EXPECTED_CONTAINER_APP_UI_NAME }}
          EXPECTED_CONTAINER_APP_ENVIRONMENT_NAME: ${{ vars.EXPECTED_CONTAINER_APP_ENVIRONMENT_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
        run: |
          set -euo pipefail
          ARGS=(
            --environment "${{ github.event.inputs.target || 'dev' }}"
            --build-id "${BUILD_ID:-${{ github.sha }}}"
            --summary-path "artifacts/deploy-target-preflight-deploy-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.md"
          )
          if [ -n "${ACR_LOGIN_SERVER:-}" ] && [ -n "${AZURE_RESOURCE_GROUP:-}" ] && [ -n "${CONTAINER_APP_API_NAME:-}" ]; then
            ARGS+=(--check-resources)
          fi
          python3 scripts/ci/cd_deploy_target_preflight.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require immutable digests before deploy
        id: lineage_gate
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${ACR_LOGIN_SERVER:-}" ] || [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ]; then
            echo "deploy_ran=false" >> "$GITHUB_OUTPUT"
            echo "Container Apps deploy not configured — skipping lineage gate."
            exit 0
          fi
          if [ "${IMAGES_PUSHED:-}" != "true" ]; then
            echo "::error::Deploy is configured but images were not pushed in this run (ACR missing at build)."
            exit 1
          fi
          if [ -z "${BUILD_ID:-}" ] || [ -z "${IMAGE_TAG:-}" ]; then
            echo "::error::Missing BUILD_ID or IMAGE_TAG from build-push-images outputs — refusing to infer tags."
            exit 1
          fi
          python3 scripts/ci/cd_deployment_lineage.py --require-digest "$API_IMAGE_DIGEST" --digest-name API_IMAGE_DIGEST
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
            python3 scripts/ci/cd_deployment_lineage.py --require-digest "$UI_IMAGE_DIGEST" --digest-name UI_IMAGE_DIGEST
          fi
          echo "deploy_ran=true" >> "$GITHUB_OUTPUT"
          echo "Lineage gate OK: BUILD_ID=${BUILD_ID} IMAGE_TAG=${IMAGE_TAG} API_DIGEST=${API_IMAGE_DIGEST} UI_DIGEST=${UI_IMAGE_DIGEST:-n/a}"

      - name: Pre-deploy registry manifest check
        if: steps.lineage_gate.outputs.deploy_ran == 'true'
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
        run: |
          set -euo pipefail
          REG_NAME="${ACR_NAME:-${ACR_LOGIN_SERVER%%.*}}"
          az acr login --name "$REG_NAME"
          echo "Checking registry manifests (no credentials logged): registry=${ACR_LOGIN_SERVER} tag=${IMAGE_TAG}"
          echo "Expected API digest: ${API_IMAGE_DIGEST}"
          az acr manifest show-metadata --registry "$REG_NAME" --name "archlucid-api@${API_IMAGE_DIGEST}" --query digest -o tsv
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
            echo "Expected UI digest: ${UI_IMAGE_DIGEST}"
            az acr manifest show-metadata --registry "$REG_NAME" --name "archlucid-ui@${UI_IMAGE_DIGEST}" --query digest -o tsv
          fi
          echo "Pre-deploy registry manifest check passed."

      # RAG retrieval (Azure AI Search) is ephemeral by design (owner 2026-07-05): dev auto-heals it
      # here on every deploy; a nightly job may stash + tear it back down (see rag-nightly-stash.yml).
      # No-op when the search service + index + Container App wiring already exist.
      # continue-on-error: a transient Azure capacity error (or any other auto-heal failure) here
      # must not block deploying the actual API/UI/worker images — RAG falls back to an InMemory
      # vector index when Retrieval__AzureSearch__Endpoint is unset (see the config completeness
      # check step below, which only warns, never fails CD, for this same reason).
      - name: Ensure RAG retrieval infra is awake (dev only, auto-heal)
        if: (github.event.inputs.target || 'dev') == 'dev'
        continue-on-error: true
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
        shell: pwsh
        run: |
          if (-not $env:AZURE_RESOURCE_GROUP -or -not $env:CONTAINER_APP_API_NAME) {
            Write-Host "Skipping RAG auto-heal (AZURE_RESOURCE_GROUP or CONTAINER_APP_API_NAME not set)."
            exit 0
          }
          $workerApp = if ($env:CONTAINER_APP_WORKER_NAME) { $env:CONTAINER_APP_WORKER_NAME } else { 'archlucid-worker' }
          # Call operator (&), not a bare path: the runner checks out this file without the
          # executable bit, and pwsh on Linux refuses to exec a non-executable file via ./path.
          & ./scripts/deploy/Ensure-RC6AzureSearchRetrieval.ps1 `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP `
            -ApiAppName $env:CONTAINER_APP_API_NAME `
            -WorkerAppName $workerApp

      - name: Record API revision before Container Apps update
        id: api_rev_before
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REV=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" --query "properties.latestRevisionName" -o tsv)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Record worker revision before Container Apps update
        id: worker_rev_before
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_WORKER_NAME:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REV=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_WORKER_NAME" --query "properties.latestRevisionName" -o tsv)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Record UI revision before Container Apps update
        id: ui_rev_before
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_UI_NAME:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REV=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" --query "properties.latestRevisionName" -o tsv)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Capture last-known-good release identity
        id: capture_lkg
        if: steps.lineage_gate.outputs.deploy_ran == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
          API_REV: ${{ steps.api_rev_before.outputs.revision }}
          WORKER_REV: ${{ steps.worker_rev_before.outputs.revision }}
          UI_REV: ${{ steps.ui_rev_before.outputs.revision }}
          API_SKIP: ${{ steps.api_rev_before.outputs.skip }}
          WORKER_SKIP: ${{ steps.worker_rev_before.outputs.skip }}
          UI_SKIP: ${{ steps.ui_rev_before.outputs.skip }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          ARTIFACT_NAME="cd-last-known-good-${TARGET}-${{ github.run_id }}"
          OUT="artifacts/${ARTIFACT_NAME}.json"
          mkdir -p artifacts
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

          read_rev_image() {
            local app="$1" rev="$2"
            if [ -z "$app" ] || [ -z "$rev" ]; then echo ""; return; fi
            az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$app" --revision "$rev" \
              --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true
          }
          read_rev_env() {
            local app="$1" rev="$2"
            if [ -z "$app" ] || [ -z "$rev" ]; then echo "[]"; return; fi
            az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$app" --revision "$rev" \
              --query "properties.template.containers[0].env" -o json 2>/dev/null || echo "[]"
          }

          API_ARGS=()
          if [ "${API_SKIP:-}" != "true" ] && [ -n "${API_REV:-}" ]; then
            API_ARGS+=(
              --api-app "$CONTAINER_APP_API_NAME"
              --api-revision "$API_REV"
              --api-image "$(read_rev_image "$CONTAINER_APP_API_NAME" "$API_REV")"
              --api-env-json "$(read_rev_env "$CONTAINER_APP_API_NAME" "$API_REV")"
            )
          fi
          WORKER_ARGS=()
          if [ "${WORKER_SKIP:-}" != "true" ] && [ -n "${WORKER_REV:-}" ]; then
            WORKER_ARGS+=(
              --worker-app "$CONTAINER_APP_WORKER_NAME"
              --worker-revision "$WORKER_REV"
              --worker-image "$(read_rev_image "$CONTAINER_APP_WORKER_NAME" "$WORKER_REV")"
              --worker-env-json "$(read_rev_env "$CONTAINER_APP_WORKER_NAME" "$WORKER_REV")"
            )
          fi
          UI_ARGS=()
          if [ "${UI_SKIP:-}" != "true" ] && [ -n "${UI_REV:-}" ]; then
            UI_ARGS+=(
              --ui-app "$CONTAINER_APP_UI_NAME"
              --ui-revision "$UI_REV"
              --ui-image "$(read_rev_image "$CONTAINER_APP_UI_NAME" "$UI_REV")"
              --ui-env-json "$(read_rev_env "$CONTAINER_APP_UI_NAME" "$UI_REV")"
            )
          fi

          python3 scripts/ci/cd_capture_last_known_good.py \
            --environment "$TARGET" \
            --json-out "$OUT" \
            "${API_ARGS[@]}" \
            "${WORKER_ARGS[@]}" \
            "${UI_ARGS[@]}"
          echo "lkg_path=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload last-known-good artifact
        if: steps.lineage_gate.outputs.deploy_ran == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.capture_lkg.outputs.artifact_name }}
          path: artifacts/cd-last-known-good-*.json
          if-no-files-found: warn

      # TB-756: informational only — same digest still rolls via --revision-suffix; do not block force-roll.
      - name: Note when active API revision already uses this digest (informational)
        if: steps.lineage_gate.outputs.deploy_ran == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          API_REV_BEFORE: ${{ steps.api_rev_before.outputs.revision }}
          API_REV_BEFORE_SKIP: ${{ steps.api_rev_before.outputs.skip }}
        run: |
          if [ "${API_REV_BEFORE_SKIP:-}" = "true" ] || [ -z "${API_REV_BEFORE:-}" ]; then
            exit 0
          fi
          set -euo pipefail
          ACTIVE_IMAGE=$(az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
            --revision "$API_REV_BEFORE" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          if [ -z "$ACTIVE_IMAGE" ]; then
            exit 0
          fi
          if echo "$ACTIVE_IMAGE" | grep -qF "${API_IMAGE_DIGEST}"; then
            echo "::notice title=Digest unchanged (TB-756)::Active API revision ${API_REV_BEFORE} already runs digest ${API_IMAGE_DIGEST}. CD will still create a new revision (--revision-suffix + CD_DEPLOY_RUN). Skip manual reruns when only docs/scripts changed and no image rebuild is needed."
            echo "digest_unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "digest_unchanged=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail fast before the deploy if the API Container App is missing required env vars for the RC6
      # production-like configuration. Catches config drift before wasting time on a bad deployment.
      - name: Configuration completeness check (pre-deploy)
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          DEV_PRIVATE_BETA_AUTH_ENABLED: ${{ vars.DEV_PRIVATE_BETA_AUTH_ENABLED }}
          DEV_OPERATOR_UI_BASE_URL: ${{ vars.DEV_OPERATOR_UI_BASE_URL }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ]; then
            echo "Config check skipped (AZURE_RESOURCE_GROUP or CONTAINER_APP_API_NAME not set)."
            exit 0
          fi
          set -euo pipefail
          # Fetch the Container App env var list (name + value or secretRef) from the active template.
          ENV_JSON=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
            --query "properties.template.containers[0].env" -o json 2>/dev/null || echo "[]")

          # Returns the literal value of a named env var, or "(secret-ref)" if it is bound to a secret,
          # or "" when the name is absent entirely.
          env_value() {
            local name="$1"
            local val ref
            val=$(echo "$ENV_JSON" | jq -r --arg n "$name" '.[] | select(.name==$n) | .value // empty' 2>/dev/null || true)
            ref=$(echo "$ENV_JSON" | jq -r --arg n "$name" '.[] | select(.name==$n) | .secretRef // empty' 2>/dev/null || true)
            if [ -n "$val" ]; then echo "$val"; elif [ -n "$ref" ]; then echo "(secret-ref)"; fi
          }

          is_set()    { [ -n "$(env_value "$1")" ]; }
          is_exact()  { [ "$(env_value "$1")" = "$2" ]; }
          # Returns true if the value looks like a GUID (case-insensitive, with or without braces).
          is_guid()   { echo "$(env_value "$1")" | grep -qiE '^[{]?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[}]?$'; }

          FAILED=0
          fail() { echo "::error::CONFIG: $*"; FAILED=1; }

          is_exact "ArchLucid__SqlTopology__Mode" "SystemWithPerTenantCatalogs" \
            || fail "ArchLucid__SqlTopology__Mode must be 'SystemWithPerTenantCatalogs'"
          is_set "ConnectionStrings__ArchLucidSystem" \
            || fail "ConnectionStrings__ArchLucidSystem is not set"
          is_set "ArchLucid__SqlTopology__TenantCatalogConnectionStringTemplate" \
            || fail "ArchLucid__SqlTopology__TenantCatalogConnectionStringTemplate is not set"
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          if [ "${DEV_PRIVATE_BETA_AUTH_ENABLED:-}" = "true" ] && [ "$TARGET" = "dev" ]; then
            is_exact "ArchLucidAuth__Mode" "JwtBearer" \
              || fail "ArchLucidAuth__Mode must be 'JwtBearer' when DEV_PRIVATE_BETA_AUTH_ENABLED=true"
            if ! is_set "ArchLucidAuth__JwtSigningPublicKeyPem"; then
              is_set "ArchLucidAuth__JwtSigningPublicKeyPemPath" \
                || fail "ArchLucidAuth__JwtSigningPublicKeyPem or JwtSigningPublicKeyPemPath is not set"
            fi
            is_set "ArchLucidAuth__JwtLocalIssuer" \
              || fail "ArchLucidAuth__JwtLocalIssuer is not set"
            is_set "ArchLucidAuth__JwtLocalAudience" \
              || fail "ArchLucidAuth__JwtLocalAudience is not set"
            is_exact "Auth__EmailOtp__Enabled" "true" \
              || fail "Auth__EmailOtp__Enabled must be 'true'"
            is_set "Auth__EmailOtp__HashPepper" \
              || fail "Auth__EmailOtp__HashPepper is not set"
            is_set "Email__OperatorBaseUrl" \
              || fail "Email__OperatorBaseUrl is not set"
            is_exact "Email__Provider" "AzureCommunicationServices" \
              || fail "Email__Provider must be 'AzureCommunicationServices'"
            is_set "Email__AzureCommunicationServicesEndpoint" \
              || fail "Email__AzureCommunicationServicesEndpoint is not set"
            is_set "Email__FromAddress" \
              || fail "Email__FromAddress is not set"
            is_set "Cors__AllowedOrigins__0" \
              || fail "Cors__AllowedOrigins__0 is not set"
          else
            is_exact "ArchLucidAuth__Mode" "ApiKey" \
              || fail "ArchLucidAuth__Mode must be 'ApiKey'"
            is_exact "Authentication__ApiKey__Enabled" "true" \
              || fail "Authentication__ApiKey__Enabled must be 'true'"
            is_set "Authentication__ApiKey__AdminKey" \
              || fail "Authentication__ApiKey__AdminKey is not set"
            is_guid "Authentication__ApiKey__TenantId" \
              || fail "Authentication__ApiKey__TenantId is not a valid GUID"
            # TB-304: Staging-like hosts reject header/default scope — ApiKey must mint workspace+project claims too.
            # target=dev: heal ScopeIds defaults when missing (Central US cutover left TenantId-only).
            if [ "$TARGET" = "dev" ]; then
              if ! is_guid "Authentication__ApiKey__WorkspaceId" \
                || ! is_guid "Authentication__ApiKey__ProjectId"; then
                echo "Healing ApiKey workspace/project scope claims on target=dev (ScopeIds defaults)..."
                az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
                  --set-env-vars \
                    "Authentication__ApiKey__TenantId=11111111-1111-1111-1111-111111111111" \
                    "Authentication__ApiKey__WorkspaceId=22222222-2222-2222-2222-222222222222" \
                    "Authentication__ApiKey__ProjectId=33333333-3333-3333-3333-333333333333" \
                  -o none
                ENV_JSON=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
                  --query "properties.template.containers[0].env" -o json 2>/dev/null || echo "[]")
              fi
            fi
            is_guid "Authentication__ApiKey__WorkspaceId" \
              || fail "Authentication__ApiKey__WorkspaceId is not a valid GUID (required with TenantId for TB-304)"
            is_guid "Authentication__ApiKey__ProjectId" \
              || fail "Authentication__ApiKey__ProjectId is not a valid GUID (required with TenantId for TB-304)"
          fi
          # Hosted RC/dev keeps Contoso showcase seed on every API revision (sample-run deep links).
          # Staging/production must never enable Demo — buyer/pilot hosts stay seed-free.
          # ASPNETCORE_ENVIRONMENT=Staging (not Production) so Demo:Enabled passes production-profile safety rules.
          # Demo__SaaSGuestSeedEnabled allows idempotent POST /v1/demo/seed on Staging (startup seed alone is EnableShowcaseSeed).
          if [ "${{ github.event.inputs.target || 'dev' }}" = "dev" ]; then
            if ! is_exact "Demo__Enabled" "true" \
              || ! is_exact "Demo__EnableShowcaseSeed" "true" \
              || ! is_exact "Demo__SaaSGuestSeedEnabled" "true" \
              || ! is_exact "ASPNETCORE_ENVIRONMENT" "Staging"; then
              echo "Healing Contoso showcase seed env on target=dev (Staging + Demo__Enabled + Demo__EnableShowcaseSeed + Demo__SaaSGuestSeedEnabled)..."
              az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
                --set-env-vars \
                  "ASPNETCORE_ENVIRONMENT=Staging" \
                  "Demo__Enabled=true" \
                  "Demo__EnableShowcaseSeed=true" \
                  "Demo__SaaSGuestSeedEnabled=true" \
                -o none
              ENV_JSON=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
                --query "properties.template.containers[0].env" -o json 2>/dev/null || echo "[]")
            fi
            is_exact "Demo__Enabled" "true" \
              || fail "Demo__Enabled must be 'true' on target=dev (Contoso showcase seed)"
            is_exact "Demo__EnableShowcaseSeed" "true" \
              || fail "Demo__EnableShowcaseSeed must be 'true' on target=dev"
            is_exact "Demo__SaaSGuestSeedEnabled" "true" \
              || fail "Demo__SaaSGuestSeedEnabled must be 'true' on target=dev (POST /v1/demo/seed on Staging)"
            is_exact "ASPNETCORE_ENVIRONMENT" "Staging" \
              || fail "ASPNETCORE_ENVIRONMENT must be 'Staging' on target=dev (Demo:Enabled cannot run under Production)"
            is_set "Cors__AllowedOrigins__0" \
              || fail "Cors__AllowedOrigins__0 is not set"
          else
            is_exact "Demo__Enabled" "false" \
              || fail "Demo__Enabled must be 'false'"
            # staging/production: marketing apex (+ www) required; app host required once dual-CA is wired (TB-2016).
            # Dev uses Container Apps FQDN or an operator-chosen custom domain (PILOT_PROFILE.md).
            cors0=$(env_value "Cors__AllowedOrigins__0")
            cors1=$(env_value "Cors__AllowedOrigins__1")
            cors2=$(env_value "Cors__AllowedOrigins__2")
            cors_joined="${cors0}|${cors1}|${cors2}"
            echo "$cors_joined" | grep -Eq '(^|[|])https://(www\.)?archlucid\.net([|]|$)' \
              || fail "Cors__AllowedOrigins must include https://archlucid.net or https://www.archlucid.net"
            if echo "$cors_joined" | grep -Eq '(^|[|])https://app\.archlucid\.net([|]|$)'; then
              echo "Cors includes https://app.archlucid.net (operator UI host)."
            else
              echo "::warning::Cors__AllowedOrigins does not yet include https://app.archlucid.net — set before cutover to dual-CA operator host (TB-2016)."
            fi
          fi
          is_exact "Billing__Provider" "None" \
            || fail "Billing__Provider must be 'None'"
          is_exact "ArchLucid__Secrets__Provider" "KeyVault" \
            || fail "ArchLucid__Secrets__Provider must be 'KeyVault'"
          is_set "ArchLucid__Secrets__KeyVaultUri" \
            || fail "ArchLucid__Secrets__KeyVaultUri is not set"
          is_set "ArchLucid__ContentSafety__Endpoint" \
            || fail "ArchLucid__ContentSafety__Endpoint is not set"
          is_set "ArchLucid__ContentSafety__ApiKey" \
            || fail "ArchLucid__ContentSafety__ApiKey is not set"

          # Retrieval (Azure AI Search) is ephemeral by design (owner 2026-07-05): the search
          # service is recreated on demand and torn down by a nightly job to avoid idle cost.
          # Only warn (never block CD) when it is absent; ArchLucid falls back to InMemory vector
          # index when Retrieval__VectorIndex is unset.
          if is_set "Retrieval__AzureSearch__Endpoint"; then
            is_exact "Retrieval__VectorIndex" "AzureSearch" \
              || echo "::warning::Retrieval__AzureSearch__Endpoint is set but Retrieval__VectorIndex is not 'AzureSearch'"
            is_set "Retrieval__AzureSearch__IndexName" \
              || echo "::warning::Retrieval__AzureSearch__Endpoint is set but Retrieval__AzureSearch__IndexName is not"
            is_set "Retrieval__AzureSearch__ApiKey" \
              || echo "::warning::Retrieval__AzureSearch__Endpoint is set but Retrieval__AzureSearch__ApiKey is not"
          else
            echo "::notice::Retrieval__AzureSearch__Endpoint not set — RAG vector index is InMemory (search service is ephemeral, recreated on demand)."
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Pre-deploy configuration completeness check FAILED. Fix the API Container App env vars before retrying CD."
            exit 1
          fi
          echo "Configuration completeness check passed."

      # Terraform declares no ConnectionStrings for any Container App (TB-657 `lifecycle ignore_changes` in
      # infra/terraform-container-apps/main.tf), so SQL settings live out-of-band. The API app received that
      # treatment; the worker never did, so ArchLucid.Worker crash-looped on "Missing connection string
      # 'ArchLucid'." while CD still reported green — post-deploy smoke cannot probe the worker (no ingress).
      # Mirror the API's values onto the worker and verify, before the image roll so the new worker revision
      # inherits them. The planner skips names already in sync, so steady-state deploys add no extra revision.
      - name: Worker configuration heal and completeness check (pre-deploy)
        if: steps.lineage_gate.outputs.deploy_ran == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ] || [ -z "${CONTAINER_APP_WORKER_NAME:-}" ]; then
            echo "Worker config check skipped (AZURE_RESOURCE_GROUP, CONTAINER_APP_API_NAME, or CONTAINER_APP_WORKER_NAME not set)."
            exit 0
          fi
          set -euo pipefail

          read_container_env() {
            az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$1" \
              --query "properties.template.containers[0].env" -o json 2>/dev/null || echo "[]"
          }

          # The planner masks connection strings and writes the args file; it exits non-zero when a required
          # setting is available from neither app (fail closed rather than deploy a worker that cannot boot).
          SET_ARGS_FILE="${RUNNER_TEMP}/worker-sql-env-args.txt"
          python3 scripts/ci/cd_heal_worker_sql_config.py \
            --api-env-json "$(read_container_env "$CONTAINER_APP_API_NAME")" \
            --worker-env-json "$(read_container_env "$CONTAINER_APP_WORKER_NAME")" \
            --set-env-args-out "$SET_ARGS_FILE"

          # An empty file means the worker already matches the API — skip the update to avoid revision churn (TB-756).
          if [ ! -s "$SET_ARGS_FILE" ]; then
            exit 0
          fi

          # One NAME=VALUE per line; values are already registered with the Actions log masker.
          mapfile -t WORKER_SQL_ENV_ARGS < "$SET_ARGS_FILE"
          rm -f "$SET_ARGS_FILE"
          az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_WORKER_NAME" \
            --set-env-vars "${WORKER_SQL_ENV_ARGS[@]}" -o none

          python3 scripts/ci/cd_heal_worker_sql_config.py \
            --worker-env-json "$(read_container_env "$CONTAINER_APP_WORKER_NAME")" \
            --verify-only

      - name: Update Azure Container Apps (optional)
        id: containerapp_update
        if: steps.lineage_gate.outputs.deploy_ran == 'true'
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
          CONTAINER_APP_MARKETING_UI_NAME: ${{ secrets.CONTAINER_APP_MARKETING_UI_NAME }}
          CD_CANARY_ENABLED: ${{ vars.CD_CANARY_ENABLED }}
          ARCHLUCID_CONTENT_SAFETY_ENDPOINT: ${{ secrets.ARCHLUCID_CONTENT_SAFETY_ENDPOINT }}
          ARCHLUCID_CONTENT_SAFETY_API_KEY: ${{ secrets.ARCHLUCID_CONTENT_SAFETY_API_KEY }}
          DEV_PRIVATE_BETA_AUTH_ENABLED: ${{ vars.DEV_PRIVATE_BETA_AUTH_ENABLED }}
          DEV_OPERATOR_UI_BASE_URL: ${{ vars.DEV_OPERATOR_UI_BASE_URL }}
          DEV_JWT_LOCAL_ISSUER: ${{ vars.DEV_JWT_LOCAL_ISSUER }}
          DEV_JWT_LOCAL_AUDIENCE: ${{ vars.DEV_JWT_LOCAL_AUDIENCE }}
          DEV_JWT_PRIVATE_KEY_PEM: ${{ secrets.DEV_JWT_PRIVATE_KEY_PEM }}
          DEV_JWT_PUBLIC_KEY_PEM: ${{ secrets.DEV_JWT_PUBLIC_KEY_PEM }}
          DEV_EMAIL_OTP_HASH_PEPPER: ${{ secrets.DEV_EMAIL_OTP_HASH_PEPPER }}
          DEV_ACS_EMAIL_ENDPOINT: ${{ vars.DEV_ACS_EMAIL_ENDPOINT }}
          DEV_EMAIL_FROM_ADDRESS: ${{ vars.DEV_EMAIL_FROM_ADDRESS }}
          ARCHLUCID_API_KEY: ${{ secrets.ARCHLUCID_API_KEY }}
        run: |
          set -euo pipefail
          # Digest-only deploy — never resolve latest, never rebuild, never re-infer tag from github.sha.
          API_IMAGE="${ACR_LOGIN_SERVER}/archlucid-api@${API_IMAGE_DIGEST}"
          UI_IMAGE=""
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ] || [ -n "${CONTAINER_APP_MARKETING_UI_NAME:-}" ]; then
            UI_IMAGE="${ACR_LOGIN_SERVER}/archlucid-ui@${UI_IMAGE_DIGEST}"
          fi
          DEPLOY_STAMP="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
          REV_SFX="r${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT:-1}"
          echo "Deploy API image (digest): ${API_IMAGE}"
          echo "Deploy API tag (lineage): ${ACR_LOGIN_SERVER}/archlucid-api:${IMAGE_TAG}"
          # Content Safety: keep Endpoint + ApiKey on ArchLucid-owned Cognitive account (not longevity-*).
          # Secret name must be ≤20 chars (Azure CLI containerapp secret set limit).
          if [ -n "${ARCHLUCID_CONTENT_SAFETY_ENDPOINT:-}" ] && [ -n "${ARCHLUCID_CONTENT_SAFETY_API_KEY:-}" ]; then
            echo "Healing Content Safety env/secret on API Container App..."
            az containerapp secret set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
              --secrets "al-cs-key=${ARCHLUCID_CONTENT_SAFETY_API_KEY}" \
              -o none
          fi
          if [ "${DEV_PRIVATE_BETA_AUTH_ENABLED:-}" = "true" ] && [ "${{ github.event.inputs.target || 'dev' }}" = "dev" ]; then
            if [ -z "${DEV_JWT_PRIVATE_KEY_PEM:-}" ] || [ -z "${DEV_JWT_PUBLIC_KEY_PEM:-}" ] || [ -z "${DEV_EMAIL_OTP_HASH_PEPPER:-}" ]; then
              echo "::error::DEV_PRIVATE_BETA_AUTH_ENABLED=true requires secrets DEV_JWT_PRIVATE_KEY_PEM, DEV_JWT_PUBLIC_KEY_PEM, DEV_EMAIL_OTP_HASH_PEPPER"
              exit 1
            fi
            if [ -z "${DEV_OPERATOR_UI_BASE_URL:-}" ] || [ -z "${DEV_JWT_LOCAL_ISSUER:-}" ] || [ -z "${DEV_JWT_LOCAL_AUDIENCE:-}" ]; then
              echo "::error::DEV_PRIVATE_BETA_AUTH_ENABLED=true requires vars DEV_OPERATOR_UI_BASE_URL, DEV_JWT_LOCAL_ISSUER, DEV_JWT_LOCAL_AUDIENCE"
              exit 1
            fi
            if [ -z "${DEV_ACS_EMAIL_ENDPOINT:-}" ] || [ -z "${DEV_EMAIL_FROM_ADDRESS:-}" ]; then
              echo "::error::DEV_PRIVATE_BETA_AUTH_ENABLED=true requires vars DEV_ACS_EMAIL_ENDPOINT and DEV_EMAIL_FROM_ADDRESS (ACS transactional email for OTP)."
              exit 1
            fi
            OPERATOR_BASE="${DEV_OPERATOR_UI_BASE_URL%/}"
            echo "Healing dev private-beta auth secrets/env on API Container App..."
            az containerapp secret set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
              --secrets \
                "al-jwt-priv=${DEV_JWT_PRIVATE_KEY_PEM}" \
                "al-jwt-pub=${DEV_JWT_PUBLIC_KEY_PEM}" \
                "al-otp-pepper=${DEV_EMAIL_OTP_HASH_PEPPER}" \
              -o none
          fi
          # target=dev: pin Contoso showcase seed env on every API roll (idempotent startup seed).
          API_ENV_VARS=(
            "CD_DEPLOY_RUN=$DEPLOY_STAMP"
            "ARCHLUCID_DEPLOY_STAMP=$DEPLOY_STAMP"
            "ARCHLUCID_BUILD_TIMESTAMP=$BUILD_TIMESTAMP"
            "ARCHLUCID_BUILD_COMMIT_SHA=$BUILD_ID"
          )
          if [ "${{ github.event.inputs.target || 'dev' }}" = "dev" ]; then
            API_ENV_VARS+=(
              "ASPNETCORE_ENVIRONMENT=Staging"
              "Demo__Enabled=true"
              "Demo__EnableShowcaseSeed=true"
              "Demo__SaaSGuestSeedEnabled=true"
            )
            echo "Dev Contoso seed env: ASPNETCORE_ENVIRONMENT=Staging Demo__Enabled=true Demo__EnableShowcaseSeed=true Demo__SaaSGuestSeedEnabled=true"
          fi
          if [ "${DEV_PRIVATE_BETA_AUTH_ENABLED:-}" = "true" ] && [ "${{ github.event.inputs.target || 'dev' }}" = "dev" ]; then
            OPERATOR_BASE="${DEV_OPERATOR_UI_BASE_URL%/}"
            API_ENV_VARS+=(
              "ArchLucidAuth__Mode=JwtBearer"
              "ArchLucidAuth__JwtSigningPublicKeyPem=secretref:al-jwt-pub"
              "ArchLucidAuth__JwtLocalIssuer=${DEV_JWT_LOCAL_ISSUER}"
              "ArchLucidAuth__JwtLocalAudience=${DEV_JWT_LOCAL_AUDIENCE}"
              "Auth__Trial__LocalIdentity__JwtPrivateKeyPem=secretref:al-jwt-priv"
              "Auth__Trial__LocalIdentity__JwtIssuer=${DEV_JWT_LOCAL_ISSUER}"
              "Auth__Trial__LocalIdentity__JwtAudience=${DEV_JWT_LOCAL_AUDIENCE}"
              "Auth__EmailOtp__Enabled=true"
              "Auth__EmailOtp__HashPepper=secretref:al-otp-pepper"
              "Email__OperatorBaseUrl=${OPERATOR_BASE}"
              "Cors__AllowedOrigins__0=${OPERATOR_BASE}"
              "Email__Provider=AzureCommunicationServices"
              "Email__AzureCommunicationServicesEndpoint=${DEV_ACS_EMAIL_ENDPOINT}"
              "Email__FromAddress=${DEV_EMAIL_FROM_ADDRESS}"
              "Email__FromDisplayName=ArchLucid"
            )
            echo "Dev private-beta auth env: JwtBearer + email OTP + ACS From=${DEV_EMAIL_FROM_ADDRESS}"
          elif [ "${{ github.event.inputs.target || 'dev' }}" = "dev" ]; then
            # ApiKey + Staging: pin TB-304 trusted scope claims (ScopeIds defaults) on every API roll.
            API_ENV_VARS+=(
              "Authentication__ApiKey__TenantId=11111111-1111-1111-1111-111111111111"
              "Authentication__ApiKey__WorkspaceId=22222222-2222-2222-2222-222222222222"
              "Authentication__ApiKey__ProjectId=33333333-3333-3333-3333-333333333333"
            )
            echo "Dev ApiKey scope claims: Tenant/Workspace/Project ScopeIds defaults (TB-304)"
          fi
          if [ -n "${ARCHLUCID_CONTENT_SAFETY_ENDPOINT:-}" ] && [ -n "${ARCHLUCID_CONTENT_SAFETY_API_KEY:-}" ]; then
            API_ENV_VARS+=(
              "ArchLucid__ContentSafety__Endpoint=${ARCHLUCID_CONTENT_SAFETY_ENDPOINT}"
              "ArchLucid__ContentSafety__ApiKey=secretref:al-cs-key"
              "ArchLucid__ContentSafety__FailClosedOnSdkError=true"
            )
          fi
          A_LATEST=$(az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" --image "$API_IMAGE" \
            --revision-suffix "$REV_SFX" --set-env-vars "${API_ENV_VARS[@]}" \
            --query "properties.latestRevisionName" -o tsv)
          if [ -n "${CONTAINER_APP_WORKER_NAME:-}" ]; then
            W_LATEST=$(az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_WORKER_NAME" --image "$API_IMAGE" \
              --revision-suffix "$REV_SFX" --set-env-vars "CD_DEPLOY_RUN=$DEPLOY_STAMP" \
                "ARCHLUCID_DEPLOY_STAMP=$DEPLOY_STAMP" \
                "ARCHLUCID_BUILD_TIMESTAMP=$BUILD_TIMESTAMP" "ARCHLUCID_BUILD_COMMIT_SHA=$BUILD_ID" \
              --query "properties.latestRevisionName" -o tsv)
          fi
          API_FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
          UI_ENV_VARS=(
            "CD_DEPLOY_RUN=$DEPLOY_STAMP"
          )
          if [ -n "${API_FQDN:-}" ]; then
            UI_ENV_VARS+=("ARCHLUCID_API_BASE_URL=https://${API_FQDN}")
            echo "UI ARCHLUCID_API_BASE_URL=https://${API_FQDN}"
          else
            echo "::warning::Could not resolve API ingress FQDN — UI ARCHLUCID_API_BASE_URL not healed this run."
          fi
          if [ -n "${ARCHLUCID_API_KEY:-}" ]; then
            echo "Healing ARCHLUCID_API_KEY secret on UI Container App(s)..."
            if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
              az containerapp secret set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" \
                --secrets "al-ui-apikey=${ARCHLUCID_API_KEY}" \
                -o none
            fi
            if [ -n "${CONTAINER_APP_MARKETING_UI_NAME:-}" ]; then
              az containerapp secret set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_MARKETING_UI_NAME" \
                --secrets "al-ui-apikey=${ARCHLUCID_API_KEY}" \
                -o none
            fi
            UI_ENV_VARS+=("ARCHLUCID_API_KEY=secretref:al-ui-apikey")
          else
            echo "::warning::ARCHLUCID_API_KEY secret unset — UI proxy will 403 on Staging ApiKey hosts without server-side key."
          fi
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ] && [ -n "${UI_IMAGE}" ]; then
            echo "Deploy UI image (digest): ${UI_IMAGE}"
            echo "Deploy UI tag (lineage): ${ACR_LOGIN_SERVER}/archlucid-ui:${IMAGE_TAG}"
            U_LATEST=$(az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" --image "$UI_IMAGE" \
              --revision-suffix "$REV_SFX" --set-env-vars "${UI_ENV_VARS[@]}" \
              --query "properties.latestRevisionName" -o tsv)
          fi
          if [ -n "${CONTAINER_APP_MARKETING_UI_NAME:-}" ] && [ -n "${UI_IMAGE}" ]; then
            echo "Deploy marketing UI (same digest): ${UI_IMAGE}"
            M_LATEST=$(az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_MARKETING_UI_NAME" --image "$UI_IMAGE" \
              --revision-suffix "$REV_SFX" --set-env-vars "${UI_ENV_VARS[@]}" \
              --query "properties.latestRevisionName" -o tsv)
          fi
          # Pin 100% ingress when multiple revisions exist (traffic can stay on an older revision). Skip API when canary
          # is enabled — the canary step splits API traffic next. Revision names come from the update calls above.
          if [ "${CD_CANARY_ENABLED:-}" != "true" ]; then
            if [ -n "${A_LATEST:-}" ]; then
              az containerapp ingress traffic set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" --revision-weight "${A_LATEST}=100" \
                || echo "API: ingress traffic set skipped."
            fi
          fi
          if [ -n "${CONTAINER_APP_WORKER_NAME:-}" ]; then
            if [ -n "${W_LATEST:-}" ]; then
              az containerapp ingress traffic set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_WORKER_NAME" --revision-weight "${W_LATEST}=100" \
                || echo "Worker: ingress traffic set skipped (no ingress or single-revision)."
            fi
          fi
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
            if [ -n "${U_LATEST:-}" ]; then
              az containerapp ingress traffic set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" --revision-weight "${U_LATEST}=100" \
                || echo "UI: ingress traffic set skipped (no ingress or single-revision)."
            fi
          fi
          if [ -n "${CONTAINER_APP_MARKETING_UI_NAME:-}" ]; then
            if [ -n "${M_LATEST:-}" ]; then
              az containerapp ingress traffic set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_MARKETING_UI_NAME" --revision-weight "${M_LATEST}=100" \
                || echo "Marketing UI: ingress traffic set skipped (no ingress or single-revision)."
            fi
          fi
          # Export revision names for subsequent verification steps.
          echo "a_latest=${A_LATEST:-}" >> "$GITHUB_OUTPUT"
          echo "w_latest=${W_LATEST:-}" >> "$GITHUB_OUTPUT"
          echo "u_latest=${U_LATEST:-}" >> "$GITHUB_OUTPUT"
          echo "m_latest=${M_LATEST:-}" >> "$GITHUB_OUTPUT"

      # Hard-fail if the deployed revision's image does not contain the expected digest from this run.
      # Soft-skip only when deploy_ran=false (Azure deploy not configured for this environment).
      - name: Verify deployed revisions use the SHA-tagged image
        id: verify_image
        env:
          DEPLOY_RAN: ${{ steps.lineage_gate.outputs.deploy_ran }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
          A_LATEST: ${{ steps.containerapp_update.outputs.a_latest }}
          W_LATEST: ${{ steps.containerapp_update.outputs.w_latest }}
          U_LATEST: ${{ steps.containerapp_update.outputs.u_latest }}
        run: |
          set -euo pipefail
          if [ "${DEPLOY_RAN:-}" != "true" ]; then
            echo "verify_result=skipped" >> "$GITHUB_OUTPUT"
            echo "Image verification skipped (deploy_ran=false)."
            exit 0
          fi
          EXPECTED_API="${API_IMAGE_DIGEST}"
          EXPECTED_UI="${UI_IMAGE_DIGEST:-}"

          FAILED=0
          check_image() {
            local app_name="$1" rev="$2" expected="$3"
            if [ -z "${app_name:-}" ] || [ -z "${rev:-}" ] || [ -z "${expected:-}" ]; then
              return
            fi
            local img
            img=$(az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$app_name" --revision "$rev" \
              --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
            echo "  ${app_name}: revision=${rev} image=${img}"
            if [ -z "$img" ]; then
              echo "::error::IMAGE VERIFY: Could not read image for ${app_name} revision ${rev}"
              FAILED=1
            elif ! echo "$img" | grep -qF "$expected"; then
              echo "::error::IMAGE VERIFY: ${app_name} revision ${rev} image '${img}' does not contain expected digest '${expected}'."
              FAILED=1
            fi
          }

          echo "Verifying deployed revision images (expected digest: ${EXPECTED_API}):"
          check_image "$CONTAINER_APP_API_NAME"    "${A_LATEST}" "$EXPECTED_API"
          check_image "$CONTAINER_APP_WORKER_NAME" "${W_LATEST}" "$EXPECTED_API"
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
            check_image "$CONTAINER_APP_UI_NAME" "${U_LATEST}" "$EXPECTED_UI"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "verify_result=failure" >> "$GITHUB_OUTPUT"
            echo "::error::Deployed revision image verification FAILED — refusing success for this deploy."
            exit 1
          fi
          echo "verify_result=success" >> "$GITHUB_OUTPUT"
          echo "All deployed revisions verified — images match expected digest from this build."

      # Wait for the API revision to reach Running state and confirm 100% traffic before smoke tests begin.
      # Prevents smoke checks from hitting an older revision while the new one is still starting.
      - name: Wait for API revision Running state and 100% traffic
        id: api_running_check
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          A_LATEST: ${{ steps.containerapp_update.outputs.a_latest }}
          CD_CANARY_ENABLED: ${{ vars.CD_CANARY_ENABLED }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ] || [ -z "${A_LATEST:-}" ]; then
            echo "Running-state check skipped."
            exit 0
          fi
          set -euo pipefail
          # Large tenant DDL bootstrap on a behind catalog can exceed 3 minutes on cold start.
          MAX_WAIT=300
          INTERVAL=10
          ELAPSED=0
          echo "Waiting for API revision ${A_LATEST} to reach Running state (max ${MAX_WAIT}s)..."
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            STATE=$(az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
              --revision "$A_LATEST" --query "properties.runningState" -o tsv 2>/dev/null || true)
            echo "  [${ELAPSED}s] runningState=${STATE}"
            # maxReplicas=1 reports RunningAtMaxScale instead of Running — treat as healthy.
            if [ "$STATE" = "Running" ] || [ "$STATE" = "RunningAtMaxScale" ]; then break; fi
            # Azure reports ActivationFailed/Degraded — not plain Failed — when startup crashes.
            if [ "$STATE" = "Failed" ] || [ "$STATE" = "Stopped" ] || [ "$STATE" = "ActivationFailed" ] || [ "$STATE" = "Degraded" ]; then
              echo "::error::API revision ${A_LATEST} entered state '${STATE}' — startup failure. Check Container Apps logs."
              exit 1
            fi
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          if [ "$STATE" != "Running" ] && [ "$STATE" != "RunningAtMaxScale" ]; then
            echo "::error::API revision ${A_LATEST} did not reach Running state within ${MAX_WAIT}s (last state: ${STATE})."
            exit 1
          fi
          echo "API revision ${A_LATEST} is healthy (${STATE})."
          # Verify 100% traffic weight when not in canary mode.
          if [ "${CD_CANARY_ENABLED:-}" != "true" ]; then
            TRAFFIC_MAX_WAIT=120
            TRAFFIC_ELAPSED=0
            WEIGHT="0"
            echo "Waiting for API revision ${A_LATEST} to receive 100% ingress traffic (max ${TRAFFIC_MAX_WAIT}s)..."
            while [ "$TRAFFIC_ELAPSED" -lt "$TRAFFIC_MAX_WAIT" ]; do
              # Ingress may route via latestRevision=true without an explicit revisionName field.
              WEIGHT=$(az containerapp ingress traffic show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" \
                --query "[?revisionName=='${A_LATEST}' || latestRevision==\`true\`].weight | [0]" -o tsv 2>/dev/null || echo "0")
              echo "  [${TRAFFIC_ELAPSED}s] trafficWeight=${WEIGHT}%"
              if [ "${WEIGHT}" = "100" ]; then break; fi
              sleep "$INTERVAL"
              TRAFFIC_ELAPSED=$((TRAFFIC_ELAPSED + INTERVAL))
            done
            if [ "${WEIGHT}" != "100" ]; then
              echo "::error::API revision ${A_LATEST} does not have 100% traffic (weight=${WEIGHT}). Ingress may still point to an older revision."
              exit 1
            fi
            echo "API revision ${A_LATEST} has 100% traffic — deployment verified."
          fi

      # Export the UI FQDN so the smoke-test job can check the public URL without needing Azure login.
      - name: Export UI public FQDN
        id: ui_fqdn
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_UI_NAME:-}" ]; then
            echo "fqdn=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" \
            --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"
          echo "UI FQDN: ${FQDN}"

      - name: Record API revision after update
        id: api_rev_after
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ]; then
            echo "revision=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REV=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" --query "properties.latestRevisionName" -o tsv)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      - name: Record worker revision after update
        id: worker_rev_after
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
        run: |
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_WORKER_NAME:-}" ]; then
            echo "revision=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REV=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_WORKER_NAME" --query "properties.latestRevisionName" -o tsv)
          echo "revision=$REV" >> "$GITHUB_OUTPUT"

      # Canary: requires api_revision_mode = Multiple on the API Container App (Terraform). See docs/runbooks/PRODUCTION_DEPLOYMENT.md#part-c--canary-promotion-container-apps.
      - name: Canary API traffic split (optional)
        if: success()
        env:
          CD_CANARY_ENABLED: ${{ vars.CD_CANARY_ENABLED }}
          CD_CANARY_INITIAL_PERCENT: ${{ vars.CD_CANARY_INITIAL_PERCENT }}
          CD_CANARY_BAKE_MINUTES: ${{ vars.CD_CANARY_BAKE_MINUTES }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
        run: |
          set -e
          if [ "${CD_CANARY_ENABLED:-}" != "true" ]; then
            echo "CD_CANARY_ENABLED is not true — skipping canary traffic split."
            exit 0
          fi
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ]; then
            echo "Missing AZURE_RESOURCE_GROUP or CONTAINER_APP_API_NAME — skipping canary."
            exit 0
          fi
          BEFORE="${{ steps.api_rev_before.outputs.revision }}"
          AFTER="${{ steps.api_rev_after.outputs.revision }}"
          SKIP="${{ steps.api_rev_before.outputs.skip }}"
          if [ "$SKIP" = "true" ] || [ -z "$BEFORE" ] || [ -z "$AFTER" ] || [ "$BEFORE" = "$AFTER" ]; then
            echo "No distinct revision pair — skipping canary split."
            exit 0
          fi
          PCT="${CD_CANARY_INITIAL_PERCENT:-10}"
          case "$PCT" in ''|*[!0-9]*) PCT=10 ;; esac
          if [ "$PCT" -lt 1 ] || [ "$PCT" -gt 99 ]; then
            echo "CD_CANARY_INITIAL_PERCENT must be 1-99; got $PCT — using 10."
            PCT=10
          fi
          OLDWT=$((100 - PCT))
          echo "Splitting API traffic: revision $BEFORE=${OLDWT}%, revision $AFTER=${PCT}%"
          az containerapp ingress traffic set \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$CONTAINER_APP_API_NAME" \
            --revision-weight "${BEFORE}=${OLDWT}" "${AFTER}=${PCT}"
          BAKE="${CD_CANARY_BAKE_MINUTES:-0}"
          case "$BAKE" in ''|*[!0-9]*) BAKE=0 ;; esac
          if [ "$BAKE" -gt 0 ]; then
            echo "Canary bake: sleeping ${BAKE} minute(s) before smoke job."
            sleep $((BAKE * 60))
          fi

  smoke-test:
    name: Post-deploy validation (${{ github.event.inputs.target || 'dev' }})
    needs: [build-push-images, deploy-container-apps]
    # always() is required here: without it, GitHub's implicit success() check walks the
    # entire transitive needs graph (including terraform-apply, which is intentionally
    # 'skipped' when run_terraform_apply=false) and silently skips this job even though
    # deploy-container-apps itself succeeded.
    if: |
      always() &&
      (github.event.inputs.action || 'deploy') == 'deploy' &&
      needs.deploy-container-apps.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Mint smoke Bearer JWT (dev private-beta auth)
        if: vars.DEV_PRIVATE_BETA_AUTH_ENABLED == 'true' && (github.event.inputs.target || 'dev') == 'dev'
        env:
          DEV_JWT_PRIVATE_KEY_PEM: ${{ secrets.DEV_JWT_PRIVATE_KEY_PEM }}
          DEV_JWT_LOCAL_ISSUER: ${{ vars.DEV_JWT_LOCAL_ISSUER }}
          DEV_JWT_LOCAL_AUDIENCE: ${{ vars.DEV_JWT_LOCAL_AUDIENCE }}
        run: |
          set -euo pipefail
          if [ -z "${DEV_JWT_PRIVATE_KEY_PEM:-}" ] || [ -z "${DEV_JWT_LOCAL_ISSUER:-}" ] || [ -z "${DEV_JWT_LOCAL_AUDIENCE:-}" ]; then
            echo "::error::Cannot mint smoke JWT — set DEV_JWT_PRIVATE_KEY_PEM secret and DEV_JWT_LOCAL_ISSUER / DEV_JWT_LOCAL_AUDIENCE vars."
            exit 1
          fi
          pip install --quiet PyJWT cryptography
          printf '%s' "$DEV_JWT_PRIVATE_KEY_PEM" > /tmp/dev-smoke-jwt-priv.pem
          TOKEN=$(python3 scripts/ci/mint_ci_jwt.py \
            --private-key /tmp/dev-smoke-jwt-priv.pem \
            --issuer "$DEV_JWT_LOCAL_ISSUER" \
            --audience "$DEV_JWT_LOCAL_AUDIENCE" \
            --name "CdSmokeAdmin" \
            --roles Admin \
            --print-token)
          rm -f /tmp/dev-smoke-jwt-priv.pem
          echo "ARCHLUCID_BEARER_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Minted smoke Bearer JWT for dev private-beta auth (not printed)."

      - name: Azure login (OIDC) for canary promotion
        if: vars.CD_CANARY_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Fast curl-based smoke checks run before the heavier CLI deployment-evidence step.
      # Failures here abort CD immediately without waiting for dotnet run to compile.
      - name: Smoke — API health/live and health/ready
        id: smoke_health
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
          CD_POST_DEPLOY_MAX_ATTEMPTS: ${{ vars.CD_POST_DEPLOY_MAX_ATTEMPTS }}
          CD_POST_DEPLOY_RETRY_WAIT_SECONDS: ${{ vars.CD_POST_DEPLOY_RETRY_WAIT_SECONDS }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          if [ -z "${SMOKE_TEST_BASE_URL:-}" ]; then
            if [ "$TARGET" = "staging" ] || [ "$TARGET" = "production" ]; then
              echo "::error::SMOKE_TEST_BASE_URL is required for ${TARGET} post-deploy smoke."
              exit 1
            fi
            echo "SMOKE_TEST_BASE_URL not set — skipping health smoke checks (dev only)."
            exit 0
          fi
          BASE="${SMOKE_TEST_BASE_URL%/}"
          MAX="${CD_POST_DEPLOY_MAX_ATTEMPTS:-6}"
          WAIT="${CD_POST_DEPLOY_RETRY_WAIT_SECONDS:-10}"
          case "$MAX" in ''|*[!0-9]*) MAX=6 ;; esac
          case "$WAIT" in ''|*[!0-9]*) WAIT=10 ;; esac

          smoke_one() {
            local attempt=1
            while [ "$attempt" -le "$MAX" ]; do
              bash scripts/ci/cd-maintenance-deadline-check.sh "$TARGET"
              echo "[attempt ${attempt}/${MAX}] GET $1"
              CODE=$(curl -sS -o /tmp/smoke_body.txt -w "%{http_code}" --connect-timeout 20 --max-time 60 "$1" || echo "000")
              echo "  HTTP $CODE"
              if [ "$CODE" = "200" ]; then return 0; fi
              cat /tmp/smoke_body.txt || true
              echo ""
              if [ "$attempt" -ge "$MAX" ]; then
                echo "::error::SMOKE: $1 returned HTTP $CODE after $MAX attempt(s)"
                return 1
              fi
              echo "Waiting ${WAIT}s..."
              sleep "$WAIT"
              attempt=$((attempt + 1))
            done
          }

          smoke_one "${BASE}/health/live"
          smoke_one "${BASE}/health/ready"

          # Validate readiness reports Healthy overall.
          bash scripts/ci/cd-maintenance-deadline-check.sh "$TARGET"
          CODE=$(curl -sS -o /tmp/ready.json -w "%{http_code}" --connect-timeout 20 --max-time 60 "${BASE}/health/ready" || echo "000")
          if [ "$CODE" = "200" ]; then
            STATUS=$(jq -r '.status // empty' /tmp/ready.json 2>/dev/null || true)
            if [ "$STATUS" != "Healthy" ]; then
              echo "::error::SMOKE: /health/ready overall status is '${STATUS}' (expected 'Healthy'). Check SQL, blob, or other dependencies."
              jq -r '.entries[]? | "  \(.name): \(.status)"' /tmp/ready.json 2>/dev/null || true
              exit 1
            fi
            echo "/health/ready status: Healthy"
          fi

      - name: Smoke — runtime commitSha matches BUILD_ID
        id: smoke_build_id
        if: needs.deploy-container-apps.outputs.deploy_ran == 'true'
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
          BUILD_ID: ${{ needs.build-push-images.outputs.build_id }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          if [ -z "${SMOKE_TEST_BASE_URL:-}" ]; then
            if [ "$TARGET" = "staging" ] || [ "$TARGET" = "production" ]; then
              echo "::error::SMOKE_TEST_BASE_URL is required for ${TARGET} BUILD_ID smoke."
              exit 1
            fi
            echo "SMOKE_TEST_BASE_URL not set — skipping runtime BUILD_ID check (dev only)."
            exit 0
          fi
          if [ -z "${BUILD_ID:-}" ]; then
            echo "::error::BUILD_ID missing from build-push-images outputs."
            exit 1
          fi
          BASE="${SMOKE_TEST_BASE_URL%/}"
          CODE=$(curl -sS -o /tmp/version.json -w "%{http_code}" --connect-timeout 20 --max-time 60 "${BASE}/version" || echo "000")
          if [ "$CODE" != "200" ]; then
            echo "::error::SMOKE: GET /version returned HTTP ${CODE}"
            exit 1
          fi
          RUNTIME_SHA=$(jq -r '.commitSha // empty' /tmp/version.json)
          echo "Runtime commitSha=${RUNTIME_SHA} expected BUILD_ID=${BUILD_ID}"
          if [ "$RUNTIME_SHA" != "$BUILD_ID" ]; then
            echo "::error::SMOKE: runtime commitSha '${RUNTIME_SHA}' does not match BUILD_ID '${BUILD_ID}' — wrong artifact may be running."
            exit 1
          fi
          echo "Runtime BUILD_ID match OK."

      - name: Smoke — product path (required/optional matrix)
        id: smoke_product
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
          ARCHLUCID_API_KEY: ${{ secrets.ARCHLUCID_API_KEY }}
          ARCHLUCID_BEARER_TOKEN: ${{ env.ARCHLUCID_BEARER_TOKEN }}
          BUILD_ID: ${{ needs.build-push-images.outputs.build_id }}
          UI_FQDN: ${{ needs.deploy-container-apps.outputs.ui_fqdn }}
          CD_POST_DEPLOY_MAX_ATTEMPTS: ${{ vars.CD_POST_DEPLOY_MAX_ATTEMPTS }}
          CD_POST_DEPLOY_RETRY_WAIT_SECONDS: ${{ vars.CD_POST_DEPLOY_RETRY_WAIT_SECONDS }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          UI_BASE=""
          if [ -n "${UI_FQDN:-}" ]; then
            UI_BASE="https://${UI_FQDN}"
          fi
          mkdir -p artifacts
          python scripts/ci/cd_post_deploy_product_smoke.py \
            --environment "$TARGET" \
            --expected-build-id "${BUILD_ID}" \
            --api-base-url "${SMOKE_TEST_BASE_URL:-}" \
            --api-key "${ARCHLUCID_API_KEY:-}" \
            --bearer-token "${ARCHLUCID_BEARER_TOKEN:-}" \
            --ui-base-url "${UI_BASE}" \
            --max-attempts "${CD_POST_DEPLOY_MAX_ATTEMPTS:-6}" \
            --retry-wait-seconds "${CD_POST_DEPLOY_RETRY_WAIT_SECONDS:-10}" \
            --summary-path "artifacts/cd-product-smoke-${TARGET}-${{ github.run_id }}.md" \
            --json-path "artifacts/cd-product-smoke-${TARGET}-${{ github.run_id }}.json"

      - name: Upload product-path smoke summary
        if: always() && steps.smoke_product.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: cd-product-smoke-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}
          path: |
            artifacts/cd-product-smoke-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.md
            artifacts/cd-product-smoke-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.json
          if-no-files-found: ignore

      - name: Post-deploy validation and deployment evidence (CLI)
        id: smoke_api
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
          ARCHLUCID_API_KEY: ${{ secrets.ARCHLUCID_API_KEY }}
          ARCHLUCID_BEARER_TOKEN: ${{ env.ARCHLUCID_BEARER_TOKEN }}
          SMOKE_SYNTHETIC_PATH: ${{ vars.SMOKE_SYNTHETIC_PATH }}
          CD_POST_DEPLOY_MAX_ATTEMPTS: ${{ vars.CD_POST_DEPLOY_MAX_ATTEMPTS }}
          CD_POST_DEPLOY_RETRY_WAIT_SECONDS: ${{ vars.CD_POST_DEPLOY_RETRY_WAIT_SECONDS }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          if [ -z "${SMOKE_TEST_BASE_URL:-}" ]; then
            if [ "$TARGET" = "staging" ] || [ "$TARGET" = "production" ]; then
              echo "::error::SMOKE_TEST_BASE_URL is required for ${TARGET} deployment-evidence."
              exit 1
            fi
            echo "SMOKE_TEST_BASE_URL not set — skipping post-deploy validation (dev only)."
            exit 0
          fi
          if [ -z "${ARCHLUCID_API_KEY:-}" ] && [ -z "${ARCHLUCID_BEARER_TOKEN:-}" ]; then
            echo "::error::ARCHLUCID_API_KEY or ARCHLUCID_BEARER_TOKEN must be set — deployment-evidence synthetic probe requires authenticated access."
            exit 1
          fi
          OUT="artifacts/deployment-evidence-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.md"
          MAX="${CD_POST_DEPLOY_MAX_ATTEMPTS:-6}"
          WAIT="${CD_POST_DEPLOY_RETRY_WAIT_SECONDS:-10}"
          case "$MAX" in ''|*[!0-9]*) MAX=6 ;; esac
          case "$WAIT" in ''|*[!0-9]*) WAIT=10 ;; esac
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          attempt=1
          while [ "$attempt" -le "$MAX" ]; do
            bash scripts/ci/cd-maintenance-deadline-check.sh "$TARGET"
            echo "[attempt ${attempt}/${MAX}] archlucid deployment-evidence"
            if dotnet run --project ArchLucid.Cli/ArchLucid.Cli.csproj -- \
              deployment-evidence \
              --environment "$TARGET" \
              --api-base-url "${SMOKE_TEST_BASE_URL}" \
              --synthetic-path "${SMOKE_SYNTHETIC_PATH:-/version}" \
              --out "${OUT}" \
              --repo "${GITHUB_WORKSPACE}"; then
              exit 0
            fi
            if [ "$attempt" -ge "$MAX" ]; then
              echo "::error::Post-deploy validation failed after ${MAX} attempt(s)."
              exit 1
            fi
            echo "Waiting ${WAIT}s..."
            sleep "$WAIT"
            attempt=$((attempt + 1))
          done

      - name: Upload deployment evidence (Markdown)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-evidence-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}
          path: artifacts/deployment-evidence-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.md
          if-no-files-found: ignore

      - name: Promote canary API traffic to new revision (optional)
        if: success()
        env:
          CD_CANARY_ENABLED: ${{ vars.CD_CANARY_ENABLED }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
        run: |
          set -e
          if [ "${CD_CANARY_ENABLED:-}" != "true" ]; then
            echo "CD_CANARY_ENABLED is not true — skipping canary promotion."
            exit 0
          fi
          if [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ]; then
            exit 0
          fi
          AFTER="${{ needs.deploy-container-apps.outputs.revision_after }}"
          if [ -z "$AFTER" ]; then
            echo "No revision_after output — skipping promotion."
            exit 0
          fi
          echo "Promoting API traffic to revision $AFTER=100%"
          az containerapp ingress traffic set \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$CONTAINER_APP_API_NAME" \
            --revision-weight "${AFTER}=100"

  rollback:
    name: Roll back to last-known-good after failed smoke (optional)
    needs: [build-push-images, deploy-container-apps, smoke-test]
    if: |
      always() &&
      (github.event.inputs.action || 'deploy') == 'deploy' &&
      needs.smoke-test.result == 'failure'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so schema gate can resolve LKG BUILD_ID vs failed BUILD_ID.
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download last-known-good artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.deploy-container-apps.outputs.lkg_artifact }}
          path: artifacts/lkg

      - name: Plan and execute auto-rollback
        id: auto_rollback
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
          SMOKE_TEST_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
          FAILED_BUILD_ID: ${{ needs.build-push-images.outputs.build_id }}
          FAILED_API_REV: ${{ needs.deploy-container-apps.outputs.revision_after }}
          FAILED_WORKER_REV: ${{ needs.deploy-container-apps.outputs.worker_revision_after }}
          FAILED_UI_REV: ${{ needs.deploy-container-apps.outputs.ui_revision_after }}
          LKG_API_REV: ${{ needs.deploy-container-apps.outputs.revision_before }}
          LKG_WORKER_REV: ${{ needs.deploy-container-apps.outputs.worker_revision_before }}
          LKG_UI_REV: ${{ needs.deploy-container-apps.outputs.ui_revision_before }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          mkdir -p artifacts/cd-rollback
          LKG_JSON=$(find artifacts/lkg -name 'cd-last-known-good-*.json' -type f 2>/dev/null | head -1 || true)
          PLAN_FLAGS=()
          if [ "${{ vars.CD_ROLLBACK_ON_SMOKE_FAILURE }}" = "true" ]; then PLAN_FLAGS+=(--flag-enabled); fi
          if [ -n "${SMOKE_TEST_BASE_URL:-}" ]; then PLAN_FLAGS+=(--smoke-url-configured); fi
          if [ -n "${FAILED_API_REV:-}" ] && [ -n "${LKG_API_REV:-}" ] && [ "$FAILED_API_REV" != "$LKG_API_REV" ]; then
            PLAN_FLAGS+=(--distinct-failed-revision)
          fi
          LKG_ARGS=()
          if [ -n "${LKG_JSON:-}" ] && [ -f "$LKG_JSON" ]; then
            LKG_ARGS+=(--lkg-json "$LKG_JSON")
          fi

          set +e
          python3 scripts/ci/cd_plan_rollback.py \
            --mode auto \
            --environment "$TARGET" \
            --failed-build-id "${FAILED_BUILD_ID:-}" \
            "${LKG_ARGS[@]}" \
            "${PLAN_FLAGS[@]}" \
            --json-out artifacts/cd-rollback/report.json \
            --markdown-out artifacts/cd-rollback/report.md \
            --plan-out artifacts/cd-rollback/plan.json
          PLAN_RC=$?
          set -e
          if [ "$PLAN_RC" -eq 3 ]; then
            echo "::error::Schema-incompatible deploy — automatic app rollback blocked. Human intervention required (see MIGRATION_ROLLBACK.md)."
            cat artifacts/cd-rollback/report.md >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi
          if [ "$PLAN_RC" -ne 0 ]; then
            echo "::error::cd_plan_rollback.py failed with exit ${PLAN_RC}"
            exit "$PLAN_RC"
          fi

          APPROVED=$(jq -r '.approved // false' artifacts/cd-rollback/plan.json)
          TARGET_BUILD=$(jq -r '.targetBuildId // empty' artifacts/cd-rollback/plan.json)
          echo "approved=${APPROVED}" >> "$GITHUB_OUTPUT"
          echo "target_build_id=${TARGET_BUILD}" >> "$GITHUB_OUTPUT"
          if [ "$APPROVED" != "true" ]; then
            echo "Auto-rollback not executed: $(jq -r '.reason // empty' artifacts/cd-rollback/plan.json)"
            cat artifacts/cd-rollback/report.md >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi

          restore_rev() {
            local app="$1" good="$2" bad="$3"
            if [ -z "$app" ] || [ -z "$good" ]; then return 0; fi
            echo "Restoring traffic on ${app} to revision ${good}"
            az containerapp ingress traffic set -g "$AZURE_RESOURCE_GROUP" -n "$app" --revision-weight "${good}=100" \
              || echo "Traffic set soft-failed for ${app}; continuing with deactivate of failed revision."
            if [ -n "$bad" ] && [ "$bad" != "$good" ]; then
              echo "Deactivating failed revision ${bad} on ${app}"
              az containerapp revision deactivate -g "$AZURE_RESOURCE_GROUP" -n "$app" --revision "$bad" || true
            fi
          }

          GOOD_API=$(jq -r '.targetApiRevision // empty' artifacts/cd-rollback/plan.json)
          GOOD_WORKER=$(jq -r '.targetWorkerRevision // empty' artifacts/cd-rollback/plan.json)
          GOOD_UI=$(jq -r '.targetUiRevision // empty' artifacts/cd-rollback/plan.json)
          if [ -z "$GOOD_API" ]; then GOOD_API="${LKG_API_REV:-}"; fi
          if [ -z "$GOOD_WORKER" ]; then GOOD_WORKER="${LKG_WORKER_REV:-}"; fi
          if [ -z "$GOOD_UI" ]; then GOOD_UI="${LKG_UI_REV:-}"; fi

          restore_rev "$CONTAINER_APP_API_NAME" "$GOOD_API" "${FAILED_API_REV:-}"
          if [ -n "${CONTAINER_APP_WORKER_NAME:-}" ]; then
            restore_rev "$CONTAINER_APP_WORKER_NAME" "$GOOD_WORKER" "${FAILED_WORKER_REV:-}"
          fi
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
            restore_rev "$CONTAINER_APP_UI_NAME" "$GOOD_UI" "${FAILED_UI_REV:-}"
          fi

          sleep 20
          VERIFY="failure"
          if [ -n "${SMOKE_TEST_BASE_URL:-}" ] && [ -n "${TARGET_BUILD:-}" ]; then
            UI_BASE=""
            if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
              UI_FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" \
                --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
              if [ -n "${UI_FQDN:-}" ]; then
                UI_BASE="https://${UI_FQDN}"
              fi
            fi
            VERIFY_ARGS=(--api-base-url "${SMOKE_TEST_BASE_URL}" --expected-build-id "${TARGET_BUILD}")
            if [ -n "${UI_BASE}" ]; then
              VERIFY_ARGS+=(--ui-base-url "${UI_BASE}")
            fi
            if python3 scripts/ci/cd_verify_rollback_runtime.py "${VERIFY_ARGS[@]}"; then
              VERIFY="success"
            else
              echo "::error::Post-rollback BUILD_ID verification failed."
              VERIFY="failure"
            fi
          else
            VERIFY="skipped"
          fi

          python3 scripts/ci/cd_finalize_rollback_report.py \
            --environment "$TARGET" \
            --mode auto \
            --failed-build-id "${FAILED_BUILD_ID}" \
            --plan-json artifacts/cd-rollback/plan.json \
            --prior-report-json artifacts/cd-rollback/report.json \
            --verification-result "$VERIFY" \
            --json-out artifacts/cd-rollback/report.json \
            --markdown-out artifacts/cd-rollback/report.md
          cat artifacts/cd-rollback/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$VERIFY" = "failure" ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cd-rollback-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}
          path: artifacts/cd-rollback/
          if-no-files-found: warn

  manual-rollback:
    name: Manual rollback (${{ github.event.inputs.target || 'dev' }})
    if: (github.event.inputs.action || 'deploy') == 'rollback'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve target BUILD_ID digests and plan rollback
        id: plan
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ROLLBACK_BUILD_ID: ${{ github.event.inputs.rollback_build_id }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          mkdir -p artifacts/cd-rollback
          if [ -z "${ROLLBACK_BUILD_ID:-}" ]; then
            echo "::error::rollback_build_id is required for action=rollback (immutable git SHA / BUILD_ID)."
            exit 1
          fi
          if [ -z "${ACR_LOGIN_SERVER:-}" ] || [ -z "${AZURE_RESOURCE_GROUP:-}" ] || [ -z "${CONTAINER_APP_API_NAME:-}" ]; then
            echo "::error::ACR_LOGIN_SERVER, AZURE_RESOURCE_GROUP, and CONTAINER_APP_API_NAME are required."
            exit 1
          fi
          REG_NAME="${ACR_NAME:-${ACR_LOGIN_SERVER%%.*}}"
          az acr login --name "$REG_NAME"
          API_DIGEST=$(az acr manifest show-metadata --registry "$REG_NAME" --name "archlucid-api:${ROLLBACK_BUILD_ID}" --query digest -o tsv)
          UI_DIGEST=""
          UI_FLAGS=()
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
            UI_DIGEST=$(az acr manifest show-metadata --registry "$REG_NAME" --name "archlucid-ui:${ROLLBACK_BUILD_ID}" --query digest -o tsv)
            UI_FLAGS+=(--ui-required --ui-digest "$UI_DIGEST")
          fi
          CURRENT_REV=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" --query "properties.latestRevisionName" -o tsv)
          CURRENT_ENV=$(az containerapp revision show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" --revision "$CURRENT_REV" \
            --query "properties.template.containers[0].env" -o json 2>/dev/null || echo "[]")
          FAILED_BUILD=$(echo "$CURRENT_ENV" | jq -r '.[] | select(.name=="ARCHLUCID_BUILD_COMMIT_SHA") | .value // empty' | head -1)
          if [ -z "$FAILED_BUILD" ]; then FAILED_BUILD="HEAD"; fi

          set +e
          python3 scripts/ci/cd_plan_rollback.py \
            --mode manual \
            --environment "$TARGET" \
            --failed-build-id "$FAILED_BUILD" \
            --rollback-build-id "$ROLLBACK_BUILD_ID" \
            --api-digest "$API_DIGEST" \
            "${UI_FLAGS[@]}" \
            --json-out artifacts/cd-rollback/report.json \
            --markdown-out artifacts/cd-rollback/report.md \
            --plan-out artifacts/cd-rollback/plan.json
          PLAN_RC=$?
          set -e
          if [ "$PLAN_RC" -ne 0 ]; then
            cat artifacts/cd-rollback/report.md >> "$GITHUB_STEP_SUMMARY" || true
            if [ "$PLAN_RC" -eq 3 ]; then
              echo "::error::Schema gate blocked manual rollback — human intervention required."
            elif [ "$PLAN_RC" -eq 2 ]; then
              echo "::error::Rollback target artifact missing in ACR for BUILD_ID ${ROLLBACK_BUILD_ID}."
            fi
            exit 1
          fi
          echo "api_digest=${API_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "ui_digest=${UI_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "target_build_id=${ROLLBACK_BUILD_ID}" >> "$GITHUB_OUTPUT"

      - name: Deploy digest-pinned rollback target
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_API_NAME: ${{ secrets.CONTAINER_APP_API_NAME }}
          CONTAINER_APP_WORKER_NAME: ${{ secrets.CONTAINER_APP_WORKER_NAME }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
          API_DIGEST: ${{ steps.plan.outputs.api_digest }}
          UI_DIGEST: ${{ steps.plan.outputs.ui_digest }}
          TARGET_BUILD_ID: ${{ steps.plan.outputs.target_build_id }}
        run: |
          set -euo pipefail
          API_IMAGE="${ACR_LOGIN_SERVER}/archlucid-api@${API_DIGEST}"
          REV_SFX="rb${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT:-1}"
          echo "Rolling back API to ${API_IMAGE} (BUILD_ID=${TARGET_BUILD_ID})"
          A_LATEST=$(az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" --image "$API_IMAGE" \
            --revision-suffix "$REV_SFX" --set-env-vars "ARCHLUCID_BUILD_COMMIT_SHA=$TARGET_BUILD_ID" \
            --query "properties.latestRevisionName" -o tsv)
          az containerapp ingress traffic set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_API_NAME" --revision-weight "${A_LATEST}=100"
          if [ -n "${CONTAINER_APP_WORKER_NAME:-}" ]; then
            W_LATEST=$(az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_WORKER_NAME" --image "$API_IMAGE" \
              --revision-suffix "$REV_SFX" --set-env-vars "ARCHLUCID_BUILD_COMMIT_SHA=$TARGET_BUILD_ID" \
              --query "properties.latestRevisionName" -o tsv)
            az containerapp ingress traffic set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_WORKER_NAME" --revision-weight "${W_LATEST}=100" || true
          fi
          if [ -n "${CONTAINER_APP_UI_NAME:-}" ] && [ -n "${UI_DIGEST:-}" ]; then
            UI_IMAGE="${ACR_LOGIN_SERVER}/archlucid-ui@${UI_DIGEST}"
            U_LATEST=$(az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" --image "$UI_IMAGE" \
              --revision-suffix "$REV_SFX" --set-env-vars "ARCHLUCID_BUILD_COMMIT_SHA=$TARGET_BUILD_ID" \
              --query "properties.latestRevisionName" -o tsv)
            az containerapp ingress traffic set -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" --revision-weight "${U_LATEST}=100" || true
          fi
          echo "Manual rollback deploy complete."

      - name: Post-rollback essential smoke + BUILD_ID verify
        env:
          SMOKE_TEST_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
          TARGET_BUILD_ID: ${{ steps.plan.outputs.target_build_id }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP_UI_NAME: ${{ secrets.CONTAINER_APP_UI_NAME }}
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          VERIFY="skipped"
          if [ -z "${SMOKE_TEST_BASE_URL:-}" ]; then
            if [ "$TARGET" = "staging" ] || [ "$TARGET" = "production" ]; then
              echo "::error::SMOKE_TEST_BASE_URL required for ${TARGET} manual rollback verification."
              exit 1
            fi
            echo "SMOKE_TEST_BASE_URL unset — skipping post-rollback smoke (dev only)."
          else
            UI_BASE=""
            if [ -n "${CONTAINER_APP_UI_NAME:-}" ]; then
              UI_FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$CONTAINER_APP_UI_NAME" \
                --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
              if [ -n "${UI_FQDN:-}" ]; then
                UI_BASE="https://${UI_FQDN}"
              fi
            fi
            VERIFY_ARGS=(--api-base-url "${SMOKE_TEST_BASE_URL}" --expected-build-id "${TARGET_BUILD_ID}")
            if [ -n "${UI_BASE}" ]; then
              VERIFY_ARGS+=(--ui-base-url "${UI_BASE}")
            fi
            if ! python3 scripts/ci/cd_verify_rollback_runtime.py "${VERIFY_ARGS[@]}"; then
              echo "::error::Manual rollback verification failed (expected BUILD_ID=${TARGET_BUILD_ID})."
              python3 scripts/ci/cd_finalize_rollback_report.py \
                --environment "$TARGET" \
                --mode manual \
                --failed-build-id "(pre-rollback runtime)" \
                --plan-json artifacts/cd-rollback/plan.json \
                --verification-result failure \
                --rollback-result deployed \
                --json-out artifacts/cd-rollback/report.json \
                --markdown-out artifacts/cd-rollback/report.md
              cat artifacts/cd-rollback/report.md >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            VERIFY="success"
          fi
          python3 scripts/ci/cd_finalize_rollback_report.py \
            --environment "$TARGET" \
            --mode manual \
            --failed-build-id "(pre-rollback runtime)" \
            --plan-json artifacts/cd-rollback/plan.json \
            --verification-result "$VERIFY" \
            --rollback-result success \
            --json-out artifacts/cd-rollback/report.json \
            --markdown-out artifacts/cd-rollback/report.md
          cat artifacts/cd-rollback/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cd-manual-rollback-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}
          path: artifacts/cd-rollback/
          if-no-files-found: warn

  nuget-push:
    name: Pack and push API client (NuGet)
    needs: smoke-test
    # always() is required here for the same reason as smoke-test's condition above:
    # otherwise GitHub's implicit success() check walks the transitive needs graph and
    # silently skips this job whenever an upstream job (e.g. terraform-apply) was 'skipped'.
    if: |
      always() &&
      (github.event.inputs.action || 'deploy') == 'deploy' &&
      (github.event.inputs.target || 'dev') == 'production' &&
      needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack and push API client (NuGet)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY not set — skipping NuGet push."
            exit 0
          fi
          dotnet restore ArchLucid.Api.Client/ArchLucid.Api.Client.csproj
          dotnet pack ArchLucid.Api.Client/ArchLucid.Api.Client.csproj \
            --no-restore -c Release -o "${RUNNER_TEMP}/nuget" \
            /p:ArchLucidApiClientPackageVersion=1.0.${{ github.run_number }}
          dotnet nuget push "${RUNNER_TEMP}/nuget/"*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  notify:
    name: CD notify and summary
    needs:
      - build-push-images
      - terraform-plan
      - terraform-apply
      - deploy-container-apps
      - smoke-test
      - rollback
      - nuget-push
      - manual-rollback
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    steps:
      - name: CD notification webhook (optional)
        env:
          CD_NOTIFY_WEBHOOK_URL: ${{ secrets.CD_NOTIFY_WEBHOOK_URL }}
          IMAGE_TAG: ${{ needs.build-push-images.outputs.image_tag }}
        run: |
          if [ -z "${CD_NOTIFY_WEBHOOK_URL:-}" ]; then
            exit 0
          fi
          TAG="${IMAGE_TAG:-${{ github.sha }}}"
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"CD ${{ job.status }} — ${{ github.event.inputs.action || 'deploy' }} / ${{ github.event.inputs.target || 'dev' }} — image ${TAG} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$CD_NOTIFY_WEBHOOK_URL" || true

      - name: Checkout (lineage helper)
        uses: actions/checkout@v7

      - name: Deployment lineage summary
        env:
          BUILD_ID: ${{ needs.build-push-images.outputs.build_id }}
          IMAGE_TAG: ${{ needs.build-push-images.outputs.image_tag }}
          API_IMAGE_DIGEST: ${{ needs.build-push-images.outputs.api_image_digest }}
          UI_IMAGE_DIGEST: ${{ needs.build-push-images.outputs.ui_image_digest }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          VERIFY_RESULT: ${{ needs.deploy-container-apps.outputs.verify_result }}
        run: |
          set -euo pipefail
          echo "## CD summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Action: ${{ github.event.inputs.action || 'deploy' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ github.event.inputs.target || 'dev' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- BUILD_ID (immutable): \`${BUILD_ID:-${{ github.sha }}}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`${IMAGE_TAG:-n/a}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform apply requested: ${{ github.event.inputs.run_terraform_apply }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job results: build=${{ needs.build-push-images.result }}, plan=${{ needs.terraform-plan.result }}, apply=${{ needs.terraform-apply.result }}, deploy=${{ needs.deploy-container-apps.result }}, smoke=${{ needs.smoke-test.result }}, rollback=${{ needs.rollback.result }}, nuget=${{ needs.nuget-push.result }}, manual-rollback=${{ needs.manual-rollback.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${ACR_LOGIN_SERVER:-}" ] || [ -z "${API_IMAGE_DIGEST:-}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Deployment lineage" >> "$GITHUB_STEP_SUMMARY"
            echo "- Skipped detailed lineage (ACR digest outputs unavailable for this run)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BID="${BUILD_ID:-${{ github.sha }}}"
          TAG="${IMAGE_TAG:-$BID}"
          UI_DIGEST="${UI_IMAGE_DIGEST:-$API_IMAGE_DIGEST}"
          python3 scripts/ci/cd_deployment_lineage.py --write-summary \
            --commit-sha "${{ github.sha }}" \
            --build-id "$BID" \
            --target-environment "${{ github.event.inputs.target || 'dev' }}" \
            --image-tag "$TAG" \
            --api-tag-ref "${ACR_LOGIN_SERVER}/archlucid-api:${TAG}" \
            --api-digest-ref "${ACR_LOGIN_SERVER}/archlucid-api@${API_IMAGE_DIGEST}" \
            --ui-tag-ref "${ACR_LOGIN_SERVER}/archlucid-ui:${TAG}" \
            --ui-digest-ref "${ACR_LOGIN_SERVER}/archlucid-ui@${UI_DIGEST}" \
            --worker-digest-ref "${ACR_LOGIN_SERVER}/archlucid-api@${API_IMAGE_DIGEST}" \
            --build-result "${{ needs.build-push-images.result }}" \
            --deploy-result "${{ needs.deploy-container-apps.result }}" \
            --verify-result "${VERIFY_RESULT:-unknown}" \
            --smoke-result "${{ needs.smoke-test.result }}" \
            --summary-path "artifacts/deployment-lineage-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.md" \
            --json-path "artifacts/deployment-lineage-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment lineage artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-lineage-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}
          path: artifacts/deployment-lineage-${{ github.event.inputs.target || 'dev' }}-${{ github.run_id }}.*
          if-no-files-found: ignore
