# Isolated RC49 validation only; no comprehensive CI dispatch.
name: RC49 desktop Sponsor packet browser regression
on:
  pull_request:
    branches: [RC49]
    paths:
      - "archlucid-ui/e2e/demo-review-one-click.spec.ts"
      - ".github/workflows/rc49-desktop-sponsor-packet-regression.yml"

permissions:
  contents: read

jobs:
  desktop-review-tabs:
    name: "RC49: desktop Sponsor packet browser regression"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json
      - name: Install UI dependencies
        working-directory: archlucid-ui
        run: npm ci
      - name: Build only the RC49 UI and install Chromium
        working-directory: archlucid-ui
        env:
          CI: "true"
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_DEMO_STATIC_OPERATOR: "true"
          NEXT_PUBLIC_CTO_DEMO_NAV_EXPANDED: "true"
          NEXT_PUBLIC_E2E_ALLOW_DEMO_BLOCKED_ROUTES: "1"
          NEXT_PUBLIC_PUBLIC_SIGNUP_MODE: "public-self-service"
          NEXT_PUBLIC_SUPPRESS_ONBOARDING_TOUR: "1"
        run: |
          npm run build
          npx playwright install --with-deps chromium
      - name: Execute only desktop review-tab regression
        working-directory: archlucid-ui
        env:
          CI: "true"
          MOCK_E2E_SKIP_NEXT_BUILD: "1"
        run: |
          npx playwright test -c playwright.mock.config.ts --project=chromium e2e/demo-review-one-click.spec.ts --grep "desktop review tabs retain Sponsor packet navigation" --workers=1 --retries=0 --reporter=list,html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rc49-desktop-sponsor-packet-browser-evidence
          path: |
            archlucid-ui/test-results
            archlucid-ui/playwright-report
          if-no-files-found: warn
