# Optional credentialed real-LLM golden cohort (Improvement #9).
# Enabled when .github/REAL_MODE_CI_ENABLED exists or ARCHLUCID_GOLDEN_COHORT_REAL_LLM=true.
# Skips gracefully when AZURE_OPENAI_* / ARCHLUCID_REAL_AOAI_TEST_* secrets are absent.
name: real-llm-golden-cohort

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1"

permissions:
  contents: read

jobs:
  real-llm-golden-cohort:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Real-mode CI eligibility
        id: eligibility
        run: |
          set -euo pipefail
          if bash scripts/ci/is_real_mode_ci_enabled.sh enabled; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Real-LLM golden cohort skipped — add .github/REAL_MODE_CI_ENABLED or set ARCHLUCID_GOLDEN_COHORT_REAL_LLM=true."
          fi

      - name: Setup .NET
        if: steps.eligibility.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python (budget probe)
        if: steps.eligibility.outputs.enabled == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install requests (budget probe)
        if: steps.eligibility.outputs.enabled == 'true'
        run: python -m pip install --upgrade pip && pip install requests

      - name: Azure login (Cost Management / management plane)
        if: steps.eligibility.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: budget
        name: Golden cohort budget probe ($15/mo cap)
        if: steps.eligibility.outputs.enabled == 'true'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARCHLUCID_GOLDEN_COHORT_AZURE_OPENAI_RESOURCE_ID: ${{ secrets.ARCHLUCID_GOLDEN_COHORT_AZURE_OPENAI_RESOURCE_ID }}
        run: bash scripts/ci/run_golden_cohort_budget_probe_ci.sh "Real-LLM golden cohort"

      - name: Real-LLM golden cohort (skip-graceful)
        if: ${{ steps.eligibility.outputs.enabled == 'true' && (steps.budget.outputs.exit_code == '0' || steps.budget.outputs.exit_code == '1') }}
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          ARCHLUCID_REAL_AOAI_TEST_ENDPOINT: ${{ secrets.ARCHLUCID_REAL_AOAI_TEST_ENDPOINT }}
          ARCHLUCID_REAL_AOAI_TEST_KEY: ${{ secrets.ARCHLUCID_REAL_AOAI_TEST_KEY }}
          ARCHLUCID_CI_REAL_AOAI_ENDPOINT: ${{ secrets.ARCHLUCID_CI_REAL_AOAI_ENDPOINT }}
          ARCHLUCID_CI_REAL_AOAI_KEY: ${{ secrets.ARCHLUCID_CI_REAL_AOAI_KEY }}
          ARCHLUCID_CI_REAL_AOAI_DEPLOYMENT: ${{ vars.ARCHLUCID_CI_REAL_AOAI_DEPLOYMENT }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source scripts/ci/export_real_mode_aoai_env.sh
          pwsh -NoProfile -File ./scripts/ci/Invoke-RealLlmGoldenCohort.ps1

      - name: Enforce Phase B LLM Faithfulness Thresholds
        if: ${{ steps.eligibility.outputs.enabled == 'true' && (steps.budget.outputs.exit_code == '0' || steps.budget.outputs.exit_code == '1') }}
        env:
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_SMOKE_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-smoke.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_COST_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-cost.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_COMPLIANCE_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-compliance.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_CRITIC_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-critic.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_THREE_TIER_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-three-tier.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_MICROSERVICES_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-microservices.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_DATABASE_BACKUP_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-database-backup.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_OVERPROVISIONED_VM_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-overprovisioned-vm.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_MULTI_REGION_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-multi-region.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_AZURE_WEB_APP_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-azure-web-app.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_CLOUD_MIGRATION_LIFT_SHIFT_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-cloud-migration-lift-shift.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_GREENFIELD_MICROSERVICES_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-greenfield-microservices.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_HEALTHCARE_HIPAA_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-healthcare-hipaa.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_FINOPS_EXISTING_AZURE_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-finops-existing-azure.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_EVENT_DRIVEN_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-event-driven.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_MULTI_REGION_ACTIVE_ACTIVE_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-multi-region-active-active.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_DATA_PLATFORM_ANALYTICS_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-data-platform-analytics.real.json
          ARCHLUCID_EVAL_CORPUS_REAL_MODE_AI_ML_INFERENCE_AGENT_RESULT: ${{ github.workspace }}/tests/eval-corpus/agent-results/corpus-real-mode-ai-ml-inference.real.json
        run: bash ./scripts/ci/run_eval_agent_corpus_rc.sh

      - name: Upload real-LLM session artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-llm-golden-cohort
          path: |
            artifacts/release/real-llm-evidence-gate.md
            artifacts/release/real-llm-evidence-gate.json
            artifacts/release/real-llm-topology-metrics.json
            artifacts/release/real-llm-full-pipeline-metrics.json
            docs/quality/REAL_LLM_SESSION_*.md
          if-no-files-found: ignore
