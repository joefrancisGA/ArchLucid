# Regenerates platform architecture handbook artifacts when diagram/handbook docs change.
# Warn-oriented: mermaid-cli / pandoc may be unavailable on some runners.
name: Architecture handbook

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/architecture/architecture_diagrams/**'
      - 'docs/architecture/architecture_handbook/**'
      - 'docs/architecture/DIAGRAM_ADR_OVERLAY.md'
      - 'docs/architecture/C4_MERMAID_SYNC.md'
      - 'scripts/docs/generate-architecture-handbook-docx.ps1'
      - 'scripts/docs/release-architecture-handbook.ps1'
      - 'scripts/ci/check_architecture_diagrams_drift.py'
  pull_request:
    paths:
      - 'docs/architecture/architecture_diagrams/**'
      - 'docs/architecture/architecture_handbook/**'
      - 'scripts/docs/**'
      - 'scripts/ci/check_architecture_diagrams_drift.py'

permissions:
  contents: read

jobs:
  drift:
    name: Diagram drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Architecture diagrams drift
        run: python scripts/ci/check_architecture_diagrams_drift.py

  release-docx:
    name: Render + handbook DOCX (best effort)
    runs-on: ubuntu-latest
    needs: drift
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Release handbook (temp-copy mermaid render + Full/Buyer/Security DOCX)
        shell: pwsh
        run: ./scripts/docs/release-architecture-handbook.ps1
      - name: Upload handbook DOCXs
        uses: actions/upload-artifact@v4
        with:
          name: architecture-handbook-docx
          path: |
            docs/architecture/architecture_handbook/ARCHITECTURE_HANDBOOK*.docx
            docs/architecture/architecture_handbook/buyer/BUYER_TRUST_TOPOLOGY_PACK*.docx
            docs/architecture/architecture_handbook/security/SECURITY_REVIEWER_PACK*.docx
          if-no-files-found: warn
