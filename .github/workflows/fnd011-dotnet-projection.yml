name: FND-011 .NET Projection Tests

on:
  pull_request:
    branches: [main, master, integration/fnd011-authorized-http-boundary]
  merge_group:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The SecureNowSnapshot filter also selects HTTP integration tests backed by SQL.
    # Match the repository's existing full-CI SQL service instead of skipping them.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    env:
      ARCHLUCID_SQL_TEST: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests"
    steps:
      - uses: actions/checkout@v4
      - name: Wait for SQL Server service
        uses: ./.github/actions/wait-for-sqlserver
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj --filter FullyQualifiedName~SecureNowSnapshot
