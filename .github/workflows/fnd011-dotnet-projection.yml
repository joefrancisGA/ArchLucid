name: FND-011 .NET Projection Tests

on:
  pull_request:
    branches: [main, master, integration/fnd011-authorized-http-boundary]
  merge_group:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # SecureNowSnapshot includes real HTTP integration cases with SQL-backed factories.
    # Keep those tests enabled; provision the same ephemeral SQL service as ci.yml.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v7
      - name: Verify canonical SentEmails bootstrap migration parity
        run: python3 scripts/ci/verify_sentemails_bootstrap_parity.py
      - name: Wait for SQL Server to be ready
        uses: ./.github/actions/wait-for-sqlserver
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Ensure SQL persistence test catalog
        run: bash scripts/ci/ensure-ci-sql-catalog.sh ArchLucidPersistenceTests
      - name: Run full SecureNow snapshot tests (including SQL HTTP integration)
        env:
          ARCHLUCID_SQL_TEST: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests"
        run: dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj --filter FullyQualifiedName~SecureNowSnapshot
