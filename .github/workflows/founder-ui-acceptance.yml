# GTM M-103 — scheduled / on-demand founder acceptance against a chosen staging UI.
#
# Policy:
#   - NOT merge-blocking. Failures are warn-only (job stays green; artifacts + annotations).
#   - NOT a second full Playwright matrix — public @release-smoke + founder console/network + axe only.
#   - Scheduled runs require ARCHLUCID_FOUNDER_ACCEPTANCE_ENABLED=true
#   - Target URL: ARCHLUCID_STAGING_UI_BASE_URL (fallback ARCHLUCID_STAGING_BASE_URL)
#   - workflow_dispatch / workflow_call may run when a URL is available (manual intent)
#
# Full authenticated @founder / live-api specs stay local (or a future opt-in with secrets).
# Docs: docs/architecture/FOUNDER_UI_ACCEPTANCE_ROUTINE.md
name: founder-ui-acceptance

on:
  schedule:
    # Daily late UTC (after hosted-saas-probe window).
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      acceptance_base_url:
        description: "Override ACCEPTANCE_BASE_URL (default: staging UI var)."
        required: false
        type: string
      run_lighthouse:
        description: "Also run remote Lighthouse acceptance (warn-only)."
        type: boolean
        default: false
  # Optional hook from other workflows — still warn-only; does not gate merge/RC.
  workflow_call:
    inputs:
      acceptance_base_url:
        required: false
        type: string
        default: ""
      run_lighthouse:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: founder-ui-acceptance-${{ github.repository }}
  cancel-in-progress: true

jobs:
  founder-acceptance-warn:
    if: github.event.repository.fork == false
    name: Founder UI acceptance (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate (opt-in + target URL)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.acceptance_base_url || '' }}
          DISPATCH_URL: ${{ github.event.inputs.acceptance_base_url || '' }}
          UI_VAR: ${{ vars.ARCHLUCID_STAGING_UI_BASE_URL }}
          BASE_VAR: ${{ vars.ARCHLUCID_STAGING_BASE_URL }}
          ENABLED: ${{ vars.ARCHLUCID_FOUNDER_ACCEPTANCE_ENABLED }}
          DISPATCH_LH: ${{ github.event.inputs.run_lighthouse || '' }}
          CALL_LH: ${{ inputs.run_lighthouse }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "schedule" ] && [ "${ENABLED:-}" != "true" ]; then
            echo "ARCHLUCID_FOUNDER_ACCEPTANCE_ENABLED is not true — skipping scheduled run."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "run_lighthouse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          target="${INPUT_URL:-}"
          if [ -z "$target" ]; then
            target="${DISPATCH_URL:-}"
          fi
          if [ -z "$target" ]; then
            target="${UI_VAR:-}"
          fi
          if [ -z "$target" ]; then
            target="${BASE_VAR:-}"
          fi

          if [ -z "$target" ]; then
            echo "No ACCEPTANCE_BASE_URL / staging UI/base URL var — skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "run_lighthouse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_lh=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${DISPATCH_LH:-}" = "true" ]; then
            run_lh=true
          fi
          if [ "$EVENT_NAME" = "workflow_call" ] && [ "${CALL_LH:-}" = "true" ]; then
            run_lh=true
          fi

          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "base_url=${target}" >> "$GITHUB_OUTPUT"
          echo "run_lighthouse=${run_lh}" >> "$GITHUB_OUTPUT"
          echo "Founder acceptance target: ${target} (lighthouse=${run_lh})"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skipped != 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skipped != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Install UI deps + Chromium
        if: steps.gate.outputs.skipped != 'true'
        working-directory: archlucid-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run public founder suite (release-smoke + console/network + axe)
        id: founder
        if: steps.gate.outputs.skipped != 'true'
        working-directory: archlucid-ui
        continue-on-error: true
        env:
          ACCEPTANCE_BASE_URL: ${{ steps.gate.outputs.base_url }}
          ACCEPTANCE_SKIP_LIVE_INFRA: "1"
          FOUNDER_PUBLIC_ONLY: "1"
          FOUNDER_PAGE_GUARDS_WARN_ONLY: "1"
          CI: "1"
        run: |
          set -euo pipefail
          npm run test:e2e:founder:release-smoke
          npm run test:e2e:founder:console-network
          npm run test:e2e:founder:a11y

      - name: Annotate founder Playwright outcome (warn-only)
        if: steps.gate.outputs.skipped != 'true'
        run: |
          if [ "${{ steps.founder.outcome }}" = "success" ]; then
            echo "::notice::Founder public acceptance suite passed against ${{ steps.gate.outputs.base_url }}"
          else
            echo "::warning::Founder public acceptance suite FAILED against ${{ steps.gate.outputs.base_url }} (warn-only; not merge-blocking). Inspect playwright-report-founder / test-results artifacts."
          fi

      - name: Remote Lighthouse acceptance (optional, warn-only)
        id: lighthouse
        if: steps.gate.outputs.skipped != 'true' && steps.gate.outputs.run_lighthouse == 'true'
        working-directory: archlucid-ui
        continue-on-error: true
        env:
          ACCEPTANCE_BASE_URL: ${{ steps.gate.outputs.base_url }}
          LIGHTHOUSE_ACCEPTANCE_RUNS: "3"
        run: npm run lighthouse:acceptance

      - name: Annotate Lighthouse outcome (warn-only)
        if: steps.gate.outputs.skipped != 'true' && steps.gate.outputs.run_lighthouse == 'true'
        run: |
          if [ "${{ steps.lighthouse.outcome }}" = "success" ]; then
            echo "::notice::Remote Lighthouse acceptance completed (warn budgets)."
          else
            echo "::warning::Remote Lighthouse acceptance reported failures (warn-only)."
          fi

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skipped != 'true' && always()
        with:
          name: founder-ui-acceptance-${{ github.run_id }}
          path: |
            archlucid-ui/test-results
            archlucid-ui/playwright-report-founder
            archlucid-ui/.lighthouseci-acceptance
          if-no-files-found: warn
