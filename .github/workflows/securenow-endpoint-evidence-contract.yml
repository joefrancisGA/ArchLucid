name: SecureNow endpoint evidence contract

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/load/securenow-multitenant-read.js'
      - 'scripts/ci/evaluate_securenow_scale_run.py'
      - 'scripts/ci/tests/test_securenow_endpoint_evidence.py'
      - '.github/workflows/securenow-endpoint-evidence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/ci/tests -p test_securenow_endpoint_evidence.py -v
