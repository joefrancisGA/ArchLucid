name: FND-061 Evidence Authorization

on:
  pull_request:
    branches: [master, main, RC49, fnd061/retrieval-indexing-authorization]
  merge_group:
    branches: [master, main, RC49]

permissions:
  contents: read

jobs:
  authorization-before-evidence:
    name: FND-061 authorization-before-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify scoped authorization precedes protected evidence reads
        run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj -c Release
          --filter 'FullyQualifiedName~EvidenceReadAuthorizationGateTests|FullyQualifiedName~SecureNowSnapshotHttpBoundaryTests|FullyQualifiedName~TerraformAdvisoryCitedRunHttpTests|FullyQualifiedName~AuthorityRunEventsControllerShareAccessTests|FullyQualifiedName~OutboundExportShareDenial'
      - name: Verify indexing and replication jobs check committed scope and seal
        run: >-
          dotnet test ArchLucid.Host.Composition.Tests/ArchLucid.Host.Composition.Tests.csproj -c Release
          --filter 'FullyQualifiedName~RetrievalIndexingOutboxAuthorizationTests|FullyQualifiedName~RetrievalIndexingOutboxProcessorCorrelationTests|FullyQualifiedName~RetrievalIndexingOutboxProcessorReplayIdempotencyTests|FullyQualifiedName~CosmosGraphSnapshotOutboxAuthorizationTests|FullyQualifiedName~CosmosGraphSnapshotOutboxProcessorTests'
      - name: Verify retrieval adapters consume only bound evidence
        run: >-
          dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj -c Release
          --filter 'FullyQualifiedName~GetRunDetailForRetrievalIndexingAsync_reads_only_bound_evidence'
      - name: Verify warm graph projections cannot cross scope
        run: >-
          dotnet test ArchLucid.KnowledgeGraph.Tests/ArchLucid.KnowledgeGraph.Tests.csproj -c Release
          --filter 'FullyQualifiedName~Warm_projection_is_not_reused_across_a_scope_boundary'
