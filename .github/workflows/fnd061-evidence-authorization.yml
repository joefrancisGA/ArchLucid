name: FND-061 Evidence Authorization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, main, RC49, RC50, fnd061/retrieval-indexing-authorization]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
    branches: [master, main, RC49, RC50]

# Cancel obsolete PR revisions, never an active merge-queue validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  authorization-before-evidence:
    name: FND-061 authorization-before-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Determine whether authorization compilation is needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/authorization_ci_scope.py
      - uses: actions/cache@v6
        if: steps.scope.outputs.run_tests == 'true'
        with:
          path: ~/.nuget/packages
          key: nuget-authorization-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-authorization-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        if: steps.scope.outputs.run_tests == 'true'
        with:
          global-json-file: global.json
      - name: Restore and compile shared authorization project graph
        if: steps.scope.outputs.run_tests == 'true'
        run: dotnet msbuild scripts/ci/AuthorizationTests.proj -restore -t:Build -p:Configuration=Release -m:1
      - name: Verify authorization in ArchLucid.Api.Tests
        if: steps.scope.outputs.run_tests == 'true'
        run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj -c Release --no-build --no-restore
          --filter 'FullyQualifiedName~EvidenceReadAuthorizationGateTests|FullyQualifiedName~SecureNowSnapshotHttpBoundaryTests|FullyQualifiedName~TerraformAdvisoryCitedRunHttpTests|FullyQualifiedName~AuthorityRunEventsControllerShareAccessTests|FullyQualifiedName~OutboundExportShareDenial|FullyQualifiedName~BlobExportRequesterBinding|FullyQualifiedName~DraftRequestsControllerTests|FullyQualifiedName~FindingInsightSignalShareAccessTests|FullyQualifiedName~ArchitectureShareAccessGateNotFoundPolicyTests|FullyQualifiedName~ConversationProofFirstHttpTests|FullyQualifiedName~ConversationControllerShareAccessTests|FullyQualifiedName~McpRetrievalToolsControllerTests|FullyQualifiedName~RunScopedEvidenceHubHttpTests|FullyQualifiedName~AuthorityPipelineWorkProcessorTests|FullyQualifiedName~DurableAuthorizationAuditTests|FullyQualifiedName~RemediationCentralAuthorizationTests|FullyQualifiedName~CentralAuthorizationAuditWorkerTests|FullyQualifiedName~CentralAuthorizationDecisionsTests|FullyQualifiedName~ScimProjectEvidenceEntitlementAuthorityTests|FullyQualifiedName~ArchLucid.Api.Tests.GraphControllerTests|FullyQualifiedName~SecureNowSnapshotExchangeContractTests|FullyQualifiedName~AuthorityManifestSummaryShareAccessTests|FullyQualifiedName~RunDetailPageBundleShareAccessTests|FullyQualifiedName~AuthorityQueryControllerDispositionTests|FullyQualifiedName~AuthorityReadsControllerShareAccessTests|FullyQualifiedName~AuthorityRunInventoryShareAccessTests|FullyQualifiedName~DraftRequestsControllerWorkLeaseTests|FullyQualifiedName~DraftIntakeSealedManifestRuntimeConflictTests|FullyQualifiedName~WizardIntakeDraftsControllerTests|FullyQualifiedName~ArchLucid.Api.Tests.RunsControllerTests|FullyQualifiedName~RunQueryControllerTests|FullyQualifiedName~RunGraphQueryServiceTests|FullyQualifiedName~ExportsControllerShareAccessTests|FullyQualifiedName~ExportsControllerScopeTests|FullyQualifiedName~ExportsControllerReplayExportAuditTests|FullyQualifiedName~ExportsControllerCompareSummaryAuditTests|FullyQualifiedName~RunsExportControllerTests|FullyQualifiedName~ProvenanceControllerTests|FullyQualifiedName~ArtifactExportSealedManifestRuntimeConflictTests|FullyQualifiedName~ArtifactExportControllerRunExportTests|FullyQualifiedName~DocxExportSealedManifestRuntimeConflictTests|FullyQualifiedName~DocxExportControllerAuditTests|FullyQualifiedName~DocxExportControllerCareerHonestyTests|FullyQualifiedName~ComparisonControllerShareAccessTests|FullyQualifiedName~RunComparisonControllerShareAccessTests|FullyQualifiedName~RunPairQueryValidatorTests|FullyQualifiedName~ArchitectureIntelligenceControllerTests|FullyQualifiedName~ArchitectureIntelligenceRunAuthorizationTests|FullyQualifiedName~DatabaseMigrationScriptTests'
      - name: Verify authorization in ArchLucid.Host.Core.Tests
        if: steps.scope.outputs.run_tests == 'true'
        run: >-
          dotnet test ArchLucid.Host.Core.Tests/ArchLucid.Host.Core.Tests.csproj -c Release --no-build --no-restore
          --filter 'FullyQualifiedName~DraftIntakeReasoningShareAccessTests|FullyQualifiedName~DraftIntakeReasoningServiceTests|FullyQualifiedName~AskServiceShareAccessTests'
      - name: Verify authorization in ArchLucid.Host.Composition.Tests
        if: steps.scope.outputs.run_tests == 'true'
        run: >-
          dotnet test ArchLucid.Host.Composition.Tests/ArchLucid.Host.Composition.Tests.csproj -c Release --no-build --no-restore
          --filter 'FullyQualifiedName~RetrievalIndexingOutboxAuthorizationTests|FullyQualifiedName~RetrievalIndexingOutboxProcessorCorrelationTests|FullyQualifiedName~RetrievalIndexingOutboxProcessorReplayIdempotencyTests|FullyQualifiedName~CosmosGraphSnapshotOutboxAuthorizationTests|FullyQualifiedName~CosmosGraphSnapshotOutboxProcessorTests|FullyQualifiedName~PostCommitProjectionOutboxAuthorizationTests|FullyQualifiedName~PostCommitProjectionOutboxProcessorTests|FullyQualifiedName~RunExportBlobPushRequesterAuthorizationTests'
      - name: Verify authorization in ArchLucid.Application.Tests
        if: steps.scope.outputs.run_tests == 'true'
        run: >-
          dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj -c Release --no-build --no-restore
          --filter 'FullyQualifiedName~PostCommitProjectionEnqueuerTests|FullyQualifiedName~FindingPriorityRerankerTests|FullyQualifiedName~FindingIacStubGenerator|FullyQualifiedName~DecisionEngineV2NodeMaterializerTests|FullyQualifiedName~AuthorityPipelineMaterializeWorkLegacyRunIdTests|FullyQualifiedName~ArchitectureRunCreateOrchestratorAsyncCompleteTests|FullyQualifiedName~ArchitectureRunCreateOrchestratorTechnologyLedgerSeedingTests|FullyQualifiedName~ArchitectureRunCreateOrchestratorInformationalAuditBestEffortTests'
      - name: Verify authorization in ArchLucid.Persistence.Tests
        if: steps.scope.outputs.run_tests == 'true'
        run: >-
          dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj -c Release --no-build --no-restore
          --filter 'FullyQualifiedName~GetRunDetailForCommittedProjectionAsync_reads_only_bound_evidence|FullyQualifiedName~InMemoryAuthorityPipelineWorkRepositoryLeaseAndRetryTests|FullyQualifiedName~InMemoryEvidenceBundleRepositoryContractTests'
      - name: Verify authorization in ArchLucid.KnowledgeGraph.Tests
        if: steps.scope.outputs.run_tests == 'true'
        run: >-
          dotnet test ArchLucid.KnowledgeGraph.Tests/ArchLucid.KnowledgeGraph.Tests.csproj -c Release --no-build --no-restore
          --filter 'FullyQualifiedName~Warm_projection_is_not_reused_across_a_scope_boundary'
