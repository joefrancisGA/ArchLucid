name: FND-018 Handler Failure Budget Observation

on:
  pull_request:
    branches: [master, RC49]
    paths:
      - 'ArchLucid.AgentRuntime/AgentHandlerFailureBudgetObserver.cs'
      - 'ArchLucid.AgentRuntime/RealAgentExecutorHandlerResiliencePipeline.cs'
      - 'ArchLucid.AgentRuntime/RealAgentExecutorSingleHandlerExecution.cs'
      - 'ArchLucid.Core/Diagnostics/ArchLucidInstrumentation.Agent.cs'
      - 'ArchLucid.AgentRuntime.Tests/AgentHandlerFailureBudgetObserverTests.cs'
      - 'ArchLucid.AgentRuntime.Tests/AgentRuntimePackageCoverageBatch18Tests.cs'
      - '.github/workflows/fnd018-handler-failure-budget-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fnd018-handler-observation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  handler-failure-budget-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute observer and existing handler resilience unit tests
        run: >-
          dotnet test ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj
          --configuration Release
          --filter 'FullyQualifiedName~AgentHandlerFailureBudgetObserverTests|FullyQualifiedName~AgentRuntimePackageCoverageBatch18Tests'
          --logger 'console;verbosity=normal'
