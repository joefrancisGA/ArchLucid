name: Benchmark evidence integrity

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/ci/compare_benchmark_baseline.py'
      - 'scripts/ci/tests/test_benchmark_evidence_fail_closed.py'
      - '.github/workflows/benchmark-evidence-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/ci/tests -p test_benchmark_evidence_fail_closed.py -v
