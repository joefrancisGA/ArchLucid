name: FND-016 Remediation Safety Controller
on:
  pull_request:
    branches: [master, main, architecture/fnd016-remediation-safety-controller]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify recovery attestation and emergency-stop gate
        run: python -m unittest discover -s scripts/tests -p 'test_fnd016_recovery_stop_gate.py' -v
      - name: Verify FND-014/015/016 integration
        run: python -m unittest discover -s scripts/tests -p 'test_fnd016_remediation_safety_controller.py' -v
