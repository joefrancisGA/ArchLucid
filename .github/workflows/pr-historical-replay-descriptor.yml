name: Historical replay descriptor

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/pr-historical-replay-descriptor.yml'
      - 'ArchLucid.Application/Replay/Historical/**'
      - 'ArchLucid.HistoricalReplay.Worker/**'
      - 'ArchLucid.Application/ArchLucid.Application.csproj'
      - 'ArchLucid.Decisioning/Validation/**'
      - 'ArchLucid.Contracts/Agents/AgentResult*.cs'
      - 'ArchLucid.Core/InfraEvidence/AzureInventoryPublicNetworkAccessResolver.cs'
      - 'ArchLucid.Application.Tests/Replay/RecordedHistoricalReplayTests.cs'
      - 'ArchLucid.Application.Tests/Replay/HistoricalReplayAssuranceTests.cs'
      - 'docs/assurance/FND097_INDEPENDENT_HISTORICAL_ASSURANCE.md'
      - 'ArchLucid.AgentRuntime/AgentResultParser.cs'
      - 'ArchLucid.Application/InfraEvidence/SecureNowArchitect/InventoryReachabilityPathGraph.cs'
      - 'schemas/agentresult.schema.json'
      - 'docs/assurance/FND095_RECORDED_INPUT_REPLAY.md'
      - 'ArchLucid.Application/Replay/ReplayRunPrepareStage.cs'
      - 'ArchLucid.Application.Tests/Replay/HistoricalReplayCompletenessTests.cs'
      - 'ArchLucid.Application.Tests/Replay/HistoricalReplayRetentionTests.cs'
      - 'ArchLucid.Core/Audit/AuditEventTypes.HistoricalReplay.cs'
      - 'ArchLucid.Core/Audit/RequiredAuditEventTypes.cs'
      - 'ArchLucid.Core/Persistence/ApplicationPorts/Audit/IAuditRepository.cs'
      - 'ArchLucid.Persistence/Audit/DapperAuditRepository.CommittedLookup.cs'
      - 'ArchLucid.Persistence/Audit/CachingAuditRepository.cs'
      - 'ArchLucid.Core/Tenancy/TenantErasureEligibility.cs'
      - 'ArchLucid.Persistence/BlobStore/LocalFileArtifactBlobStore.cs'
      - 'ArchLucid.Application.Tests/Replay/ReplayRunPrepareStageTests.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/SecureNowOfflineQuestionReplayTests.cs'
      - 'ArchLucid.Contracts/Agents/AgentExecutionTrace.cs'
      - 'ArchLucid.Decisioning/Services/ManifestHashService.cs'
      - 'ArchLucid.Core/Manifest/**'
      - 'ArchLucid.Core/Persistence/Ports/IArtifactBundleRepository.cs'
      - 'ArchLucid.Core/Persistence/ApplicationPorts/Models/RunRecord.cs'
      - 'ArchLucid.Core/Persistence/ApplicationPorts/InfraEvidence/AzureInventorySnapshotRecord.cs'
      - 'docs/assurance/FND094_HISTORICAL_REPLAY_DESCRIPTOR.md'
      - 'docs/assurance/FND096_GOVERNED_REPLAY_RETENTION.md'

permissions:
  contents: read

concurrency:
  group: historical-replay-descriptor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  historical-replay:
    name: Verify sealed historical replay descriptor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and probe the isolated replay worker
        shell: bash
        run: |
          dotnet publish ArchLucid.HistoricalReplay.Worker/ArchLucid.HistoricalReplay.Worker.csproj -c Release -o "$RUNNER_TEMP/historical-worker"
          docker build --iidfile "$RUNNER_TEMP/historical-image" -f ArchLucid.HistoricalReplay.Worker/Dockerfile "$RUNNER_TEMP/historical-worker"
          image=$(cat "$RUNNER_TEMP/historical-image")
          docker run --rm --pull never --network none --ipc none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 256m --memory-swap 256m --cpus 1 \
            --log-driver none --user 65532:65532 --entrypoint /bin/sh "$image" -ec '
              test "$(tail -n +3 /proc/net/dev | cut -d : -f 1 | tr -d "[:space:]")" = lo
              test "$(awk "END {print NR}" /proc/net/route)" -le 1
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
              grep -Eq "^CapEff:[[:space:]]+0000000000000000$" /proc/self/status
              test "$(cat /sys/fs/cgroup/memory.max)" -eq 268435456
              test "$(cat /sys/fs/cgroup/pids.max)" -eq 64
              test ! -S /var/run/docker.sock
              test -z "${AZURE_CLIENT_SECRET:-}"
              ! touch /app/probe-write
            '
          echo "FND095_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Run focused Release tests
        env:
          FND095_REPLAY_EVIDENCE_DIR: ${{ runner.temp }}/historical-replay-descriptor/replay
          FND097_ASSURANCE_EVIDENCE_DIR: ${{ runner.temp }}/historical-replay-descriptor/assurance
          FND096_RESTORE_EVIDENCE: ${{ runner.temp }}/historical-replay-descriptor/fnd096-restore.json
        run: >-
          dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj -c Release
          --filter 'FullyQualifiedName~HistoricalReplayCompletenessTests|FullyQualifiedName~HistoricalReplayRetentionTests|FullyQualifiedName~ReplayRunPrepareStageTests|FullyQualifiedName~SecureNowOfflineQuestionReplayTests|FullyQualifiedName~RecordedHistoricalReplayTests|FullyQualifiedName~RecordedReplayWorkerIntegrationTests|FullyQualifiedName~HistoricalReplayAssuranceTests'
          --results-directory "$RUNNER_TEMP/historical-replay-descriptor"
          --logger 'trx;LogFileName=application.trx'
      - name: Require executed passing descriptor and adjacent replay tests
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          result = Path(os.environ["RUNNER_TEMP"]) / "historical-replay-descriptor" / "application.trx"
          root = ElementTree.parse(result)
          counters = root.find(".//{*}Counters")
          if counters is None:
              raise SystemExit("Test result does not contain counters")
          total, executed, passed = (int(counters.attrib[key]) for key in ("total", "executed", "passed"))
          if not total or total != executed or executed != passed:
              raise SystemExit(f"total={total}, executed={executed}, passed={passed}")
          executed_ids = {
              item.attrib.get("testId")
              for item in root.findall(".//{*}Results/{*}UnitTestResult")
              if item.attrib.get("outcome") == "Passed"
          }
          for suite in ("HistoricalReplayCompletenessTests", "HistoricalReplayRetentionTests",
                        "ReplayRunPrepareStageTests", "SecureNowOfflineQuestionReplayTests",
                        "RecordedHistoricalReplayTests", "RecordedReplayWorkerIntegrationTests", "HistoricalReplayAssuranceTests"):
              suite_ids = {
                  unit.attrib["id"]
                  for unit in root.findall(".//{*}TestDefinitions/{*}UnitTest")
                  if (method := unit.find("{*}TestMethod")) is not None
                  and method.attrib.get("className", "").endswith("." + suite)
              }
              if not executed_ids.intersection(suite_ids):
                  raise SystemExit(f"No {suite} tests executed")
          restore = json.loads(result.with_name("fnd096-restore.json").read_text(encoding="utf-8"))
          if restore["archiveReads"] != 1 or restore["payloadBytes"] <= 0 or restore["storedBytes"] <= restore["payloadBytes"]:
              raise SystemExit("Restore evidence did not record an encrypted archive round trip")
          for product, mode in (("ArchLucid", "RecordedTyped"), ("ArchLucid", "RecordedRaw"), ("SecureNow", "RecordedTyped")):
              replay = json.loads((result.parent / "replay" / f"{product}-{mode}.json").read_text(encoding="utf-8"))
              if replay["outcome"] != "ReproducedWithinScope" or replay["image"] != os.environ["FND095_TEST_IMAGE"]:
                  raise SystemExit(f"Invalid isolated replay evidence for {product} {mode}")
              if product == "ArchLucid" and mode == "RecordedTyped" and not replay["restored"]:
                  raise SystemExit("ArchLucid typed replay did not use encrypted restoration")
          for product in ("ArchLucid", "SecureNow"):
              for verdict in ("Supported", "Refuted", "Indeterminate"):
                  path = result.parent / "assurance" / f"{product}-{verdict}.json"
                  fixture = json.loads(path.read_text(encoding="utf-8"))
                  if (fixture["product"], fixture["reconstruction"], fixture["reproduction"], fixture["verdict"], fixture["image"]) != (
                      product, "Ready", "ReproducedWithinScope", verdict, os.environ["FND095_TEST_IMAGE"]
                  ):
                      raise SystemExit(f"Three-way outcome separation not established for {product}, {verdict}")
          print(f"{passed} tests passed")
          PY
      - name: Publish restoration, replay and independent assurance evidence
        uses: actions/upload-artifact@v7
        with:
          name: historical-replay-retention-evidence
          path: |
            ${{ runner.temp }}/historical-replay-descriptor/application.trx
            ${{ runner.temp }}/historical-replay-descriptor/fnd096-restore.json
            ${{ runner.temp }}/historical-replay-descriptor/replay/*.json
            ${{ runner.temp }}/historical-replay-descriptor/assurance/*.json
          if-no-files-found: error
