name: ArchLucid hotpath evidence contract

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/ci/evaluate_archlucid_hotpath_evidence.py'
      - 'scripts/ci/tests/test_archlucid_hotpath_evidence.py'
      - 'scripts/load/hotpaths.js'
      - '.github/workflows/archlucid-hotpath-evidence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/ci/tests -p test_archlucid_hotpath_evidence.py -v
