name: FND-002 Contract Compatibility

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fnd002-contract-compatibility:
    name: FND-002 contract compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema[format]==4.23.0'
      - name: Validate schema and compatibility fixtures (fail closed)
        run: python -m unittest discover -s scripts/tests -p 'test_fnd002_contract.py' -v
