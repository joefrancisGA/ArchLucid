name: API usage metering isolated regression

# Validation-only branch; do not merge this workflow.
on:
  push:
    branches: [validation/api-usage-metering-event-identity-20261124]
    paths: [.github/workflows/api-usage-metering-isolated-regression.yml]
permissions:
  contents: read
jobs:
  focused-metering:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9e59a90fb5ccc41eed69d9f97d1c3b0686895f74
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Core identity regressions
        run: dotnet test ArchLucid.Core.Tests/ArchLucid.Core.Tests.csproj -c Release --filter 'FullyQualifiedName~UsageEventIdempotencyKeysTests' --logger 'trx;LogFileName=core.trx' --results-directory TestResults/metering
      - name: API middleware and in-memory accounting regressions
        run: dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj -c Release --filter 'FullyQualifiedName~ApiRequestMeteringIdentityTests|FullyQualifiedName~ApiRequestMeteringMiddlewareTests' --logger 'trx;LogFileName=api.trx' --results-directory TestResults/metering
      - name: Start disposable SQL Server
        shell: bash
        run: |
          set -euo pipefail
          password="Metering!$(openssl rand -hex 20)"
          echo "::add-mask::$password"
          docker run -d --name metering-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$password" -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          connection="Server=127.0.0.1,1433;Initial Catalog=ArchLucidMeteringTests;User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
          echo "::add-mask::$connection"
          echo "ARCHLUCID_SQL_TEST=$connection" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if docker exec metering-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -l 2 -b -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::Disposable SQL Server did not become ready"
          exit 1
      - name: SQL persistence regressions
        run: dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj -c Release --filter 'FullyQualifiedName~DapperUsageEventRepositorySqlIntegrationTests' --logger 'trx;LogFileName=sql.trx' --results-directory TestResults/metering
      - name: Require named regressions to execute and pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
              "core": {"ForApiRequest_uses_stable_event_identity_in_new_namespace", "ForApiRequest_rejects_empty_event_id"},
              "api": {"Shared_incoming_correlation_counts_two_requests_but_replaying_events_does_not"},
              "sql": {"Api_request_events_with_shared_correlation_are_distinct_and_replays_are_deduplicated"},
          }
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for suite, names in expected.items():
              root = ET.parse(Path("TestResults/metering") / (suite + ".trx"))
              results = root.findall(".//t:UnitTestResult", ns)
              actual = {r.attrib["testName"].rsplit(".", 1)[-1]: r.attrib.get("outcome") for r in results}
              if any(actual.get(name) != "Passed" for name in names) or any(r.attrib.get("outcome") != "Passed" for r in results):
                  raise SystemExit(f"{suite}: missing, skipped, or failed regression: {actual}")
              print(f"{suite}: {len(results)} tests passed, including all required regressions.")
          PY
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-usage-metering-trx
          path: TestResults/metering/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f metering-sql || true
