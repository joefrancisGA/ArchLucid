# Nightly idle-based teardown for RC6 dev's ephemeral Azure AI Search service.
#
# Owner decision (2026-07-05): the search service defaults to staying ALIVE. This workflow only
# stashes (index definition + doc count to blob) and deletes it when the repo variable
# RAG_STASH_NIGHTLY is "true" AND the service looks idle (see Stash-RC6AzureSearchRetrieval.ps1).
# The next CD deploy (or a manual run of scripts/deploy/Ensure-RC6AzureSearchRetrieval.ps1)
# recreates it automatically.
#
# To opt in: gh variable set RAG_STASH_NIGHTLY --body true
# To opt out (keep-alive, default): gh variable set RAG_STASH_NIGHTLY --body false (or delete the variable)
name: RAG nightly stash (dev)

on:
  schedule:
    - cron: '0 6 * * *' # ~02:00 America/New_York (accounts for DST drift by design; exact hour is not critical)
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the idle check and stash+delete unconditionally"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  stash-if-enabled:
    name: Stash and tear down Azure AI Search (if enabled + idle)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when RAG_STASH_NIGHTLY is not enabled
        if: vars.RAG_STASH_NIGHTLY != 'true'
        run: echo "::notice::RAG_STASH_NIGHTLY is not 'true' — search service (if any) stays alive. Nothing to do."

      - name: Azure login (OIDC)
        if: vars.RAG_STASH_NIGHTLY == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stash and tear down (idle-based)
        if: vars.RAG_STASH_NIGHTLY == 'true'
        shell: pwsh
        run: |
          $forceFlag = '${{ github.event.inputs.force }}' -eq 'true'
          # Call operator (&), not a bare path: the runner checks out this file without the
          # executable bit, and pwsh on Linux refuses to exec a non-executable file via ./path.
          & ./scripts/deploy/Stash-RC6AzureSearchRetrieval.ps1 -Force:$forceFlag
