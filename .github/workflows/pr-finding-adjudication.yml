name: Independent finding adjudication contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/pr-finding-adjudication.yml'
      - 'docs/assurance/FND080_FINDING_ADJUDICATION.md'
      - 'scripts/assurance/paired_engine_evaluation.py'
      - 'scripts/assurance/review_divergent_findings.py'
      - 'scripts/ci/tests/test_paired_engine_evaluation.py'
      - 'scripts/ci/tests/test_review_divergent_findings.py'

permissions:
  contents: read

concurrency:
  group: finding-adjudication-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-adjudication:
    name: Run synthetic adjudication and regression cases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run acceptance tests
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_review_divergent_findings.py' -v
