name: Aspects tenant binding concurrent first-write guard

# Narrow PR-only source + SQL contract gate; never a full master build.
on:
  pull_request:
    branches: [master]
    paths:
      - ArchLucid.Persistence/Tenancy/DapperTenantDatabaseBindingRepository.cs
      - scripts/tests/test_aspects_tenant_binding_merge_guard.py
      - .github/workflows/aspects-tenant-binding-merge-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-binding-upsert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Regression — first-write TenantDatabaseBindings MERGE requires HOLDLOCK
        run: python -m unittest discover -s scripts/tests -p 'test_aspects_tenant_binding_merge_guard.py' -v
