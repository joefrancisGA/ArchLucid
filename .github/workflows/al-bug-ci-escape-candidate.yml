name: al-bug CI escape candidate

# Honest v1 (ABQ-30): on a red default-branch CI run, dry-run ingest and upload
# ci-escape-candidate.jsonl. Do not git-push the escape log. Do not create PD-###.
# Recursion guard: this workflow is not named "CI" and is not mapped in the job map.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  propose-escape:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Dry-run CI escape ingest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id || github.run_id }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}"
          CHECK_ARGS=()
          if command -v gh >/dev/null 2>&1 && [ -n "${{ github.event.workflow_run.id }}" ]; then
            while IFS= read -r job_name; do
              [ -z "$job_name" ] && continue
              case "$job_name" in
                *azure-extractor-pester*|*al-bug CI escape*) continue ;;
              esac
              CHECK_ARGS+=(--check-name "$job_name")
            done < <(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .name' || true)
          fi
          if [ ${#CHECK_ARGS[@]} -eq 0 ]; then
            CHECK_ARGS=(--check-name CI)
          fi
          python3 scripts/agent/al-bug-ingest-ci-escape.py \
            "${CHECK_ARGS[@]}" \
            --run-url "$RUN_URL" \
            --job-map scripts/agent/al-bug-ci-test-to-paths.json \
            --dry-run \
            --output ci-escape-candidate.jsonl \
            || true

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ci-escape-candidate
          path: ci-escape-candidate.jsonl
          if-no-files-found: ignore
