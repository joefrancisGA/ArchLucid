name: FND-010 Managed Checkpoint Contract
on:
  pull_request:
    branches: [master, main, architecture/fnd010-independent-signed-checkpoints]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install 'cryptography>=44,<47' 'azure-identity>=1.17,<2' 'azure-keyvault-keys>=4.9,<5' 'azure-storage-blob>=12.20,<13'
      - name: Verify managed checkpoint contract
        run: python -m unittest discover -s scripts/tests -p 'test_fnd010_managed_checkpoint.py' -v
