name: Dispatch nightly full CI

on:
  schedule:
    - cron: '23 7 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: nightly-full-ci-master
  cancel-in-progress: false

jobs:
  dispatch_full_ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch full CI for a new master commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_sha=$(gh api "repos/$GH_REPO/branches/master" --jq '.commit.sha')
          existing_run=$(gh run list --repo "$GH_REPO" --workflow ci.yml --branch master \
            --commit "$head_sha" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -n "$existing_run" ]]; then
            echo "Full CI has already been requested for $head_sha (run $existing_run)."
            exit 0
          fi

          gh workflow run ci.yml --repo "$GH_REPO" --ref master -f run_extended_live_a11y_matrix=false
