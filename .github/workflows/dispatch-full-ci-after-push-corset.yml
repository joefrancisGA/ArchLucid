# Queue full ci.yml (workflow_dispatch) after trunk push corset succeeds on master.
# Mirrors scripts/ci/dispatch_full_ci_matrix.sh for agents and owners without Actions write on PAT.
name: Dispatch full CI after push corset

on:
  workflow_run:
    workflows:
      - "UI typecheck on push"
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-full-ci-after-push-corset
  cancel-in-progress: false

jobs:
  dispatch_full_ci:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch ci.yml on master
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "${GH_REPO}" --ref master -f run_extended_live_a11y_matrix=false
          echo "Queued full CI on master for commit ${HEAD_SHA}"
