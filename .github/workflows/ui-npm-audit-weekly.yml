# Weekly npm audit for archlucid-ui (TB-864). Non merge-blocking scheduled supply-chain telemetry.
# Policy: docs/architecture/ui_dependency_assessment.md §19 recommendation 4.

name: "Supply chain: UI npm audit weekly"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  ui-npm-audit-weekly:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: UI npm audit runner unit tests (TB-864)
        run: python -m unittest discover -s scripts/ci/tests -p "test_run_ui_npm_audit.py"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Install archlucid-ui dependencies
        working-directory: archlucid-ui
        run: npm ci

      - name: Run UI npm audit and write weekly report
        run: |
          python scripts/ci/run_ui_npm_audit.py \
            --ui-dir archlucid-ui \
            --json-out artifacts/ui-npm-audit/npm-audit.json \
            --markdown-out artifacts/ui-npm-audit/npm-audit.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-npm-audit-weekly
          path: artifacts/ui-npm-audit/**/*
          if-no-files-found: warn
