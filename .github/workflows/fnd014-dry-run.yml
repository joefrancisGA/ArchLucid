name: FND-014 Dry-Run Simulation
on:
  pull_request:
    branches: [master, main, architecture/fnd010-evidence-authorization-boundary]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p 'test_fnd014_isolated_dry_run.py' -v
