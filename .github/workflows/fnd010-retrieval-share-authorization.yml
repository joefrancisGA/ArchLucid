name: FND-010 Retrieval Share Authorization
on:
  pull_request:
    branches: [master, main]
    paths:
      - 'ArchLucid.Api/Controllers/Planning/RetrievalController*.cs'
      - 'ArchLucid.Api.Tests/RetrievalController*Tests.cs'
      - 'ArchLucid.Core/Retrieval/RetrievalQuery.cs'
      - 'ArchLucid.Retrieval/**'
      - 'ArchLucid.Retrieval.Tests/**'
      - '.github/workflows/fnd010-retrieval-share-authorization.yml'
permissions:
  contents: read
concurrency:
  group: fnd010-retrieval-share-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  retrieval-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify focused HTTP retrieval authorization
        run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj
          --filter "FullyQualifiedName~RetrievalControllerTests|FullyQualifiedName~RetrievalControllerShareAccessTests"
  retrieval-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify pre-ranking filters and retrieval pipeline
        run: >-
          dotnet test ArchLucid.Retrieval.Tests/ArchLucid.Retrieval.Tests.csproj
          --filter "FullyQualifiedName~AzureSearchTenantScopeFilterBuilderTests|FullyQualifiedName~InMemoryVectorIndexTests|FullyQualifiedName~RetrievalQueryServiceTests"
