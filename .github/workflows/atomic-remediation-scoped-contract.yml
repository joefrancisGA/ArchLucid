name: Atomic remediation scoped contract

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Core/Persistence/ApplicationPorts/InfraEvidence/ProjectScopedRepositoryCapabilities.cs'
      - 'ArchLucid.Persistence/InfraEvidence/ProjectScopedRepositoryAdapters.cs'
      - '.github/workflows/atomic-remediation-scoped-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj --configuration Release --filter 'FullyQualifiedName~RemediationInstanceServiceTests'
