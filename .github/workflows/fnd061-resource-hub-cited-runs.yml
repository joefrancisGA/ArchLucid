name: FND-061 Infrastructure evidence cited run authorization

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Application/InfraEvidence/CloudResourceEvidenceHubService.cs'
      - 'ArchLucid.Application/InfraEvidence/InfraEvidenceDriftWorkbenchQueryService.cs'
      - 'ArchLucid.Application/InfraEvidence/InfraEvidenceAskGroundingService.cs'
      - 'ArchLucid.Application/InfraEvidence/InfraEvidenceAskSealedManifestHashGuard.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/InfraEvidenceAskGroundingServiceTests.cs'
      - 'ArchLucid.Api.Tests/InfraEvidence/InfraEvidenceAskCitedRunHttpTests.cs'
      - 'ArchLucid.Api/Controllers/InfraEvidence/InfraEvidenceAskController*.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/InfraEvidenceDriftWorkbenchQueryServiceTests.cs'
      - 'ArchLucid.Application/InfraEvidence/IInfraEvidenceRunReadAccess.cs'
      - 'ArchLucid.Application/InfraEvidence/Mermaid/InfraEvidenceSnapshotMermaidService.cs'
      - 'ArchLucid.Application/InfraEvidence/Mermaid/InfraEvidenceSnapshotSealedManifestHashGuard.cs'
      - 'ArchLucid.Api/Support/*ShareAccessGate.cs'
      - 'ArchLucid.Api/Support/AskEvidenceAccess.cs'
      - 'ArchLucid.Api/Configuration/ApiWebLayerServiceCollectionExtensions.cs'
      - 'ArchLucid.Api.Tests/InfraEvidence/RunScopedEvidenceHubHttpTests.cs'
      - 'ArchLucid.Api.Tests/InfraEvidence/DriftWorkbenchCitedRunHttpTests.cs'
      - 'ArchLucid.Api/Controllers/InfraEvidence/InfraEvidenceDiffsController*.cs'
      - 'ArchLucid.Api/Controllers/InfraEvidence/InfraEvidenceSnapshotsController*.cs'
      - '.github/workflows/fnd061-resource-hub-cited-runs.yml'

permissions:
  contents: read

jobs:
  cited-run-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj -c Release
          --filter 'FullyQualifiedName~RunScopedEvidenceHubHttpTests|FullyQualifiedName~DriftWorkbenchCitedRunHttpTests|FullyQualifiedName~InfraEvidenceAskCitedRunHttpTests'
          --logger 'console;verbosity=normal'
      - run: >-
          dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj -c Release
          --filter 'FullyQualifiedName~InfraEvidenceDriftWorkbenchQueryServiceTests|FullyQualifiedName~InfraEvidenceAskGroundingServiceTests'
          --logger 'console;verbosity=normal'
