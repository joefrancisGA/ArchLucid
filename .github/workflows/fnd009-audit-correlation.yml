name: FND-009 Audit Correlation Compatibility

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fnd009-audit-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema[format]==4.23.0'
      - run: python -m unittest discover -s scripts/tests -p 'test_fnd009_audit_correlation.py' -v
