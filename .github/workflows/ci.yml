  # Live API + Sql + Next.js (no mock). `ui-e2e-live`: @release-gate subset (demo-workspace smokes; aligns with rc-release-gate).
  # `ui-e2e-live-extended`: warn-only remainder of live-api-* + marketing specs, sharded 4-way (each shard: isolated
  # API + SQL catalog, `workers: 1` within the shard) to keep wall-clock well under the 180min ceiling that used to
  # cause this job to time out mid-suite. Full @live-a11y-full-matrix via workflow_dispatch input.
  # docs/go-to-market/DEMO_WORKSPACES.md
  ui-e2e-live:
    name: "Operator UI: e2e live API + SQL (@release-gate subset)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - dotnet-full-regression-core-complete
      - dotnet-full-regression-slow-api
      - dotnet-full-regression-slow-domain
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Restore & build API (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Api/ArchLucid.Api.csproj --no-restore -c Release

      # Build Next.js before starting the API reduces peak memory on the runner.
      - name: Install UI deps & build Next (standalone)
        working-directory: archlucid-ui
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_E2E_ALLOW_DEMO_BLOCKED_ROUTES: "1"
        run: |
          npm ci
          npm run build

      - name: Wait for SQL Server to be ready
        uses: ./.github/actions/wait-for-sqlserver

      # API connects with Initial Catalog set; schema bootstrap does not CREATE DATABASE (unlike dotnet test + SqlServerTestCatalogCommands).
      - name: Create SQL catalog for live API e2e
        run: |
          set -e
          docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -Q "IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name = N'ArchLucidLiveE2e') CREATE DATABASE ArchLucidLiveE2e;"

      - name: Start ArchLucid.Api (background)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5128
          ConnectionStrings__ArchLucid: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidLiveE2e"
          ArchLucid__StorageProvider: Sql
          ArchLucidAuth__Mode: DevelopmentBypass
          ArchLucidAuth__AllowTestActorHeaders: "true"
          Authentication__ApiKey__DevelopmentBypassAll: "true"
          # Trial live specs expect Noop checkout (env wins over optional appsettings.SaaS.json).
          Billing__Provider: Noop
          AgentExecution__Mode: Simulator
          Observability__Prometheus__Enabled: "true"
          Observability__Prometheus__RequireScrapeAuthentication: "false"
          RateLimiting__Registration__PermitLimit: "500"
          ArchLucid__E2eHarness__SharedSecret: "ci-live-e2e-harness-secret-min16!"
          Cors__AllowedOrigins__0: "http://127.0.0.1:3000"
          Cors__AllowedOrigins__1: "http://localhost:3000"
          DataConsistency__InitialDelaySeconds: "0"
          HostLeaderElection__Enabled: "false"
          Demo__Enabled: "true"
          Demo__SeedOnStartup: "true"
          Demo__AnonymousViewer__Enabled: "true"
          # CI run 2526 shard 2 diagnosis: default (Development) console trace exporter dumps every
          # SQL/HTTP Activity to stdout, ballooning the API log to 189 MB and compounding job slowness.
          Observability__ConsoleExporter__Enabled: "false"
        run: |
          set -e
          nohup dotnet run --no-build -c Release --project ArchLucid.Api/ArchLucid.Api.csproj > "${RUNNER_TEMP}/live-api.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/live-api.pid"

      - name: Wait for API readiness
        env:
          API_URL: http://127.0.0.1:5128
        run: bash scripts/ci/wait-for-api-ready.sh "${RUNNER_TEMP}/live-api.log"

      - name: Wait for demo preview (release-gate smokes)
        env:
          ARCHLUCID_API_LOG_FILE: ${{ runner.temp }}/live-api.log
          ARCHLUCID_DEMO_PREVIEW_WAIT_ATTEMPTS: "90"
          ARCHLUCID_DEMO_WORKSPACES_MANIFEST: fixtures/demo-workspaces/demo-workspaces.fixture.manifest.json
        run: bash scripts/ci/wait-for-demo-preview.sh

      - name: Wait for DB-backed pilot-run-deltas (release-gate smokes)
        env:
          ARCHLUCID_API_LOG_FILE: ${{ runner.temp }}/live-api.log
          ARCHLUCID_DB_PILOT_WAIT_ATTEMPTS: "60"
          ARCHLUCID_DEMO_WORKSPACES_MANIFEST: fixtures/demo-workspaces/demo-workspaces.fixture.manifest.json
        run: bash scripts/ci/wait-for-db-backed-pilot-endpoint.sh

      - name: Install Playwright browsers & run live e2e (@release-gate — aligns with rc-release-gate ui-e2e-live-rc)
        working-directory: archlucid-ui
        env:
          CI: true
          API_URL: http://127.0.0.1:5128
          ARCHLUCID_API_LOG_FILE: ${{ runner.temp }}/live-api.log
          LIVE_API_URL: http://127.0.0.1:5128
          LIVE_E2E_SKIP_NEXT_BUILD: "1"
          LIVE_E2E_HARNESS_SECRET: "ci-live-e2e-harness-secret-min16!"
          NODE_OPTIONS: --max-old-space-size=6144
          E2E_INFRA_MAX_ATTEMPTS: "12"
          E2E_INFRA_DB_MAX_ATTEMPTS: "25"
          E2E_INFRA_BASE_DELAY_MS: "1000"
          E2E_INFRA_PROBE_ATTEMPTS: "45"
          # Api host is DevelopmentBypass — prevent inherited env from sending JWT/API key the server rejects (401).
          LIVE_JWT_TOKEN: ""
          LIVE_API_KEY: ""
          LIVE_API_KEY_READONLY: ""
          ARCHLUCID_DEMO_WORKSPACES_MANIFEST: fixtures/demo-workspaces/demo-workspaces.fixture.manifest.json
        run: |
          npx playwright install --with-deps chromium
          bash ../scripts/ci/wait-for-api-ready.sh "${ARCHLUCID_API_LOG_FILE}"
          bash ../scripts/ci/wait-for-db-backed-pilot-endpoint.sh
          echo "Playwright @release-gate live e2e start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx playwright test --workers=1 --grep @release-gate
          echo "Playwright @release-gate live e2e end: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload Playwright test-results (traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-test-results
          path: archlucid-ui/test-results
          if-no-files-found: warn

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-blob-report
          path: archlucid-ui/blob-report
          if-no-files-found: warn

      - name: Upload live API log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-api-log
          path: ${{ runner.temp }}/live-api.log
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-playwright-report
          path: archlucid-ui/playwright-report
          if-no-files-found: warn

  ui-e2e-live-extended:
    name: "Operator UI: e2e live API + SQL (extended matrix; warn-only) [shard ${{ matrix.shard }}/${{ strategy.job-total }}]"
    continue-on-error: true
    needs:
      - dotnet-full-regression-core-complete
      - dotnet-full-regression-slow-api
      - dotnet-full-regression-slow-domain
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
