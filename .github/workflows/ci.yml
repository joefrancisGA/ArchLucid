          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore ArchLucid.sln

      - name: Build (Release)
        run: dotnet build ArchLucid.sln --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      - name: Test — ArchLucid.Api.Tests (Integration, exclude Category=Slow)
        env:
          ARCHLUCID_SQL_TEST: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests"
        run: >
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj --no-build -c Release --settings coverage.runsettings
          --filter "Category!=Slow&Category=Integration"
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/coverage-full-core-api-integration"
