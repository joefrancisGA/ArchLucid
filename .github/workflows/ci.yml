          if-no-files-found: warn

  dotnet-benchmark-regression:
    name: ".NET: benchmark regression (short job)"
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build benchmarks
        run: |
          dotnet restore ArchLucid.Benchmarks/ArchLucid.Benchmarks.csproj
          dotnet build --no-restore -c Release ArchLucid.Benchmarks/ArchLucid.Benchmarks.csproj

      - name: Run BenchmarkDotNet (short) and compare baseline
        env:
          BENCH_ART: ${{ runner.temp }}/bench-artifacts
        run: |
          set -e
          dotnet run -c Release --no-build --project ArchLucid.Benchmarks -- \
            --filter "*" -j short --exporters json --artifacts "$BENCH_ART"
          python3 scripts/ci/compare_benchmark_baseline.py \
            --baseline ci/benchmark-baseline.json \
            --results "$BENCH_ART/results"

  security-zap-api-baseline:
    name: "Security: OWASP ZAP baseline (API container)"
    needs: docker-build-smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prefetch Microsoft .NET base images (MCR + BuildKit HEAD 403 mitigation)
        run: bash scripts/ci/prefetch-docker-dotnet-base-images.sh

      - name: Build API image (reuse GHA cache from docker-build-smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ArchLucid.Api/Dockerfile
          tags: archlucid-api:zap
          load: true
          pull: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api-docker-smoke-v2

      - name: Run API on Docker network and ZAP baseline
        env:
          ZNET: zapci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -e
          cleanup() {
            docker rm -f archlucid-zap-api 2>/dev/null || true
            docker network rm "$ZNET" 2>/dev/null || true
          }
          trap cleanup EXIT
          docker network create "$ZNET"
          # zap-baseline.py writes /zap/wrk/zap.yaml; the image user often cannot write the image's /zap/wrk.
          ZAP_WRK="${RUNNER_TEMP:-/tmp}/zap-wrk-${ZNET}"
          mkdir -p "$ZAP_WRK"
          # ZAP runs as uid 1000 (zap); RUNNER_TEMP is often owned by uid 1001 (runner) → Permission denied without this.
          chmod -R a+rwx "$ZAP_WRK"
          # Release-published image: force DAST-friendly config via env (do not rely on appsettings.Development.json
          # being present in /app; Sql + localhost connection string would hang or fail before Kestrel listens).
          docker run -d --name archlucid-zap-api --network "$ZNET" -p 8080:8080 \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ArchLucid__StorageProvider=InMemory \
            -e ArchLucidAuth__Mode=DevelopmentBypass \
            -e IntegrationEvents__TransactionalOutboxEnabled=false \
            -e Demo__SeedOnStartup=false \
            archlucid-api:zap
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health/live; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "API did not become healthy in time (last 200 lines of container logs):"
              docker logs archlucid-zap-api 2>&1 | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          docker run --rm --network "$ZNET" \
            -v "$ZAP_WRK:/zap/wrk" \
            -v "$GITHUB_WORKSPACE/infra/zap:/zap/wrk/config:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://archlucid-zap-api:8080 -c config/baseline-pr.tsv -r zap-report.html -I

      - name: Upload ZAP scan report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: ${{ runner.temp }}/zap-wrk-zapci-${{ github.run_id }}-${{ github.run_attempt }}/zap-report.html

  # Lightweight per-PR API fuzz: Schemathesis examples-only phase (~1–2 min) to catch response
  # schema violations before merge. Full fuzz (fuzzing + stateful) runs weekly in schemathesis-scheduled.yml.
  api-schemathesis-light:
    name: "Security: Schemathesis light fuzz (full CI)"
    needs:
      - dotnet-full-regression-core-complete
      - dotnet-full-regression-slow-api
      - dotnet-full-regression-slow-domain
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Prefetch Microsoft .NET base images (MCR + BuildKit HEAD 403 mitigation)
        run: bash scripts/ci/prefetch-docker-dotnet-base-images.sh

      - name: Build API image
        run: docker build -f ArchLucid.Api/Dockerfile -t archlucid-api:fuzz-light .

      - name: Run API and lightweight Schemathesis
        env:
          FUZZNET: fuzz-light-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f archlucid-fuzz-api 2>/dev/null || true
            docker network rm "$FUZZNET" 2>/dev/null || true
          }
          trap cleanup EXIT
          docker network create "$FUZZNET"
          docker run -d --name archlucid-fuzz-api --network "$FUZZNET" -p 8080:8080 \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ArchLucid__StorageProvider=InMemory \
            -e ArchLucidAuth__Mode=DevelopmentBypass \
            -e IntegrationEvents__TransactionalOutboxEnabled=false \
            -e Demo__SeedOnStartup=false \
            archlucid-api:fuzz-light
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health/live; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "API did not become healthy in time (last 200 lines of container logs):"
              docker logs archlucid-fuzz-api 2>&1 | tail -n 200 || true
              exit 1
            fi
            sleep 2
          done
          docker run --rm --network "$FUZZNET" \
            schemathesis/schemathesis:stable \
            run http://archlucid-fuzz-api:8080/openapi/v1.json \
            --url http://archlucid-fuzz-api:8080 \
            --checks=all \
            --phases=examples \
            --request-timeout 5 \
            --max-response-time 10

  ci-summary:
    name: CI summary
    if: always()
    needs:
      - gitleaks
      - docs-root-size
      - docs-navigator-links
      - docs-stale-code-refs-warn
      - two-layer-naming-lint
      - integrations-node-ado-pipeline-tasks
      - doc-markdown-links
      - terraform-validate-private
      - terraform-validate-public-stacks
      - openapi-contract-snapshot
      - terraform-advisory-snippets-validate
      - ci-agent-prompt-injection-regression
      - ci-agent-offline-regression
      - demo-workspaces-fixture-parity
      - dotnet-fast-core
      - saas-terraform-roots-validate
      - sql-dbup-empty-catalog
      - api-greenfield-boot
      - dotnet-full-regression-core-complete
      - dotnet-full-regression-slow-api
      - dotnet-full-regression-slow-domain
      - dotnet-coverage-merge
      - chaos-tests
      - docker-build-smoke
      - ui-unit
      - ui-demo-preflight
      - ui-axe-components
      - ui-static-quality
      - ui-playwright-mock-smoke
      - ui-playwright-accessibility
      - ui-e2e-live
      - ui-e2e-live-apikey
      - ui-e2e-live-jwt
      - k6-smoke-api
      - k6-ci-smoke
      - dotnet-benchmark-regression
      - dotnet-azure-openai-live-post-regression
      - security-zap-api-baseline
      - api-schemathesis-light
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write workflow summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 << 'PY'
          import json
          import os
          needs = json.loads(os.environ["NEEDS_JSON"])
          conclusions = [v.get("result") for v in needs.values()]
          overall = "failure" if any(c == "failure" for c in conclusions) else \
                    "cancelled" if any(c == "cancelled" for c in conclusions) else \
                    "success" if all(c in ("success", "skipped") for c in conclusions) else "unknown"
          lines = [
              "## CI workflow summary",
              "",
              f"- **Overall (heuristic):** `{overall}`",
              "",
              "| Job | Result |",
              "| --- | --- |",
          ]
          for name in sorted(needs.keys()):
              lines.append(f"| {name} | {needs[name].get('result', '')} |")
          path = os.environ.get("GITHUB_STEP_SUMMARY")
          if path:
              with open(path, "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
          print("Overall:", overall)
          PY
