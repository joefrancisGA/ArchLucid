    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Install, lint, typecheck, build
        working-directory: archlucid-ui
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
