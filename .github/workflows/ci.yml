# Tiered CI (see docs/TEST_EXECUTION_MODEL.md):
#   Tier 0 — Secret scan (gitleaks; full clone)
#   Tier 0.x — OpenAPI v1 snapshot (build ArchLucid.Api.Tests + OpenApiContractSnapshotTests only).
#               Runs parallel with Terraform validate; dotnet-fast-core needs it → drift fails before corset guards.
#   Tier 1 — .NET fast core (fail-fast, no SQL) + CycloneDX SBOM artifact
#   Tier 1a — Named agent gates (branch protection): prompt-injection regression (Python + dotnet test);
#             offline agent regression (eval corpus + prompt JSON baseline); parallel after gitleaks
#   Tier 1.5 — DbUp migrations on empty catalog (Docker SQL) + greenfield SQL boot (API process + /health/ready); after Tier 1
#   Tier 2 — .NET full regression + SQL (parallel shards: Category!=Slow split Api.Tests (Integration vs non-Integration)
#           vs other test assemblies; Category=Slow split: Api.Tests vs AgentRuntime+Application+Decisioning; merged in `dotnet-coverage-merge`)
#   Tier 2b — Simmy chaos (after Tier 2; no SQL)
#   Tier 2d — Optional live Azure OpenAI (`RealAzureOpenAIEndToEndTests`) after OpenAPI snapshot + merged coverage gates + chaos;
#           — opt-in repo var `ARCHLUCID_CI_REAL_AOAI_ENABLED`; secrets `ARCHLUCID_CI_REAL_AOAI_ENDPOINT` / `ARCHLUCID_CI_REAL_AOAI_KEY` (same-repo PRs/push only).
#   Tier 2c — k6: operator-path API smoke after full regression (native k6; merge-blocking) + k6 CI smoke read+write (after Tier 1)
#   Tier 3a — Operator UI unit (Vitest / jsdom) + CycloneDX npm SBOM artifact; lint/typecheck/build (`ui-static-quality`); mock journeys (`ui-playwright-mock-smoke`);
#             axe WCAG 2.1 A/AA (`ui-playwright-accessibility`, mock-backed); optional full-page screenshot goldens via `npm run test:e2e:mock:visual` locally when updating baselines
#   Tier 3b — Operator UI e2e (Playwright live API + SQL; extended live-a11y route matrix via workflow_dispatch input / nightly)
#   Terraform advisory: mock manifest → emit comment-only snippets → terraform fmt -check / validate (`terraform-advisory-snippets-validate`)
#
# Re-run failed jobs from the Actions tab. Local equivalents: test-fast-core.*, test-full.*,
# archlucid-ui: npm test / npm run test:axe-components / Playwright (default live config; mock via playwright.mock.config.ts).
#
# .NET coverage: each test job writes a collapsible report to the job summary; download
# coverage-report-*-html artifacts for browsable index.html (ReportGenerator).
# Also: Dependabot (.github/dependabot.yml), CodeQL (.github/workflows/codeql.yml),
# Docker build smoke + Trivy image scan, Terraform validate + Trivy config (Terraform misconfiguration;
# same audit class as tfsec/checkov for public exposure / encryption / IAM footguns),
# NuGet cache on setup-dotnet, PR sticky coverage comment.
name: CI

# PR (main/master): Tier 0–1 pre-corset jobs + **trimmed** `dotnet-fast-core` (no SBOM, no coverlet/ReportGenerator,
# no finding-engine template test). All jobs after `dotnet-fast-core` run only on **workflow_dispatch** (full CI).
# Full CI: Actions → CI → Run workflow (pick branch/ref).
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_extended_live_a11y_matrix:
        description: "Run full live axe route matrix in ui-e2e-live (same as nightly; overrides PR default subset)"
        required: false
        default: false
        type: boolean

# Opt into Node 24 for JavaScript actions (GitHub default June 2026). Docker Buildx / build-push use
# setup-buildx-action@v4 + build-push-action@v7 (Node 24 runtimes; runner ≥ v2.327.1). Prefer
# `actions/setup-python@v6` here (matches Node 24; v5 targeted Node 20). Other third-party actions may still
# declare node20 until republished. Tier-0 secret scan uses gacts/gitleaks (node24-native) instead of
# gitleaks/gitleaks-action to avoid Node 20 deprecation noise.
# Trivy: pin `aquasecurity/trivy-action` to a **commit** (org allow-lists). Do **not** rely on nested
# `setup-trivy` — it sparse-checkouts `aquasecurity/trivy` for `contrib/install.sh`, which triggers partial-clone
# promisor fetches that fail on GitHub-hosted runners (`fatal: could not fetch … from promisor remote`).
# Install the CLI via `.github/actions/install-trivy` (release tarball) and pass `skip-setup-trivy: true`.
# Pin **v0.69.3** until Aqua restores reliable release/install paths (discussions #10265+). Set `cache: false`
# where we skip nested cache noise.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: "Security: gitleaks (secret scan)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pin CLI version (not only "latest") so release resolution + cache keys are stable and
      # transient "Error: other side closed" (HTTP/2 / connection reset while fetching assets) is less likely.
      - uses: gacts/gitleaks@v1.3.2
        with:
          version: "8.30.1"
          config-path: .gitleaks.toml

  docs-root-size:
    name: "Docs: root markdown count guard (≤32)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert docs root .md count
        run: python scripts/ci/assert_docs_root_size.py

  # Full history: last-touch dates for docs/*.md (advisory; merge-never).
  docs-stale-code-refs-warn:
    name: "Docs: stale code-path references (advisory)"
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stale docs with code references (90d+, warn-only)
        continue-on-error: true
        run: python scripts/ci/detect_stale_docs.py

  docs-navigator-links:
    name: "Docs: NAVIGATOR + connector matrix link targets exist"
    needs:
      - gitleaks
      - docs-root-size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert docs/START_HERE.md links resolve
        run: python scripts/ci/assert_start_here_links_valid.py

      - name: Assert docs/library root markdown declares audience (TB-013 Phase 2)
        run: python scripts/ci/assert_library_root_audience.py

      - name: Assert CONNECTOR_READINESS_MATRIX.md links and code paths resolve
        run: python scripts/ci/assert_connector_readiness_matrix_paths.py

      - name: Connector readiness matrix path guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_connector_readiness_matrix_paths.py"

  two-layer-naming-lint:
    name: "Docs: Pilot/Operate buyer naming lint"
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert no legacy buyer layer labels under docs/
        run: python scripts/ci/assert_two_layer_naming.py

      - name: two-layer naming guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_two_layer_naming.py"

  integrations-node-ado-pipeline-tasks:
    name: "Integrations: Azure Pipelines YAML scripts (node --test)"
    needs: gitleaks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: node --test (ADO pipeline task parity)
        run: |
          node --test integrations/azure-devops-task-manifest-delta-pr-comment/post-pr-thread.test.mjs
          node --test integrations/azure-devops-task-manifest-delta/job-summary.test.mjs

  doc-markdown-links:
    name: "Docs: markdown link integrity"
    needs:
      - gitleaks
      - docs-root-size
      - docs-navigator-links
      - two-layer-naming-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Terraform root ordering sync
        run: python scripts/ci/assert_terraform_root_ordering_sync.py

      - name: Terraform plan data-region guard (unit tests)
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_terraform_plan_data_regions.py"

      - name: Terraform SQL backup redundancy guard (unit tests)
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_sql_backup_regions.py"

      - name: SQL backup verification artifact writer (unit tests)
        run: python -m unittest discover -s scripts/ci/tests -p "test_write_sql_backup_verification_artifact.py"

      - name: SQL backup verification artifact matches sample fixture
        run: |
          python scripts/ci/write_sql_backup_verification_artifact.py \
            scripts/ci/fixtures/tfplan-sql-backup-verified.sample.json \
            /tmp/sql-backup-region-verification.json \
            --generated-at-utc 2026-05-18T00:00:00Z
          diff -u archlucid-ui/public/sql-backup-region-verification.json /tmp/sql-backup-region-verification.json \
            || (echo "Regenerate: python scripts/ci/write_sql_backup_verification_artifact.py scripts/ci/fixtures/tfplan-sql-backup-verified.sample.json archlucid-ui/public/sql-backup-region-verification.json --generated-at-utc 2026-05-18T00:00:00Z" && exit 1)

      - name: Prometheus SLO Terraform LLM budget warn rule (unit tests)
        run: python -m unittest discover -s scripts/ci/tests -p "test_prometheus_slo_llm_budget_warn_alert_rule_tf.py"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Install archlucid-ui npm deps (marketing accessibility sync guard)
        run: npm ci
        working-directory: archlucid-ui

      - name: Check relative markdown links
        # Advisory: keep running the check (logs + warn badge on failure) without failing the workflow.
        continue-on-error: true
        run: python scripts/ci/check_md_links.py

      - name: Contributor one-page doc line budget (≤80 lines)
        run: python scripts/ci/assert_contributor_on_one_page_size.py

      - name: Contributor one-page line budget unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_contributor_on_one_page_size.py"

      - name: Pen test remediation tracker hygiene
        run: python scripts/ci/assert_pen_test_remediation_no_stale.py

      - name: Audit coverage matrix vs AuditEventTypes (names + count marker)
        run: python scripts/ci/assert_audit_const_count.py

      - name: Audit matrix guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_audit_const_count.py"

      - name: Audit coverage matrix vs OpenAPI POST/PUT/DELETE paths
        run: python scripts/ci/assert_openapi_mutations_in_audit_matrix.py

      - name: Audit coverage matrix vs controller HttpPost/Put/Delete routes
        run: python scripts/ci/check_audit_matrix.py

      - name: OpenAPI audit matrix guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_openapi_mutations_in_audit_matrix.py"

      - name: Route tier policy nav registry vs controllers + matrix
        run: python scripts/ci/assert_route_tier_policy_nav.py

      - name: Route tier policy nav guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_route_tier_policy_nav.py"

      - name: Integration recipe CloudEvent types vs catalog
        run: python scripts/ci/check_integration_recipes_link_alignment.py

      - name: Integration recipe alignment guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_check_integration_recipes_link_alignment.py"

      - name: READ_THIS_FIRST.md — relative targets exist
        run: python scripts/ci/check_read_this_first_links.py

      - name: Check trust center doc links
        run: python scripts/ci/check_trust_center_links.py

      - name: Trust center posture freshness (warn STALE_ROW to stderr)
        run: python scripts/ci/check_trust_center_posture_freshness.py

      - name: Procurement PACK_INDEX table validation
        run: python scripts/ci/check_procurement_pack_index.py

      - name: Procurement claim coherence guard
        run: python scripts/ci/check_procurement_claim_coherence.py

      - name: High-risk documentation coherence guard (trust / MCP / pricing policy)
        run: python scripts/ci/assert_high_risk_doc_coherence.py

      - name: Public pricing placeholder hard guard (sales-led posture)
        run: python scripts/ci/assert_public_pricing_placeholder_guard.py

      - name: Doc guard unit tests (connector + coherence + pricing + data-consistency report + observability export report + real-LLM gate script)
        run: |
          python -m unittest discover -s scripts/ci/tests -p "test_assert_v1_connector_catalog_alignment.py"
          python -m unittest discover -s scripts/ci/tests -p "test_assert_high_risk_doc_coherence.py"
          python -m unittest discover -s scripts/ci/tests -p "test_assert_public_pricing_placeholder_guard.py"
          python -m unittest discover -s scripts/ci/tests -p "test_pricing_json_checkout_guard.py"
          python -m unittest discover -s scripts/ci/tests -p "test_data_consistency_mode_readiness_report.py"
          python -m unittest discover -s scripts/ci/tests -p "test_report_observability_export_readiness.py"
          python -m unittest discover -s scripts/ci/tests -p "test_invoke_real_llm_evidence_gate.py"
          python -m unittest discover -s scripts/ci/tests -p "test_production_profile_preflight_md.py"

      - name: Procurement doc freshness guard (warn-only)
        continue-on-error: true
        run: python scripts/ci/check_procurement_doc_freshness.py

      - name: ITSM bridge starter kit — Node contract tests (no npm install)
        run: node --test templates/integrations/bridge-recipe-contract-tests/mapping-contract.test.mjs

      - name: Marketing accessibility page vs ACCESSIBILITY.md (TS parser parity)
        run: python scripts/ci/assert_marketing_accessibility_in_sync.py

      - name: Buyer first-30-minutes path — vertical picker + q35 prose guard
        run: python scripts/ci/assert_buyer_first_30_minutes_in_sync.py

      - name: Buyer first-30-minutes guard self-test
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_buyer_first_30_minutes_in_sync.py"

      - name: Buyer-facing doc claim drift (heuristic, warn-only)
        continue-on-error: true
        shell: pwsh
        run: ./scripts/Scan-BuyerDocClaims.ps1

      - name: BillingProductionSafetyRules — sk_live_ + Marketplace landing + GA offer-id checks shipped
        run: python scripts/ci/assert_billing_safety_rules_shipped.py

      - name: BillingProductionSafetyRules guard self-test
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_billing_safety_rules_shipped.py"

      - name: Golden cohort kill-switch shipped (Q15-conditional rule — warn 80% / kill 95%)
        run: python scripts/ci/assert_golden_cohort_kill_switch_present.py

      - name: Golden cohort nightly job naming guard (preflight vs live)
        run: python scripts/ci/assert_golden_cohort_job_names.py

      - name: Golden cohort kill-switch guard self-test
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_golden_cohort_kill_switch_present.py"

      - name: Golden cohort budget-probe threshold-parsing unit tests (Improvement 11)
        run: |
          cd scripts/ci
          python -m unittest test_golden_cohort_budget_probe

      - name: "Brand-category seam — rebrand guard (FAIL if legacy phrases hardcoded)"
        run: python scripts/ci/assert_brand_category_seam.py --fail

      - name: Brand-category seam guard self-test
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_brand_category_seam.py"

      - name: ADR 0030 authority projection known-empty JSON guard
        run: python scripts/ci/assert_authority_projection_known_empty.py

      - name: ADR 0030 authority projection known-empty guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_authority_projection_known_empty.py"

      - name: Golden cohort baseline locked — no placeholder SHAs
        env:
          ARCHLUCID_GOLDEN_COHORT_BASELINE_LOCKED: "true"
        run: python scripts/ci/assert_golden_cohort_baseline_locked.py

      - name: Golden cohort baseline locked guard unit tests
        run: |
          cd scripts/ci
          python -m unittest test_assert_golden_cohort_baseline_locked

      - name: Procurement pack canonical inputs (validator)
        run: python scripts/ci/assert_procurement_pack_buildable.py

      - name: Procurement pack validation unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_procurement_pack_validation.py"

      - name: Procurement pack index guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_check_procurement_pack_index.py"

      - name: "Advisory — game-day closing report vs calendar (strict after second logged run)"
        continue-on-error: true
        # Today: warn-only. After two completed quarterly close-outs, remove continue-on-error
        # so a missed past calendar date fails merge (see docs/quality/game-day-log/README.md).
        run: python scripts/ci/assert_game_day_log_recent.py

      - name: Game-day log guard unit tests
        run: |
          cd scripts/ci
          python -m unittest test_assert_game_day_log_recent

      - name: Synthetic aggregate ROI bulletin sample guards
        run: python scripts/ci/check_synthetic_roi_bulletin_sample.py

      - name: Doc scope header
        # Merge-blocking: every active ``docs/**/*.md`` (except ``docs/archive/``) must open with
        # ``> **Scope:**`` on the first non-empty line. README.md uses ``<!-- **Scope:** ... -->``.
        # See ``scripts/ci/check_doc_scope_header.py`` and ``scripts/ci/backfill_doc_scope_headers.py``.
        run: python scripts/ci/check_doc_scope_header.py

      - name: Doc scope header check unit tests
        run: |
          cd scripts/ci
          python -m unittest test_check_doc_scope_header test_backfill_doc_scope_headers

      - name: Architecture poster line budget (Prompt 12)
        run: python scripts/ci/check_doc_size_budget.py --max-lines 500 docs/ARCHITECTURE_ON_ONE_PAGE.md

      - name: Five-document onboarding spine line budget (600 lines each)
        run: python scripts/ci/check_onboarding_spine_line_budget.py --max-lines 600

      - name: Doc size budget guard unit tests
        run: |
          cd scripts/ci
          python -m unittest test_check_doc_size_budget

      - name: Coordinator reference ceiling (ADR 0021 strangler drift)
        run: |
          python -m unittest discover -s scripts/ci/tests -p "test_assert_coordinator_reference_ceiling.py"
          python scripts/ci/assert_coordinator_reference_ceiling.py

      - name: Procurement pack ZIP (deterministic docs bundle)
        run: bash scripts/build_procurement_pack.sh

      - name: Mermaid syntax (mermaid-cli when available)
        run: python scripts/ci/check_mermaid_syntax.py docs/ARCHITECTURE_ON_ONE_PAGE.md

      - name: Runbook freshness (informational)
        run: python scripts/ci/check_doc_freshness.py

      - name: Tenant inventory tables vs master DDL
        run: python scripts/ci/assert_tenant_inventory_tables_in_archlucid_sql.py

      - name: Pricing single-source-of-truth guard
        run: python scripts/ci/check_pricing_single_source.py

      - name: Regenerate public pricing.json from PRICING_PHILOSOPHY locked block
        run: python scripts/ci/generate_pricing_json.py

      - name: Pricing JSON must match generator (no drift)
        run: git diff --exit-code -- archlucid-ui/public/pricing.json

      - name: Worked-example ROI PDF freshness (warn-only; set WORKED_EXAMPLE_ROI_FRESHNESS_FAIL=1 to enforce)
        run: python scripts/ci/check_worked_example_roi_freshness.py

      - name: README opener link density (max 12 links above first <details>)
        run: python scripts/ci/check_readme_density.py

      - name: README opener link density guard unit tests
        run: |
          cd scripts/ci
          python -m unittest test_check_readme_density -q

      - name: Marketplace pricing tier alignment vs PRICING_PHILOSOPHY
        run: python scripts/ci/assert_marketplace_pricing_alignment.py

      - name: "/why comparison rows in sync (TS inline section vs C# PDF builder)"
        # PENDING_QUESTIONS.md item 31, resolved 2026-04-21 (ship both PDF and inline section,
        # with a CI sync check). Fails if archlucid-ui/src/marketing/why-archlucid-comparison.ts
        # and ArchLucid.Application/Pilots/WhyArchLucidPackBuilder.cs diverge on any of the
        # five differentiation-row fields (claim, evidence, baseline, citation, narrative).
        run: python scripts/ci/check_why_archlucid_comparison_sync.py

      - name: "/why front-door hard table — markdown vs why-comparison.ts row order"
        run: python scripts/ci/check_why_table_alignment.py

      - name: "/why differentiation rows — non-empty evidence fields"
        run: python scripts/ci/assert_why_rows_have_evidence.py

      - name: Mutating controller actions — audit LogAsync guard
        run: python scripts/ci/assert_controller_mutations_have_audit.py

      - name: Controller audit guard unit tests
        run: |
          cd scripts/ci
          python -m unittest test_assert_controller_mutations_have_audit -q

      - name: Layered audit wiring — echo marker CI tripwire
        run: python scripts/ci/assert_layered_audit_wiring_echo.py

      - name: Layered audit wiring echo — unit tests
        run: |
          cd scripts/ci
          python -m unittest test_assert_layered_audit_wiring_echo -q

      - name: "PGP public key — validate armored key when present; warn when pending"
        continue-on-error: true
        # Missing key: script exits 0 (stderr notice). Invalid committed key: exits 1 — then fix or set merge-blocking.
        run: python scripts/ci/assert_pgp_key_present.py

      - name: PGP key presence + golden cohort budget probe unit tests
        run: |
          python -m pip install --upgrade pip
          pip install requests
          cd scripts/ci
          python -m unittest test_assert_pgp_key_present
          python -m unittest test_golden_cohort_budget_probe
          python -m unittest test_golden_cohort_usage_ledger

      - name: Guard — concept vocabulary (docs/library/CONCEPT_VOCABULARY.md § 1)
        run: python scripts/ci/check_concept_vocabulary.py

      - name: Guard — concept vocabulary check unit tests
        run: |
          cd scripts/ci
          python -m unittest test_check_concept_vocabulary

      - name: Guard — reference-customer status (non-blocking until first Published row)
        # Surfaces as warn-only while no row has Status: Published. The auto-flip
        # step below makes regression (removing or downgrading a Published row)
        # merge-blocking the moment the first row reaches Published — no manual
        # CI edit required at re-rate time. See docs/go-to-market/PRICING_PHILOSOPHY.md § 5.4.
        id: refcust-warn
        continue-on-error: true
        run: python scripts/ci/check_reference_customer_status.py docs/go-to-market/reference-customers/README.md

      - name: "Guard — reference-customer status (auto-flip: strict once any Published row exists)"
        # Auto-flip semantics:
        #   - refcust-warn outcome == 'success'  =>  at least one Status: Published row exists today.
        #   - From that day on, this step re-runs the same check WITHOUT continue-on-error,
        #     so any regression (downgrade or removal of the only Published row) fails CI.
        #   - While zero Published rows exist, this step is skipped and the warn step is the only signal.
        # See docs/archive/quality/QUALITY_IMPROVEMENT_DECISIONS_2026_04_20.md (Improvement 1, ref-customer guard).
        if: steps.refcust-warn.outcome == 'success'
        run: python scripts/ci/check_reference_customer_status.py docs/go-to-market/reference-customers/README.md

      - name: Guard — reference-customer status check unit tests
        run: |
          cd scripts/ci
          python -m unittest test_check_reference_customer_status

      - name: AuditEvents read path — no NOLOCK hint
        run: python scripts/ci/assert_no_audit_events_nolock.py

  terraform-validate-private:
    name: "Terraform: validate private stack (no backend)"
    needs:
      - gitleaks
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform init (no backend)
        working-directory: infra/terraform-private
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/terraform-private
        run: terraform validate

      - name: terraform fmt (check only)
        working-directory: infra/terraform-private
        run: terraform fmt -check -recursive

      - name: Install Trivy CLI
        uses: ./.github/actions/install-trivy
        with:
          version: v0.69.3

      - name: Trivy IaC (Terraform misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: infra/terraform-private
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: false

  terraform-validate-public-stacks:
    name: "Terraform: validate main / edge / entra (no backend)"
    needs:
      - gitleaks
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        directory: [infra/terraform, infra/terraform-edge, infra/terraform-entra, infra/terraform-container-apps, infra/terraform-storage, infra/terraform-monitoring, infra/terraform-sql-failover, infra/terraform-openai, infra/terraform-keyvault, infra/terraform-orchestrator, infra/terraform-logicapps, infra/terraform-servicebus, infra/terraform-pilot]
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform init (no backend)
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

      - name: terraform fmt (check only)
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: Install Trivy CLI
        uses: ./.github/actions/install-trivy
        with:
          version: v0.69.3

      - name: Trivy IaC (Terraform misconfigurations)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: ${{ matrix.directory }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: false

  terraform-advisory-snippets-validate:
    name: "Terraform: advisory snippets from mock manifest (fmt + validate)"
    needs:
      - gitleaks
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Advisory snippets guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_terraform_advisory_snippets_validate.py"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Emit advisory snippets + terraform fmt/validate
        run: |
          set -euo pipefail
          python3 scripts/ci/terraform_advisory_snippets_validate.py

  openapi-contract-snapshot:
    name: ".NET: OpenAPI v1 contract snapshot (fail-fast)"
    needs:
      - gitleaks
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Build + OpenApiContractSnapshotTests
        run: bash scripts/ci/check_openapi_contract_snapshot.sh

  # Exact `name:` strings below are listed in `.github/BRANCH_PROTECTION.md` and `.github/pull_request_template.md`
  # for org admins enabling required status checks (owner decision).
  ci-agent-prompt-injection-regression:
    name: "CI: prompt-injection regression (strict + block layer)"
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore + build (AgentRuntime.Tests for executable regression)
        run: |
          set -euo pipefail
          dotnet restore ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj
          dotnet build ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj --no-restore -c Release

      - name: Prompt-injection datasets (shape + executable regression)
        run: python3 scripts/ci/eval_agent_quality.py --prompt-injection-only --strict --enforce-prompt-injection-block-layer

  ci-agent-offline-regression:
    name: "CI: agent offline regression (eval corpus + prompt JSON baseline)"
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Agent eval corpus (offline recall + simulator quality evidence + baseline soak)
        id: eval_corpus
        continue-on-error: true
        run: |
          set -euo pipefail
          REP="${{ runner.temp }}/eval-corpus-report.md"
          python3 scripts/ci/eval_agent_corpus.py --markdown-report "$REP" --baseline
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$REP" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload agent eval scorecard
        if: always() && steps.eval_corpus.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-scorecard
          path: ${{ runner.temp }}/eval-corpus-report.md
          if-no-files-found: ignore

      - name: Agent prompt regression baseline (JSON shape)
        run: python3 scripts/ci/assert_prompt_regression.py

  demo-workspaces-fixture-parity:
    name: "Go-to-market: demo workspace pins (manifest vs docs + seeds)"
    needs:
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Validate DEMO_WORKSPACES.md vs pinned manifest
        shell: pwsh
        run: ./scripts/demo-workspaces/Validate-DemoWorkspacesDoc.ps1 -RepoRoot "${{ github.workspace }}"

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore Application.Tests
        run: dotnet restore ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj

      - name: Build Application.Tests (Release)
        run: dotnet build ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      - name: DemoWorkspaceFixtureManifestParityTests
        run: dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~DemoWorkspaceFixtureManifestParityTests"

  azure-extractor-pester:
    name: "Azure extractor: Get-ArchLucidAzurePackage Pester (mock ARM)"
    needs:
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0 -MaximumVersion 5.99.99

      - name: Get-ArchLucidAzurePackage.Tests.ps1
        shell: pwsh
        run: Invoke-Pester -Strict -EnableExit -Path 'scripts/azure/tests/Get-ArchLucidAzurePackage.Tests.ps1'

  dotnet-fast-core:
    name: ".NET: fast core (corset)"
    needs:
      - gitleaks
      - doc-markdown-links
      - demo-workspaces-fixture-parity
      - openapi-contract-snapshot
      - terraform-advisory-snippets-validate
      - terraform-validate-private
      - terraform-validate-public-stacks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch default branch for diff guards (manual CI)
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin "${{ github.event.repository.default_branch }}" --no-tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore ArchLucid.sln

      - name: Vulnerable package audit (block High/Critical only)
        run: python3 scripts/ci/assert_nuget_no_high_critical_vulnerabilities.py

      - name: NuGet vulnerability gate unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_nuget_no_high_critical_vulnerabilities.py"

      - name: Build (Release)
        run: dotnet build ArchLucid.sln --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      - name: CLI — config lint (auth traps only; avoids production-like overlays)
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet run --project ArchLucid.Cli/ArchLucid.Cli.csproj --no-build -c Release -- config lint

      - name: Guard — audit coverage matrix vs AuditEventTypes (names + marker)
        run: python scripts/ci/assert_audit_const_count.py

      - name: Guard — audit matrix vs OpenAPI POST/PUT/DELETE paths
        run: python scripts/ci/assert_openapi_mutations_in_audit_matrix.py

      - name: Guard — audit matrix vs controller HttpPost/Put/Delete routes
        run: python scripts/ci/check_audit_matrix.py

      - name: Guard — route tier policy nav registry vs controllers + matrix
        run: python scripts/ci/assert_route_tier_policy_nav.py

      - name: coordinator parity probe (Python unit tests)
        run: python3 scripts/ci/test_coordinator_parity_probe.py

      - name: Guard — migration rollback scripts (latest ten)
        run: python3 scripts/ci/assert_rollback_scripts_exist.py

      - name: Guard — forward DbUp migrations must touch ArchLucid.sql (PR)
        if: github.event_name == 'pull_request'
        env:
          ARCHLUCID_GIT_REPO_ROOT: ${{ github.workspace }}
          ARCHLUCID_GIT_DIFF_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/assert_forward_migration_touches_archlucid_sql.py

      - name: Guard — forward DbUp migrations must touch ArchLucid.sql (push)
        if: github.event_name == 'push'
        env:
          ARCHLUCID_GIT_REPO_ROOT: ${{ github.workspace }}
          ARCHLUCID_GIT_DIFF_RANGE: ${{ github.event.before }}...${{ github.event.after }}
        run: python3 scripts/ci/assert_forward_migration_touches_archlucid_sql.py

      - name: Guard — forward DbUp migrations must touch ArchLucid.sql (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          ARCHLUCID_GIT_REPO_ROOT: ${{ github.workspace }}
          ARCHLUCID_GIT_DIFF_RANGE: origin/${{ github.event.repository.default_branch }}...HEAD
        run: python3 scripts/ci/assert_forward_migration_touches_archlucid_sql.py

      - name: forward migration / ArchLucid.sql co-touch guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_forward_migration_touches_archlucid_sql.py"

      - name: Guard — RLS residual-risk table classifications (PR)
        if: github.event_name == 'pull_request'
        env:
          ARCHLUCID_GIT_REPO_ROOT: ${{ github.workspace }}
          ARCHLUCID_GIT_DIFF_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/assert_rls_residual_risk_classifications.py

      - name: Guard — RLS residual-risk table classifications (push)
        if: github.event_name == 'push'
        env:
          ARCHLUCID_GIT_REPO_ROOT: ${{ github.workspace }}
          ARCHLUCID_GIT_DIFF_RANGE: ${{ github.event.before }}...${{ github.event.after }}
        run: python3 scripts/ci/assert_rls_residual_risk_classifications.py

      - name: Guard — RLS residual-risk table classifications (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          ARCHLUCID_GIT_REPO_ROOT: ${{ github.workspace }}
          ARCHLUCID_GIT_DIFF_RANGE: origin/${{ github.event.repository.default_branch }}...HEAD
        run: python3 scripts/ci/assert_rls_residual_risk_classifications.py

      - name: RLS residual-risk classification guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_rls_residual_risk_classifications.py"

      - name: Guard — migration numbering (warn-only)
        # Non-blocking: surfaces duplicate ###_ prefixes (DbUp orders lexically; ties are silent).
        # Flip to blocking after the historical 035_/096_ duplicates are renumbered (gated on
        # confirming no production catalog has applied them — see
        # docs/archive/quality/QUALITY_IMPROVEMENT_DECISIONS_2026_04_20.md, question 5.1).
        continue-on-error: true
        run: python3 scripts/ci/check_migration_numbering.py

      - name: Guard — legacy configuration sunset date
        run: python3 scripts/ci/assert_legacy_config_sunset_not_passed.py

      - name: Guard — golden agent reference JSON fixtures
        run: python3 scripts/ci/assert_agent_reference_baselines.py

      - name: Guard — unexpected archiforge string literals in C# (case-insensitive)
        run: |
          set +e
          grep -rni "archiforge" --include="*.cs" --exclude-dir=obj --exclude-dir=bin --exclude-dir=.git . > "${RUNNER_TEMP}/archiforge-cs-hits.txt"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::ArchLucid rename guard: grep failed while scanning .cs files (rc=$rc)"
            exit 1
          fi
          if [ "$rc" -eq 1 ]; then
            echo "ArchLucid rename guard: no case-insensitive 'archiforge' matches in .cs files."
            exit 0
          fi
          echo "::error::ArchLucid rename guard: unexpected 'archiforge' references in .cs files:"
          cat "${RUNNER_TEMP}/archiforge-cs-hits.txt"
          exit 1

      - name: Guard — unexpected archiforge string literals in TS/TSX
        run: |
          set +e
          grep -rni "archiforge" --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git . \
            > "${RUNNER_TEMP}/archiforge-ts-hits.txt"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::ArchLucid rename guard: grep failed while scanning TS/TSX files (rc=$rc)"
            exit 1
          fi
          if [ "$rc" -eq 1 ]; then
            echo "ArchLucid rename guard: no 'archiforge' matches in TS/TSX files."
            exit 0
          fi
          echo "::error::ArchLucid rename guard: unexpected 'archiforge' references in TS/TSX files:"
          cat "${RUNNER_TEMP}/archiforge-ts-hits.txt"
          exit 1

      - name: Guard — archiforge in marketing UI and terraform-edge (narrow paths)
        run: |
          set +e
          grep -rni "archiforge" \
            --include="*.ts" --include="*.tsx" --include="*.tf" \
            'archlucid-ui/src/app/(marketing)' infra/terraform-edge \
            > "${RUNNER_TEMP}/archiforge-marketing-edge.txt"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::ArchLucid rename guard: grep failed while scanning marketing UI / terraform-edge (rc=$rc)"
            exit 1
          fi
          if [ "$rc" -eq 1 ]; then
            echo "ArchLucid rename guard: no 'archiforge' in archlucid-ui/src/app/(marketing) or infra/terraform-edge."
            exit 0
          fi
          echo "::error::ArchLucid rename guard: unexpected 'archiforge' in marketing UI or terraform-edge:"
          cat "${RUNNER_TEMP}/archiforge-marketing-edge.txt"
          exit 1

      - name: Guard — no direct IIntegrationEventPublisher.PublishAsync bypasses
        run: |
          set +e
          grep -rn "\.PublishAsync(" --include="*.cs" --exclude-dir=obj --exclude-dir=bin --exclude-dir=.git . > "${RUNNER_TEMP}/pub-hits.txt"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::grep failed while scanning for .PublishAsync( (rc=$rc)"
            exit 1
          fi
          if [ "$rc" -eq 1 ]; then
            echo "No .PublishAsync( matches in .cs files."
            exit 0
          fi
          HITS=$(grep -v "Tests/" "${RUNNER_TEMP}/pub-hits.txt" \
            | grep -v "IntegrationEventPublishing.cs" \
            | grep -v "IntegrationEventOutboxProcessor.cs" \
            | grep -v "interface IIntegrationEventPublisher" \
            | grep -v "/// " \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::Found direct IIntegrationEventPublisher.PublishAsync calls outside authorized locations:"
            echo "$HITS"
            echo ""
            echo "Use OutboxAwareIntegrationEventPublishing.TryPublishOrEnqueueAsync instead."
            exit 1
          fi

      - name: Generate .NET SBOM (CycloneDX)
        if: github.event_name != 'pull_request'
        run: |
          dotnet tool install CycloneDX --tool-path "${RUNNER_TEMP}/cdx" --verbosity quiet
          CDX="${RUNNER_TEMP}/cdx/dotnet-cyclonedx"
          test -x "$CDX" || CDX="${RUNNER_TEMP}/cdx/dotnet-CycloneDX"
          "$CDX" ArchLucid.Api/ArchLucid.Api.csproj -o sbom-dotnet.json

      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: sbom-dotnet
          path: sbom-dotnet.json

      - name: Context ingestion DI guards
        run: python scripts/assert_context_ingestion_di_guards.py

      - name: List endpoint pagination audit
        run: python scripts/ci/assert_list_endpoint_pagination.py

      - name: CI Python scripts (pytest)
        run: |
          python3 -m pip install --quiet pytest
          cd scripts/ci && python3 -m pytest tests/ -v

      - name: TB-003 named query performance allowlist (dry-run, non-blocking)
        run: python3 scripts/ci/assert_query_performance.py --dry-run
        continue-on-error: true

      - name: PMF validation tracker (Captured vs TBD discipline)
        run: python3 scripts/ci/assert_pmf_tracker_discipline.py

      - name: V1 traceability matrix (docs vs repo paths)
        run: python3 scripts/ci/assert_traceability_coverage.py

      - name: V1 RTM dotnet filter tokens resolve
        run: python3 scripts/ci/assert_rtm_test_filters_resolve.py

      - name: Agent eval dataset manifest (shape)
        run: python3 scripts/ci/eval_agent_quality.py --manifest-only --strict

      # Prompt-injection executable regression + eval corpus live in dedicated jobs (ci-agent-prompt-injection-regression,
      # ci-agent-offline-regression) so branch protection can require them by exact check name.

      # Includes OpenApiContractSnapshotTests (Suite=Core); same assertion already ran in job openapi-contract-snapshot for fail-fast ordering.
      # ArchLucid.Api.Client regenerates from that snapshot on build (NSwag); Generated/ is gitignored.
      # coverage.runsettings: Cobertura format + Tier 5 excludes (generated/OpenAPI/CLI client); matches local merged reports.
      # GoldenCorpusMaterializerTests is Category=GoldenCorpusRecord (local corpus refresh only; no LLM/SQL).
      - name: Test — fast core (with coverage)
        if: github.event_name != 'pull_request'
        run: dotnet test ArchLucid.sln --no-build -c Release --settings coverage.runsettings --filter "Suite=Core&Category!=Slow&Category!=Integration&Category!=GoldenCorpusRecord" --collect:"XPlat Code Coverage" --results-directory "${{ runner.temp }}/coverage-fast-core"

      - name: Test — fast core (PR trimmed — no coverage collection)
        if: github.event_name == 'pull_request'
        run: dotnet test ArchLucid.sln --no-build -c Release --filter "Suite=Core&Category!=Slow&Category!=Integration&Category!=GoldenCorpusRecord"

      - name: Merge coverage (HTML + GitHub job summary)
        if: success() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          dotnet tool restore
          OUT="${{ runner.temp }}/coverage-report-fast-core"
          COV_DIR="${{ runner.temp }}/coverage-fast-core"
          if [ ! -d "$COV_DIR" ]; then
            echo "::error::Coverage directory missing: $COV_DIR"
            exit 1
          fi
          # Do not rely on bash ** glob (globstar is off by default on Ubuntu); enumerate Cobertura files for ReportGenerator.
          mapfile -d '' -t cov_files < <(find "$COV_DIR" -type f -name 'coverage.cobertura.xml' -print0)
          if [ "${#cov_files[@]}" -eq 0 ]; then
            echo "::error::No coverage.cobertura.xml under $COV_DIR (coverlet did not emit Cobertura)."
            find "$COV_DIR" -type f -maxdepth 6 2>/dev/null | head -n 200 || true
            exit 1
          fi
          report_list=$(IFS=';'; printf '%s' "${cov_files[*]}")
          dotnet reportgenerator \
            "-reports:${report_list}" \
            "-targetdir:${OUT}" \
            "-reporttypes:Html;TextSummary;MarkdownSummaryGithub" \
            -verbosity:Info
          if [ ! -f "${OUT}/SummaryGithub.md" ]; then
            echo "::error::ReportGenerator did not write SummaryGithub.md under ${OUT}"
            ls -la "$OUT" || true
            exit 1
          fi
          cat "${OUT}/SummaryGithub.md" >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: coverage-fast-core
          path: ${{ runner.temp }}/coverage-fast-core/**/coverage.cobertura.xml
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: success() && github.event_name != 'pull_request'
        with:
          name: coverage-report-fast-core-html
          path: ${{ runner.temp }}/coverage-report-fast-core/**
          if-no-files-found: warn

      - name: Test — finding-engine template (not in main solution)
        if: github.event_name != 'pull_request'
        run: dotnet test templates/archlucid-finding-engine/ArchLucidFindingEngine.Tests/ArchLucidFindingEngine.Tests.csproj -c Release

  # All infra/terraform* + infra/modules: init (no backend) + validate; apply-saas.ps1 consistency. No Azure creds.
  # continue-on-error: remove after every root is known clean in CI (see docs/engineering/SAAS_INFRA_VALIDATION.md).
  saas-terraform-roots-validate:
    name: "SaaS: Terraform roots validate (script suite)"
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install PowerShell
        run: |
          set -euo pipefail
          PWSH_VER=7.4.6
          curl -sSL -o /tmp/pwsh.tgz "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VER}/powershell-${PWSH_VER}-linux-x64.tar.gz"
          sudo mkdir -p /opt/microsoft/powershell7
          sudo tar zxf /tmp/pwsh.tgz -C /opt/microsoft/powershell7
          sudo chmod a+x /opt/microsoft/powershell7/pwsh
          sudo ln -sf /opt/microsoft/powershell7/pwsh /usr/local/bin/pwsh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: assert_terraform_roots_valid (PowerShell + Terraform, no cloud auth)
        run: python3 scripts/ci/assert_terraform_roots_valid.py

  # Empty catalog only: invokes DatabaseMigrator.Run (embedded DbUp scripts) without starting ArchLucid.Api.
  sql-dbup-empty-catalog:
    name: ".NET: Tier 1.5 — DbUp migrations on empty catalog (Docker SQL)"
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build MigrateVerify (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Persistence.MigrateVerify/ArchLucid.Persistence.MigrateVerify.csproj --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      - name: Create empty SQL catalog for DbUp
        run: |
          set -e
          docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -Q "IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name = N'ArchLucidCiDbUp') CREATE DATABASE ArchLucidCiDbUp;"

      - name: Apply DbUp scripts (embedded)
        env:
          ARCHLUCID_CI_DBUP_CONNECTION_STRING: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidCiDbUp"
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project ArchLucid.Persistence.MigrateVerify/ArchLucid.Persistence.MigrateVerify.csproj

      - name: Assert dbo.SchemaVersions has rows after DbUp
        run: |
          set -e
          RAW=$(docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -d ArchLucidCiDbUp \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.SchemaVersions;" \
            -h -1 -W)
          COUNT=$(printf '%s\n' "$RAW" | grep -oE '[0-9]+' | head -1)
          echo "SchemaVersions row count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "::error::Expected dbo.SchemaVersions after Tier 1.5 DbUp step"
            printf '%s\n' "$RAW"
            exit 1
          fi

  # Empty catalog + API process: catches DbUp vs SqlSchemaBootstrapper ordering and greenfield migration gaps (see GreenfieldSqlBootIntegrationTests).
  api-greenfield-boot:
    name: ".NET: greenfield SQL boot (empty catalog)"
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build API (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Api/ArchLucid.Api.csproj --no-restore -c Release

      - name: Create empty SQL catalog for greenfield boot
        run: |
          set -e
          docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -Q "IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name = N'ArchLucidGreenfieldCi') CREATE DATABASE ArchLucidGreenfieldCi;"

      - name: Start ArchLucid.Api (background)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5128
          ConnectionStrings__ArchLucid: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidGreenfieldCi"
          ArchLucid__StorageProvider: Sql
          ArchLucidAuth__Mode: DevelopmentBypass
          Authentication__ApiKey__DevelopmentBypassAll: "true"
          AgentExecution__Mode: Simulator
          # Readiness includes data_consistency, which requires at least one reconciliation pass. Env wins over
          # appsettings when using an older Release output snapshot; single-process CI: skip SQL leader leases.
          DataConsistency__InitialDelaySeconds: "0"
          HostLeaderElection__Enabled: "false"
        run: |
          set -e
          nohup dotnet run --no-build -c Release --project ArchLucid.Api/ArchLucid.Api.csproj > "${RUNNER_TEMP}/greenfield-boot.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/greenfield-boot.pid"
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:5128/health/ready; then
              echo "API ready."
              exit 0
            fi
            if [ "$i" -eq 180 ]; then
              echo "::error::API did not reach /health/ready in time"
              tail -n 200 "${RUNNER_TEMP}/greenfield-boot.log" || true
              exit 1
            fi
            sleep 1
          done

      - name: Assert DbUp journal populated (SchemaVersions)
        run: |
          set -e
          RAW=$(docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -d ArchLucidGreenfieldCi \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.SchemaVersions;" \
            -h -1 -W)
          COUNT=$(printf '%s\n' "$RAW" | grep -oE '[0-9]+' | head -1)
          echo "SchemaVersions row count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "::error::Expected at least one row in dbo.SchemaVersions after greenfield boot"
            printf '%s\n' "$RAW"
            exit 1
          fi

      - name: Upload greenfield boot log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: greenfield-boot-log
          path: ${{ runner.temp }}/greenfield-boot.log
          if-no-files-found: warn

  # Non-slow full regression: Api.Tests further split by Category (Integration vs non-Integration) so neither job
  # hogs the GitHub timeout; together they match the former single --filter "Category!=Slow" slice. Merged in dotnet-coverage-merge.
  # Api integration is single-threaded (xunit.runner.json) + cold SQL retries — allow headroom above prior 210m cap when org job limit permits.
  dotnet-full-regression-core-api-integration:
    name: ".NET: full regression — Api.Tests integration (SQL, Category!=Slow&Category=Integration)"
