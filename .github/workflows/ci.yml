      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore ArchLucid.sln

      - name: Build (Release)
        run: dotnet build ArchLucid.sln --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      # Resolves test projects from ArchLucid.sln (excluding Api.Tests → dotnet-full-regression-core-api-* shards).
      - name: Test — non-Api test assemblies (exclude Category=Slow)
        env:
          ARCHLUCID_SQL_TEST: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests"
        run: |
          set -euo pipefail
          mapfile -t test_projects < <(dotnet sln ArchLucid.sln list | grep '\.Tests\.csproj$' | grep -v 'Api\.Tests' || true)
          if [ "${#test_projects[@]}" -lt 1 ]; then
            echo "::error::No non-Api *.Tests.csproj entries from dotnet sln list (expected at least one)."
            exit 1
          fi

          # SDK 10+ MSBuild rejects multiple projects in one dotnet test invocation (MSB1008).
          for proj in "${test_projects[@]}"; do
            dotnet test "$proj" \
              --no-build -c Release --settings coverage.runsettings \
              --filter "Category!=Slow" \
              --collect:"XPlat Code Coverage" \
              --results-directory "${{ runner.temp }}/coverage-full-core-libs" \
