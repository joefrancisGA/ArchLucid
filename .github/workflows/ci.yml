          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore ArchLucid.sln

      - name: Build (Release)
        run: dotnet build ArchLucid.sln --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      - name: Test — ArchLucid.Api.Tests (Category=Slow only)
        env:
          ARCHLUCID_SQL_TEST: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests"
        # Blame must exceed ArchitectureRequestConcurrencyTestSupport.ArchitectureRequestBurstHttpTimeout (~65m factory HttpClient)
        # plus coverage collector / host teardown slack; 45m falsely kills healthy runs under cold SQL + long simulator pipelines.
        # --diag: VSTest/platform trace when the host stalls after tests (Coverlet teardown vs SQL dispose); blame "current test" is often the last finished test.
        run: >
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj --no-build -c Release --settings coverage.runsettings
          --filter "Category=Slow"
          --collect:"XPlat Code Coverage"
          --results-directory "${{ runner.temp }}/coverage-full-slow-api"
          --logger "trx;LogFilePrefix=full-slow-api-"
          --diag "${{ runner.temp }}/vstest-slow-api.diag.log"
