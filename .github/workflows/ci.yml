# Tiered CI (see docs/TEST_EXECUTION_MODEL.md):
#   Tier 0 â€” Secret scan (gitleaks; full clone)
#   Tier 0.x â€” OpenAPI v1 snapshot (build ArchLucid.Api.Tests + OpenApiContractSnapshotTests only).
#               Starts after gitleaks only (parallel with Terraform validate + guards-pre-corset + warn-only docs/IaC).
#               dotnet-fast-core-build needs it → drift fails before corset full-solution build.
#   Tier 0.9 — guards-pre-corset (text/Python guards; no solution build; parallel with OpenAPI/Terraform after gitleaks)
#   Tier 1 — .NET fast core (corset): build once + parallel Suite=Core test shards (SBOM/coverage HTML in Tier 1.0)
#   Tier 1.0 — dotnet-fast-core-artifacts (full CI): CycloneDX SBOM + ReportGenerator from corset Cobertura
#   Tier 1a â€” Named agent gates (branch protection): prompt-injection regression (Python + dotnet test);
#             offline agent regression (eval corpus + prompt JSON baseline); parallel after gitleaks
#   Tier 1.5 â€” DbUp migrations on empty catalog (Docker SQL) + greenfield SQL boot (API process + /health/ready); after Tier 1
#   Tier 2 â€” .NET full regression + SQL (parallel shards: Category!=Slow split Api.Tests (Integration sharded 0..2 vs non-Integration)
#           vs other test assemblies; Category=Slow split: Api.Tests vs AgentRuntime+Application+Decisioning; merged in `dotnet-coverage-merge`)
#   Tier 2b â€” Simmy chaos (after Tier 2; no SQL)
#   Tier 2d â€” Optional live Azure OpenAI (`RealAzureOpenAIEndToEndTests`) after OpenAPI snapshot + merged coverage gates + chaos;
#           â€” opt-in repo var `ARCHLUCID_CI_REAL_AOAI_ENABLED`; secrets `ARCHLUCID_CI_REAL_AOAI_ENDPOINT` / `ARCHLUCID_CI_REAL_AOAI_KEY`;
#           shares golden-cohort budget probe ($15/mo): live invoke on probe exit 0/1, ::warning:: skip on 2/3 (not pull_request).
#   Tier 2c â€” k6: operator-path API smoke after full regression (native k6; merge-blocking) + k6 CI smoke read+write (after Tier 1)
#   Tier 3a â€” Operator UI unit (Vitest / jsdom) + CycloneDX npm SBOM artifact; lint/typecheck/build (`ui-static-quality`); mock journeys (`ui-playwright-mock-smoke`);
#             axe WCAG 2.1 A/AA (`ui-playwright-accessibility`, mock-backed); optional full-page screenshot goldens via `npm run test:e2e:mock:visual` locally when updating baselines
#   Tier 3b — Operator UI e2e (Playwright live API + SQL): `ui-e2e-live` @release-gate subset; `ui-e2e-live-extended` warn-only full matrix (`workflow_dispatch` input for extended live-a11y)
#   Terraform advisory: mock manifest â†’ emit comment-only snippets â†’ terraform fmt -check / validate (`terraform-advisory-snippets-validate`)
#
# Re-run failed jobs from the Actions tab. Local equivalents: test-fast-core.*, test-full.*,
# archlucid-ui: npm test / npm run test:axe-components / Playwright (default live config; mock via playwright.mock.config.ts).
#
# .NET coverage: each test job writes a collapsible report to the job summary; download
# coverage-report-*-html artifacts for browsable index.html (ReportGenerator).
# Also: Dependabot (.github/dependabot.yml), CodeQL (.github/workflows/codeql.yml),
# Docker build smoke + Trivy image scan, Terraform validate + Trivy config (Terraform misconfiguration;
# same audit class as tfsec/checkov for public exposure / encryption / IAM footguns),
# NuGet cache on setup-dotnet, PR sticky coverage comment.
name: CI

# PR (main/master): Tier 0–0.9 + trimmed `dotnet-fast-core` (no Tier 1.0 artifacts, no coverlet, no finding-engine template).
# Full CI: `dotnet-fast-core-artifacts` after corset. Jobs after corset: **workflow_dispatch** only (except PR corset path).
# Full CI: Actions â†’ CI â†’ Run workflow (pick branch/ref).
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_extended_live_a11y_matrix:
        description: "Run full live axe route matrix in ui-e2e-live-extended (overrides default @live-a11y-full-matrix exclusion)"
        required: false
        default: false
        type: boolean

# One active CI run per PR (or per ref for workflow_dispatch). A newer push cancels the stale run
# so overlapping OpenAPI/build/test minutes are not burned on commits that are already superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PR path lanes (ci-path-lanes): soft-skip OpenAPI / .NET corset / Terraform validate steps when the
# diff does not touch those surfaces (docs/UI-only PRs). Jobs still report success so required checks
# are not left Pending/Skipped. workflow_dispatch always runs full lanes.
# Corset test shards download packed bin/obj from the build job (artifact) instead of relying only on
# actions/cache same-SHA restore.

# Opt into Node 24 for JavaScript actions (GitHub default June 2026). Docker Buildx / build-push use
# setup-buildx-action@v4 + build-push-action@v7 (Node 24 runtimes; runner â‰¥ v2.327.1). Prefer
# `actions/setup-python@v6` here (matches Node 24; v5 targeted Node 20). Other third-party actions may still
# declare node20 until republished. Tier-0 secret scan uses gacts/gitleaks (node24-native) instead of
# gitleaks/gitleaks-action to avoid Node 20 deprecation noise.
# Trivy: pin `aquasecurity/trivy-action` to a **commit** (org allow-lists). Do **not** rely on nested
# `setup-trivy` â€” it sparse-checkouts `aquasecurity/trivy` for `contrib/install.sh`, which triggers partial-clone
# promisor fetches that fail on GitHub-hosted runners (`fatal: could not fetch â€¦ from promisor remote`).
# Install the CLI via `.github/actions/install-trivy` (release tarball) and pass `skip-setup-trivy: true`.
# Pin **v0.69.3** until Aqua restores reliable release/install paths (discussions #10265+). Set `cache: false`
# where we skip nested cache noise.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # OpenAPI snapshot tests run in job openapi-contract-snapshot; skip here to shorten corset test time.
  DOTNET_FAST_CORE_TEST_FILTER: Suite=Core&Category!=Slow&Category!=Integration&Category!=GoldenCorpusRecord&FullyQualifiedName!~OpenApiContractSnapshotTests&FullyQualifiedName!~OpenApiBuyerContractSnapshotTests

jobs:
  gitleaks:
    name: "Security: gitleaks (secret scan)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Pin CLI version (not only "latest") so release resolution + cache keys are stable and
      # transient "Error: other side closed" (HTTP/2 / connection reset while fetching assets) is less likely.
      - uses: gacts/gitleaks@v1.3.2
        with:
          version: "8.30.1"
          config-path: .gitleaks.toml

  ci-path-lanes:
    name: "CI: path lanes (PR scope)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_openapi: ${{ steps.detect.outputs.run_openapi }}
      run_dotnet: ${{ steps.detect.outputs.run_dotnet }}
      run_terraform: ${{ steps.detect.outputs.run_terraform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch PR base for path lanes
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect CI path lanes
        id: detect
        run: |
          python scripts/ci/detect_ci_path_lanes.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}" \
            --event-name "${{ github.event_name }}" \
            --json-out artifacts/ci/ci-path-lanes.json \
            --write-github-output

      - name: Path-lane detector unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_detect_ci_path_lanes.py"

  public-pdf-buyer-safety:
    name: "Docs: public PDF buyer-safety"
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Public PDF buyer-safety guard (TB-725)
        run: python scripts/ci/check_public_pdf_safety.py

      - name: Public PDF buyer-safety guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_check_public_pdf_safety.py"

  docs-root-size:
    name: "Docs: root markdown count guard (â‰¤32)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert docs root .md count
        run: python scripts/ci/assert_docs_root_size.py

  # Full history: last-touch dates for docs/*.md (advisory; merge-never).
  docs-stale-code-refs-warn:
    name: "Docs: stale code-path references (advisory)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stale docs with code references (90d+, warn-only)
        continue-on-error: true
        run: python scripts/ci/detect_stale_docs.py

  docs-navigator-links:
    name: "Docs: NAVIGATOR + connector matrix link targets exist"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - gitleaks
      - docs-root-size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert docs/START_HERE.md links resolve
        run: python scripts/ci/assert_start_here_links_valid.py

      - name: Assert docs/library root markdown declares audience (TB-013 Phase 2)
        run: python scripts/ci/assert_library_root_audience.py

      - name: Assert CONNECTOR_READINESS_MATRIX.md links and code paths resolve
        run: python scripts/ci/assert_connector_readiness_matrix_paths.py

      - name: Connector readiness matrix path guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_connector_readiness_matrix_paths.py"

  two-layer-naming-lint:
    name: "Docs: Pilot/Operate buyer naming lint"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Assert no legacy buyer layer labels under docs/
        run: python scripts/ci/assert_two_layer_naming.py

      - name: two-layer naming guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_assert_two_layer_naming.py"

  integrations-node-ado-pipeline-tasks:
    name: "Integrations: Azure Pipelines YAML scripts (node --test)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs: gitleaks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: node --test (ADO pipeline task parity)
        run: |
          node --test integrations/azure-devops-task-manifest-delta-pr-comment/post-pr-thread.test.mjs
          node --test integrations/azure-devops-task-manifest-delta/job-summary.test.mjs

  docs-link-scope-gate:
    name: "Docs: link integrity + scope-header ratchet (blocking)"
    # Genuinely merge-blocking, unlike the advisory `doc-markdown-links` job below. Kept small on
    # purpose: relative-link integrity is finite and fixable, and the scope-header check runs in
    # changed-files-only ratchet mode so the legacy headerless backlog cannot block unrelated work.
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the ratchet can resolve the merge base against the base ref.
          fetch-depth: 0

      - name: Fetch PR base for scope-header ratchet
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check relative markdown links
        run: python scripts/ci/check_md_links.py

      - name: Doc link integrity batch guard (TB-170)
        run: python -m unittest discover -s scripts/ci/tests -p "test_doc_links_batch.py"

      - name: Doc scope header â€” changed files only (ratchet)
        run: |
          python scripts/ci/check_doc_scope_header.py \
            --changed-only \
            --base-ref "origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"

      - name: Doc scope header guard unit tests
        run: |
          cd scripts/ci
          python -m unittest test_check_doc_scope_header test_backfill_doc_scope_headers

  doc-markdown-links:
    name: "Docs: markdown link integrity"
    # Warn-only: job + per-step continue-on-error so every doc/link guard runs and surfaces failures in one CI run.
    # Link integrity and the scope-header ratchet are additionally gated by `docs-link-scope-gate` above.
    continue-on-error: true
    needs:
      - gitleaks
      - docs-root-size
      - docs-navigator-links
      - two-layer-naming-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect buyer-surface path changes (strict claim guard trigger)
        id: buyer-surface-detect
        run: |
          python scripts/ci/detect_buyer_surface_changes.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}" \
            --json-out artifacts/ci/buyer-surface-change-detection.json \
            --write-github-output

      - name: Terraform root ordering sync
        continue-on-error: true
        run: python scripts/ci/assert_terraform_root_ordering_sync.py

      - name: CD BUILD_ID / OCI label contract (unit tests)
        run: python -m unittest discover -s scripts/ci/tests -p "test_oci_build_identity.py"

      - name: CD deployment lineage contract (unit tests)
