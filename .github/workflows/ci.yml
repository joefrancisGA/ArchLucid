  terraform-validate-private:
    name: "Terraform: validate private stack (no backend)"
    # Hard gate: do not wait on warn-only docs — start with OpenAPI / guards after gitleaks.
    # Soft-skip when PR path lanes exclude Terraform (job still succeeds for required checks).
    needs:
      - gitleaks
      - ci-path-lanes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Path-skip Terraform private validate
        if: needs.ci-path-lanes.outputs.run_terraform != 'true'
        run: "echo 'Path-skip: Terraform private validate not required for this PR lane set.'"

      - uses: hashicorp/setup-terraform@v4
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        with:
          terraform_wrapper: false

      - uses: ./.github/actions/terraform-init
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        with:
          working-directory: infra/terraform-private

      - name: terraform validate
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        working-directory: infra/terraform-private
        run: terraform validate

      - name: terraform fmt (check only)
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        # Warn-only: formatting drift is cosmetic and must not block a deploy. Run `terraform fmt -recursive` to fix.
        continue-on-error: true
        working-directory: infra/terraform-private
        run: terraform fmt -check -recursive

      - name: Install Trivy CLI
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        uses: ./.github/actions/install-trivy
        with:
          version: v0.69.3

      - name: Trivy IaC (Terraform misconfigurations)
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: infra/terraform-private
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: false

  terraform-validate-public-stacks:
    name: "Terraform: validate main / edge / entra (no backend)"
    # Hard gate: do not wait on warn-only docs — start with OpenAPI / guards after gitleaks.
    # Soft-skip when PR path lanes exclude Terraform (job still succeeds for required checks).
    needs:
      - gitleaks
      - ci-path-lanes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Throttle parallel registry.terraform.io downloads (grafana/azurerm) to avoid HTTP 429.
      max-parallel: 4
      matrix:
        directory: [infra/terraform, infra/terraform-edge, infra/terraform-entra, infra/terraform-acr, infra/terraform-container-apps, infra/terraform-storage, infra/terraform-redis, infra/terraform-cosmos, infra/terraform-monitoring, infra/terraform-sql-failover, infra/terraform-openai, infra/terraform-keyvault, infra/terraform-orchestrator, infra/terraform-logicapps, infra/terraform-servicebus, infra/terraform-pilot, infra/terraform/prod]
    steps:
      - uses: actions/checkout@v5

      - name: Path-skip Terraform public validate
        if: needs.ci-path-lanes.outputs.run_terraform != 'true'
        run: "echo 'Path-skip: Terraform ${{ matrix.directory }} not required for this PR lane set.'"

      - uses: hashicorp/setup-terraform@v4
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        with:
          terraform_wrapper: false

      - uses: ./.github/actions/terraform-init
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        with:
          working-directory: ${{ matrix.directory }}

      - name: terraform validate
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        working-directory: ${{ matrix.directory }}
        run: terraform validate

      - name: terraform fmt (check only)
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        # Warn-only: formatting drift is cosmetic and must not block a deploy. Run `terraform fmt -recursive` to fix.
        continue-on-error: true
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive

      - name: Install Trivy CLI
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        uses: ./.github/actions/install-trivy
        with:
          version: v0.69.3

      - name: Trivy IaC (Terraform misconfigurations)
        if: needs.ci-path-lanes.outputs.run_terraform == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: ${{ matrix.directory }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: false

  terraform-advisory-snippets-validate:
    name: "Terraform: advisory snippets from mock manifest (fmt + validate)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - gitleaks
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Advisory snippets guard unit tests
        run: python -m unittest discover -s scripts/ci/tests -p "test_terraform_advisory_snippets_validate.py"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Emit advisory snippets + terraform fmt/validate
        run: |
          set -euo pipefail
          python3 scripts/ci/terraform_advisory_snippets_validate.py

  iac-parity-scan:
    name: "IaC: parity scan (HOLD on pilot-essential)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - gitleaks
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: IaC parity scan (v2)
        run: python3 scripts/ci/report_iac_parity_scan.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-parity-scan
          path: |
            artifacts/release/iac-parity-scan.json
            artifacts/release/iac-parity-scan.md

  hosted-prod-terraform-sync-parity:
    name: "IaC: hosted prod scaffold sync parity"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - gitleaks
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Sync deploy/hosted-prod-terraform to infra/terraform/prod
        shell: pwsh
        run: ./scripts/ci/sync-hosted-prod-terraform-to-infra.ps1

      - name: Assert infra/terraform/prod matches deploy/hosted-prod-terraform
        run: git diff --exit-code -- infra/terraform/prod

  openapi-contract-snapshot:
    name: ".NET: OpenAPI v1 contract snapshot (fail-fast)"
    # Hard gate: do not wait on warn-only docs — longest pre-corset pole; start right after gitleaks.
    # Soft-skip when PR path lanes exclude OpenAPI (job still succeeds for required checks).
    needs:
      - gitleaks
      - ci-path-lanes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Path-skip OpenAPI contract snapshot
        if: needs.ci-path-lanes.outputs.run_openapi != 'true'
        run: "echo 'Path-skip: OpenAPI contract snapshot not required for this PR lane set.'"

      - name: Setup .NET
        if: needs.ci-path-lanes.outputs.run_openapi == 'true'
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Build + OpenAPI contract snapshot tests (v1 + buyer)
        if: needs.ci-path-lanes.outputs.run_openapi == 'true'
        env:
          ARCHLUCID_OPENAPI_SNAPSHOT_ARTIFACT_PATH: ${{ runner.temp }}/openapi-contract/openapi-v1.generated.canonical.json
        run: bash scripts/ci/check_openapi_contract_snapshot.sh

      - name: Assert ArchLucid.Api.Client NSwag output in sync
        if: needs.ci-path-lanes.outputs.run_openapi == 'true'
        run: bash scripts/ci/assert_api_client_in_sync.sh

      - name: Setup Node (for openapi-typescript TypeScript drift check)
        if: needs.ci-path-lanes.outputs.run_openapi == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Assert TypeScript api-types.generated.ts in sync with OpenAPI snapshot
        if: needs.ci-path-lanes.outputs.run_openapi == 'true'
        run: bash scripts/ci/assert_api_types_in_sync.sh

      - name: Upload generated OpenAPI contract artifact
        if: always() && needs.ci-path-lanes.outputs.run_openapi == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openapi-v1-generated-canonical
          path: ${{ runner.temp }}/openapi-contract/openapi-v1.generated.canonical.json
          if-no-files-found: warn
          retention-days: 14

  # Exact `name:` strings below are listed in `.github/BRANCH_PROTECTION.md` and `.github/pull_request_template.md`
  # for org admins enabling required status checks (owner decision).
  ci-agent-prompt-injection-regression:
    name: "CI: prompt-injection regression (strict + block layer)"
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore + build (AgentRuntime.Tests for executable regression)
        run: |
          set -euo pipefail
          dotnet restore ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj
          dotnet build ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj --no-restore -c Release

      - name: Prompt-injection datasets (shape + executable regression)
        run: python3 scripts/ci/eval_agent_quality.py --prompt-injection-only --strict --enforce-prompt-injection-block-layer

      - name: TB-325 prompt-injection guard (corpus + typed rejection)
        run: python3 scripts/ci/assert_prompt_injection_guard.py

  ci-agent-offline-regression:
    name: "CI: agent offline regression (eval corpus + prompt JSON baseline)"
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Real-mode AI quality evidence (committed exemplars + Phase B floors)
        id: real_mode_ai_quality_evidence
        run: |
          set -euo pipefail
          bash scripts/ci/run_real_mode_ai_quality_evidence_ci.sh \
            --output-dir artifacts/ci/real-mode-ai-quality-evidence
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "## Real-mode AI quality evidence" >> "$GITHUB_STEP_SUMMARY"
            head -n 60 artifacts/ci/real-mode-ai-quality-evidence/ai-quality-release-summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Agent eval corpus (real-mode slice)" >> "$GITHUB_STEP_SUMMARY"
            head -n 40 artifacts/ci/real-mode-ai-quality-evidence/eval-corpus-real-mode-evidence.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload real-mode AI quality evidence bundle
        if: always() && steps.real_mode_ai_quality_evidence.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: real-mode-ai-quality-evidence
          path: artifacts/ci/real-mode-ai-quality-evidence/
          if-no-files-found: warn

      - name: Agent eval corpus (offline recall + simulator quality evidence + blocking baseline)
        id: eval_corpus
        run: |
          set -euo pipefail
          REP="${{ runner.temp }}/eval-corpus-report.md"
          python3 scripts/ci/eval_agent_corpus.py --markdown-report "$REP" --baseline --enforce-quality-gate
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$REP" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Setup .NET (technology consistency golden corpus)
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Technology consistency golden corpus (manifest drift guard)
        run: python3 scripts/ci/assert_technology_consistency_corpus.py

      - name: Restore + build technology consistency golden corpus test projects
        run: |
          set -euo pipefail
          dotnet restore ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj
          dotnet restore ArchLucid.ArtifactSynthesis.Tests/ArchLucid.ArtifactSynthesis.Tests.csproj
          dotnet build ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj --no-restore -c Release
          dotnet build ArchLucid.ArtifactSynthesis.Tests/ArchLucid.ArtifactSynthesis.Tests.csproj --no-restore -c Release

      - name: Technology consistency finding engine golden corpus
        run: |
          dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~TechnologyConsistencyGoldenCorpus"

      - name: Technology consistency artifact lint golden corpus
        run: |
          dotnet test ArchLucid.ArtifactSynthesis.Tests/ArchLucid.ArtifactSynthesis.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~TechnologyConsistencyArtifactGoldenCorpus"

      - name: Architecture intelligence golden regression gate
        run: |
          dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~ArchitectureIntelligenceGoldenRegression|FullyQualifiedName~ArchitectureIntelligenceBatch48"

      - name: Setup Node.js (architecture lifecycle batch helpers)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Architecture lifecycle batch helper unit tests
        working-directory: archlucid-ui
        run: |
          npm ci
          npm run test:vitest-single-worker -- e2e/helpers/architecture-lifecycle-batch-*.test.ts

      - name: Upload agent eval scorecard
        if: always() && steps.eval_corpus.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-scorecard
          path: ${{ runner.temp }}/eval-corpus-report.md
          if-no-files-found: ignore

      - name: Agent prompt regression baseline (JSON shape)
        run: python3 scripts/ci/assert_prompt_regression.py

  demo-workspaces-fixture-parity:
    name: "Go-to-market: demo workspace pins (manifest vs docs + seeds)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Validate DEMO_WORKSPACES.md vs pinned manifest
        shell: pwsh
        run: ./scripts/demo-workspaces/Validate-DemoWorkspacesDoc.ps1 -RepoRoot "${{ github.workspace }}"

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore Application.Tests
        run: dotnet restore ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj

      - name: Build Application.Tests (Release)
        run: dotnet build ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      - name: DemoWorkspaceFixtureManifestParityTests
        run: dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~DemoWorkspaceFixtureManifestParityTests"

  azure-extractor-pester:
    name: "Azure extractor: Get-ArchLucidAzurePackage Pester (mock ARM)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs:
      - doc-markdown-links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $gallery = Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue
          if ($gallery) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
          }
          else {
            try {
              Register-PSRepository -Default -InstallationPolicy Trusted
            }
            catch {
              if ($_.Exception.Message -notmatch 'already exists') {
                throw
              }
            }
          }

          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0 -MaximumVersion 5.99.99 -Repository PSGallery
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion 1.21.0 -Repository PSGallery

      - name: PSScriptAnalyzer security gate (Get-ArchLucidAzurePackage.ps1)
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/azure/Get-ArchLucidAzurePackage.ps1'
          $findings = Invoke-ScriptAnalyzer -Path $scriptPath -Severity Error, Warning
          $blocking = @($findings | Where-Object {
              $_.Severity -eq 'Error' -or
              $_.RuleName -in @(
                'PSAvoidUsingInvokeExpression',
                'PSAvoidUsingPlainTextForPassword',
                'PSUseCredentialType',
                'PSAvoidUsingConvertToSecureStringWithPlainText'
              )
            })
          if ($blocking.Count -gt 0) {
            $blocking | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported blocking findings on Get-ArchLucidAzurePackage.ps1"
          }

      - name: Get-ArchLucidAzurePackage.Tests.ps1
        shell: pwsh
        run: Invoke-Pester -Strict -EnableExit -Path 'scripts/azure/tests/Get-ArchLucidAzurePackage.Tests.ps1'

      - name: Run-ArchLucidAzureExtractor.Tests.ps1
        shell: pwsh
        run: Invoke-Pester -Strict -EnableExit -Path 'scripts/azure/tests/Run-ArchLucidAzureExtractor.Tests.ps1'

      - name: Get-ArchLucidAwsPackage.Tests.ps1
        shell: pwsh
        run: Invoke-Pester -Strict -EnableExit -Path 'scripts/tests/Get-ArchLucidAwsPackage.Tests.ps1'

      - name: Write-AiReadinessPosture.Tests.ps1
        shell: pwsh
        run: Invoke-Pester -Strict -EnableExit -Path 'scripts/tests/Write-AiReadinessPosture.Tests.ps1'

      - name: Get-ArchLucidGcpPackage.Tests.ps1
        shell: pwsh
        run: Invoke-Pester -Strict -EnableExit -Path 'scripts/tests/Get-ArchLucidGcpPackage.Tests.ps1'

  guards-pre-corset:
    name: "CI: guards pre-corset (text)"
    # RC2 diagnostic branch: blocking — guard failure fails the workflow (conclusion: failure); jobs that
    # need guards-pre-corset are skipped. Other refs: warn-only (deploy gate exclusion).
    # Critical path: start after gitleaks only so this runs in parallel with OpenAPI + Terraform validate
    # (warn-only docs/IaC/demo jobs must not delay text guards or the corset build).
    continue-on-error: ${{ github.ref != 'refs/heads/RC2' }}
    needs:
      - gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch default branch for diff guards (manual CI)
        if: github.event_name == 'workflow_dispatch'
        run: git fetch origin "${{ github.event.repository.default_branch }}" --no-tags

      - name: Set git diff range (PR)
        if: github.event_name == 'pull_request'
        run: echo "ARCHLUCID_GIT_DIFF_RANGE=${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"

      - name: Set git diff range (push)
        if: github.event_name == 'push'
        run: echo "ARCHLUCID_GIT_DIFF_RANGE=${{ github.event.before }}...${{ github.event.after }}" >> "$GITHUB_ENV"

      - name: Set git diff range (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: echo "ARCHLUCID_GIT_DIFF_RANGE=origin/${{ github.event.repository.default_branch }}...HEAD" >> "$GITHUB_ENV"

      - name: Run pre-corset guards
        env:
          ARCHLUCID_GIT_REPO_ROOT: ${{ github.workspace }}
        run: bash scripts/ci/run_guards_pre_corset.sh

  dotnet-fast-core-build:
    name: ".NET: fast core — build"
    # Hard-gate fan-in only. Warn-only docs/IaC/demo jobs stay visible but off this critical path
    # (continue-on-error does not unblock needs — listing them here used to serialize ~docs+OpenAPI).
    # Soft-skip when PR path lanes exclude .NET (job still succeeds for required checks).
    needs:
      - gitleaks
      - ci-path-lanes
      - openapi-contract-snapshot
      - terraform-validate-private
      - terraform-validate-public-stacks
      - guards-pre-corset
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Path-skip fast-core build
        if: needs.ci-path-lanes.outputs.run_dotnet != 'true'
        run: "echo 'Path-skip: .NET fast-core build not required for this PR lane set.'"

      - name: Fetch default branch for diff guards (manual CI)
        if: github.event_name == 'workflow_dispatch' && needs.ci-path-lanes.outputs.run_dotnet == 'true'
        run: git fetch origin "${{ github.event.repository.default_branch }}" --no-tags

      - name: Setup .NET
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true'
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore, audit, build, CLI config lint
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true'
        run: bash scripts/ci/run_dotnet_fast_core_build.sh

      - name: Pack bin/obj for test shards
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true'
        run: bash scripts/ci/pack_corset_build_outputs.sh "${{ runner.temp }}/corset-build-outputs.tgz"

      - name: Upload corset build outputs artifact
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: corset-build-outputs-${{ github.sha }}
          path: ${{ runner.temp }}/corset-build-outputs.tgz
          if-no-files-found: error
          retention-days: 1

  dotnet-fast-core-test:
    name: ".NET: fast core — test (${{ matrix.shard_label }})"
    needs:
      - ci-path-lanes
      - dotnet-fast-core-build
    runs-on: ubuntu-latest
    # Three nested ceilings, innermost first: blame-hang (5m/test) → per-project cap in
    # run_fast_core_corset_shard.sh (14m, names the stuck project) → step timeout → job timeout.
    # Architecture.Tests skips Coverlet (OOM on GHA when NetArchTest loads the product graph).
    # Step stays under the job so the killed step still leaves room for the if: always() uploads;
    # a 3m gap was not enough in run 30729657151, where the forced job kill dropped every diagnostic.
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_id: api
            shard_label: Api.Tests
            job_timeout_minutes: 30
            step_timeout_minutes: 24
          - shard_id: host-application
            shard_label: Application + runtime + host
            job_timeout_minutes: 30
            step_timeout_minutes: 24
          - shard_id: host-composition
            shard_label: Host composition (full DI graph)
            job_timeout_minutes: 30
            step_timeout_minutes: 24
          - shard_id: data-core
            shard_label: Core + persistence stack
            job_timeout_minutes: 30
            step_timeout_minutes: 24
          - shard_id: surface-misc
            shard_label: Contracts + integrations + misc
            # Heaviest shard: 11 projects, ~23m of test work. Budget = 23m + one 14m project kill + uploads.
            job_timeout_minutes: 55
            step_timeout_minutes: 43
    steps:
      - uses: actions/checkout@v5

      - name: Path-skip fast-core test shard
        if: needs.ci-path-lanes.outputs.run_dotnet != 'true'
        run: "echo 'Path-skip: .NET fast-core test shard not required for this PR lane set.'"

      - name: Setup .NET
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true'
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Download corset build outputs artifact
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true'
        uses: actions/download-artifact@v7
        with:
          name: corset-build-outputs-${{ github.sha }}
          path: ${{ runner.temp }}/corset-build-outputs

      - name: Unpack corset build outputs
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true'
        run: bash scripts/ci/unpack_corset_build_outputs.sh "${{ runner.temp }}/corset-build-outputs/corset-build-outputs.tgz"

      # NuGet packages come from setup-dotnet cache; bin/obj come from the build artifact.
      # Restore is cheap with a warm package cache; avoid a full recompile on cache miss.
      - name: Restore solution packages
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true'
        run: dotnet restore ArchLucid.sln

      # OpenApiContractSnapshotTests excluded via DOTNET_FAST_CORE_TEST_FILTER; job openapi-contract-snapshot already gates drift.
      # Step timeout is under job timeout so if: always() diagnostic uploads still run after a hang.
      - name: Test — fast core shard (with coverage)
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true' && github.event_name != 'pull_request'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          ARCHLUCID_FAST_CORE_COLLECT_COVERAGE: "1"
        run: bash scripts/ci/run_fast_core_corset_shard.sh "${{ matrix.shard_id }}"

      - name: Test — fast core shard (PR trimmed — no coverage collection)
        if: needs.ci-path-lanes.outputs.run_dotnet == 'true' && github.event_name == 'pull_request'
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        run: bash scripts/ci/run_fast_core_corset_shard.sh "${{ matrix.shard_id }}"

      - uses: actions/upload-artifact@v7
        if: always() && needs.ci-path-lanes.outputs.run_dotnet == 'true' && github.event_name != 'pull_request'
        with:
          name: coverage-fast-core-${{ matrix.shard_id }}
          path: ${{ runner.temp }}/coverage-fast-core/**/coverage.cobertura.xml
          if-no-files-found: warn

      # Hang forensics: current-project.txt names the stuck project when the step is killed;
      # project-timing.log + TRX show how far the shard got (see run_fast_core_corset_shard.sh).
      - uses: actions/upload-artifact@v7
        if: always() && needs.ci-path-lanes.outputs.run_dotnet == 'true'
        with:
          name: fast-core-diag-${{ matrix.shard_id }}
          path: |
            ${{ runner.temp }}/coverage-fast-core/current-project.txt
            ${{ runner.temp }}/coverage-fast-core/project-timing.log
            ${{ runner.temp }}/coverage-fast-core/**/*.trx
            ${{ runner.temp }}/coverage-fast-core/**/Sequence_*.xml
          if-no-files-found: warn

  # Branch protection / downstream `needs` target: fails when build or any test shard fails.
  dotnet-fast-core:
    name: ".NET: fast core (corset)"
    needs:
      - dotnet-fast-core-build
      - dotnet-fast-core-test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail with explicit shard list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=()

          build_result="${{ needs.dotnet-fast-core-build.result }}"
          if [ "$build_result" != "success" ]; then
            failed+=("dotnet-fast-core-build:${build_result}")
          else
            test_result="${{ needs.dotnet-fast-core-test.result }}"
            if [ "$test_result" != "success" ]; then
              while IFS= read -r line; do
                if [ -n "$line" ]; then
                  failed+=("$line")
                fi
              done < <(gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" --json jobs \
                --jq '.jobs[] | select(.name | test("fast core — test")) | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | "\(.name):\(.conclusion)"' \
                2>/dev/null || true)

              if [ ${#failed[@]} -eq 0 ]; then
                failed+=("dotnet-fast-core-test (aggregate):${test_result}")
              fi
            fi
          fi

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Fast core corset failures: ${failed[*]}"
            exit 1
          fi

          echo "Fast core corset completed (build + all shards)."


  dotnet-fast-core-artifacts:
    name: ".NET: fast core artifacts (SBOM + coverage HTML)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore (SBOM)
        run: dotnet restore ArchLucid.Api/ArchLucid.Api.csproj

      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-fast-core-*
          merge-multiple: true
          path: ${{ runner.temp }}/coverage-fast-core

      - name: SBOM and coverage HTML
        run: bash scripts/ci/run_dotnet_fast_core_artifacts.sh

      - name: Test — finding-engine template (not in main solution)
        run: dotnet test templates/archlucid-finding-engine/ArchLucidFindingEngine.Tests/ArchLucidFindingEngine.Tests.csproj -c Release

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-dotnet
          path: sbom-dotnet.json

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report-fast-core-html
          path: ${{ runner.temp }}/coverage-report-fast-core/**
          if-no-files-found: warn

  # All infra/terraform* + infra/modules: init (no backend) + validate; apply-saas.ps1 consistency. No Azure creds.
  saas-terraform-roots-validate:
    name: "SaaS: Terraform roots validate (script suite)"
    # Warn-only (deploy gate exclusion): failure surfaces but does not fail the CI run / block CD.
    continue-on-error: true
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install PowerShell
        run: |
          set -euo pipefail
          PWSH_VER=7.4.6
          curl -sSL -o /tmp/pwsh.tgz "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VER}/powershell-${PWSH_VER}-linux-x64.tar.gz"
          sudo mkdir -p /opt/microsoft/powershell7
          sudo tar zxf /tmp/pwsh.tgz -C /opt/microsoft/powershell7
          sudo chmod a+x /opt/microsoft/powershell7/pwsh
          sudo ln -sf /opt/microsoft/powershell7/pwsh /usr/local/bin/pwsh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: assert_terraform_roots_valid (PowerShell + Terraform, no cloud auth)
        run: python3 scripts/ci/assert_terraform_roots_valid.py

  # Empty catalog only: invokes DatabaseMigrator.Run (embedded DbUp scripts) without starting ArchLucid.Api.
  sql-dbup-empty-catalog:
    name: ".NET: Tier 1.5 â€” DbUp migrations on empty catalog (Docker SQL)"
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build MigrateVerify (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Persistence.MigrateVerify/ArchLucid.Persistence.MigrateVerify.csproj --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      - name: Wait for SQL Server to be ready
        uses: ./.github/actions/wait-for-sqlserver

      - name: Create empty SQL catalog for DbUp
        run: bash scripts/ci/ensure-ci-sql-catalog.sh ArchLucidCiDbUp

      - name: Apply DbUp scripts (embedded)
        env:
          ARCHLUCID_CI_DBUP_CONNECTION_STRING: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidCiDbUp"
        run: |
          set -euo pipefail
          dotnet run --no-build -c Release --project ArchLucid.Persistence.MigrateVerify/ArchLucid.Persistence.MigrateVerify.csproj

      - name: Assert dbo.SchemaVersions has rows after DbUp
        run: |
          set -e
          RAW=$(docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -d ArchLucidCiDbUp \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.SchemaVersions;" \
            -h -1 -W)
          COUNT=$(printf '%s\n' "$RAW" | grep -oE '[0-9]+' | head -1)
          echo "SchemaVersions row count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "::error::Expected dbo.SchemaVersions after Tier 1.5 DbUp step"
            printf '%s\n' "$RAW"
            exit 1
          fi

  # Empty catalog + API process: catches DbUp vs SqlSchemaBootstrapper ordering and greenfield migration gaps (see GreenfieldSqlBootIntegrationTests).
  api-greenfield-boot:
    name: ".NET: greenfield SQL boot (empty catalog)"
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build API (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Api/ArchLucid.Api.csproj --no-restore -c Release

      - name: Wait for SQL Server to be ready
        uses: ./.github/actions/wait-for-sqlserver

      - name: Create empty SQL catalog for greenfield boot
        run: bash scripts/ci/ensure-ci-sql-catalog.sh ArchLucidGreenfieldCi

      - name: Start ArchLucid.Api (background)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5128
          ConnectionStrings__ArchLucid: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidGreenfieldCi"
          ArchLucid__StorageProvider: Sql
          ArchLucidAuth__Mode: DevelopmentBypass
          ArchLucidAuth__AllowTestActorHeaders: "true"
          Authentication__ApiKey__DevelopmentBypassAll: "true"
          AgentExecution__Mode: Simulator
          # Readiness includes data_consistency, which requires at least one reconciliation pass. Env wins over
          # appsettings when using an older Release output snapshot; single-process CI: skip SQL leader leases.
          DataConsistency__InitialDelaySeconds: "0"
          HostLeaderElection__Enabled: "false"
        run: |
          set -e
          nohup dotnet run --no-build -c Release --project ArchLucid.Api/ArchLucid.Api.csproj > "${RUNNER_TEMP}/greenfield-boot.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/greenfield-boot.pid"

      - name: Wait for API readiness
        run: bash scripts/ci/wait-for-api-ready.sh "${RUNNER_TEMP}/greenfield-boot.log"

      - name: Assert DbUp journal populated (SchemaVersions)
        run: |
          set -e
          RAW=$(docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -d ArchLucidGreenfieldCi \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.SchemaVersions;" \
            -h -1 -W)
          COUNT=$(printf '%s\n' "$RAW" | grep -oE '[0-9]+' | head -1)
          echo "SchemaVersions row count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "::error::Expected at least one row in dbo.SchemaVersions after greenfield boot"
            printf '%s\n' "$RAW"
            exit 1
          fi

      - name: Upload greenfield boot log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: greenfield-boot-log
          path: ${{ runner.temp }}/greenfield-boot.log
          if-no-files-found: warn

  # Non-slow full regression: Api.Tests split by Category (Integration vs non-Integration). Integration runs as six
  # parallel shards (scripts/ci/Invoke-ApiIntegrationTestShard.ps1) because the suite is sequential (xunit.runner.json)
  # and a monolithic job can run ~4h with minimal console output. Each shard uses minimal console logging + TRX/diag/blame artifacts.
  dotnet-full-regression-core-api-integration:
    name: ".NET: full regression â€” Api.Tests integration shard ${{ matrix.shard_label }} (SQL)"
    needs:
      - dotnet-fast-core
      - api-greenfield-boot
      - sql-dbup-empty-catalog
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            shard_label: "1/6"
            blame_timeout: "75min"
            chunk_timeout: "20min"
            step_timeout_minutes: 45
          - shard: 1
            shard_label: "2/6"
            # CI #2268: RetrievalQuerySmokeIntegrationTests hangs inside GetAsync; 130s fires before the
            # 150s RunAsync wrapper returns so vstest captures an in-process mini-dump that includes
            # server-side thread stacks. Revert to 75min once the root cause is identified and fixed.
            blame_timeout: "130s"
            chunk_timeout: "20min"
            step_timeout_minutes: 45
          - shard: 2
            shard_label: "3/6"
            blame_timeout: "75min"
            chunk_timeout: "20min"
            step_timeout_minutes: 45
          - shard: 3
            shard_label: "4/6"
            blame_timeout: "75min"
            chunk_timeout: "20min"
            step_timeout_minutes: 45
          - shard: 4
            shard_label: "5/6"
            blame_timeout: "75min"
            chunk_timeout: "20min"
            step_timeout_minutes: 45
          - shard: 5
            shard_label: "6/6"
            blame_timeout: "75min"
            chunk_timeout: "20min"
            step_timeout_minutes: 45
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v5

      - name: Wait for SQL Server to be ready (service warm-up)
        uses: ./.github/actions/wait-for-sqlserver

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore ArchLucid.sln

      - name: Build (Release)
        run:           dotnet build ArchLucid.sln --no-restore -c Release /p:SourceRevisionId=$(git rev-parse HEAD)

      - name: Wait for SQL Server to be ready (pre-shard)
        uses: ./.github/actions/wait-for-sqlserver

      - name: Ensure SQL persistence test catalog
        run: bash scripts/ci/ensure-ci-sql-catalog.sh ArchLucidPersistenceTests

      # Parent-process chunk watchdog (Invoke-ApiIntegrationTestShard.ps1) is the primary hang defense:
      # it captures an out-of-process dotnet-dump before killing the test host. Step timeout-minutes is
      # the Actions backstop so failure/canceled upload steps still run if the watchdog is bypassed.
      # Coverlet is disabled on integration shards (test.runsettings): collector finalization crashes under chunked SQL load.
      - name: Test â€” ArchLucid.Api.Tests (Integration shard, exclude Category=Slow)
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        env:
          ARCHLUCID_SQL_TEST: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests"
        run: >
          pwsh -NoProfile -File ./scripts/ci/Invoke-ApiIntegrationTestShard.ps1
          -ShardIndex ${{ matrix.shard }}
          -ShardCount 6
          -FilterChunkSize 8
          -BlameHangTimeout ${{ matrix.blame_timeout }}
          -ChunkTimeout ${{ matrix.chunk_timeout }}
          -RunSettingsPath test.runsettings
          -ResultsDirectory "${{ runner.temp }}/coverage-full-core-api-integration-shard-${{ matrix.shard }}"

      - name: SQL Server hang diagnostics (on failure or timeout)
        if: failure() || cancelled()
        uses: ./.github/actions/sqlserver-hang-diagnostics

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chunk-console-api-integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-full-core-api-integration-shard-${{ matrix.shard }}/chunk-*.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-trx-full-core-api-integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-full-core-api-integration-shard-${{ matrix.shard }}/**/*.trx
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-shard-manifest-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-full-core-api-integration-shard-${{ matrix.shard }}/integration-shard-*.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-blame-api-integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-full-core-api-integration-shard-${{ matrix.shard }}/**/Sequence_*.xml
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-hang-dump-api-integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-full-core-api-integration-shard-${{ matrix.shard }}/**/*.dmp
          if-no-files-found: warn

      # Human-readable managed thread stacks captured by the chunk watchdog alongside the .dmp.
      # Uploaded as a separate tiny artifact so a hung-shard root cause is diagnosable without
      # downloading the 100MB+ hang dump (the watchdog already writes dotnet-stack-*.txt; the
      # *.dmp-only upload above previously dropped it).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dotnet-hang-stack-api-integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-full-core-api-integration-shard-${{ matrix.shard }}/**/dotnet-stack-*.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vstest-diag-api-integration-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/coverage-full-core-api-integration-shard-${{ matrix.shard }}/vstest-api-integration-shard-*.diag.log
          if-no-files-found: ignore

  dotnet-full-regression-core-api-unit:
