  # k6 operator-path API smoke (health/ready + version + create run + authority list). Runs after full regression;
  # merge-blocking. Native k6; 5 VUs Ã— ~60s (ramp 10s / hold 40s / ramp 10s). Rate limits raised for synthetic traffic.
  k6-smoke-api:
    name: "Performance: k6 API smoke (operator path)"
    needs:
      - dotnet-full-regression-core-complete
      - dotnet-full-regression-slow-api
      - dotnet-full-regression-slow-domain
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build API (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Api/ArchLucid.Api.csproj --no-restore -c Release

      - name: Install k6
        shell: bash
        run: bash scripts/ci/install_k6_apt.sh

      - name: Wait for SQL Server to be ready
        uses: ./.github/actions/wait-for-sqlserver

      - name: Create catalog + start API (shared script)
        run: bash scripts/ci/start_api_for_k6.sh ArchLucidK6Smoke "${RUNNER_TEMP}/k6-api.log" "${RUNNER_TEMP}/k6-api.pid"

      - name: Run k6 API smoke (operator path)
        env:
          ARCHLUCID_BASE_URL: http://127.0.0.1:5128
          K6_SCENARIO: smoke
          K6_SUMMARY_PATH: ${{ runner.temp }}/k6-api-smoke-summary.json
          # Core Pilot operator-path smoke budgets (aligned with docs/library/API_SLOS.md tiers â€” informational for CI).
          ARCHLUCID_K6_P95_HEALTH_READY_MS: "1200"
          ARCHLUCID_K6_P95_TIER2_MS: "928"
          ARCHLUCID_K6_P95_TIER3_MS: "6600"
          ARCHLUCID_K6_HTTP_FAIL_RATE_MAX: "0.02"
          ARCHLUCID_K6_SMOKE_VUS: "1"
        run: |
          set -e
          k6 run "${GITHUB_WORKSPACE}/tests/load/k6-api-smoke.js"

      # WARN: per-tag p95 budget drift. Informational so a small perf regression does not block a deploy;
      # review the annotations and decide. The catastrophic-cliff step below still blocks a truly broken API.
      - name: Assert k6 API smoke thresholds (Core Pilot operator-path budgets — warn on drift)
        continue-on-error: true
        env:
          ARCHLUCID_K6_P95_HEALTH_READY_MS: "1200"
          ARCHLUCID_K6_P95_TIER2_MS: "928"
          ARCHLUCID_K6_P95_TIER3_MS: "6600"
        run: >
          python3 scripts/ci/assert_k6_ci_smoke_summary.py
          "${{ runner.temp }}/k6-api-smoke-summary.json"
          --max-failed-rate 0.02
          --max-p95-ms 2000
          --per-tag-k6-api-smoke

      # GATE: catastrophic cliff only (overall p95 > 20s OR > 50% requests failing). This is a broken/hung
      # API, not perf drift — block the build. Tune in docs/library/LOAD_TEST_BASELINE.md if budgets change.
      - name: Assert k6 API smoke catastrophic cliff (blocking)
        run: >
          python3 scripts/ci/assert_k6_ci_smoke_summary.py
          "${{ runner.temp }}/k6-api-smoke-summary.json"
          --max-failed-rate 0.5
          --max-p95-ms 20000

      - name: k6 API smoke summary (job log)
        run: python3 scripts/ci/print_k6_summary_metrics.py "${{ runner.temp }}/k6-api-smoke-summary.json"

      - name: Upload k6 API smoke summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-smoke-results
          path: ${{ runner.temp }}/k6-api-smoke-summary.json
          if-no-files-found: warn

      - name: Upload k6 API log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-smoke-api-log
          path: ${{ runner.temp }}/k6-api.log
          if-no-files-found: warn

      - name: Stop ArchLucid.Api (background)
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/k6-api.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/k6-api.pid")" 2>/dev/null || true
          fi

  # k6 CI smoke: read + write API paths. Merge-blocking: k6 thresholds in tests/load/ci-smoke.js (p95 per tag + http_req_failed) +
  # scripts/ci/assert_k6_ci_smoke_summary.py duplicate gate; env vars documented in docs/library/API_SLOS.md + LOAD_TEST_BASELINE.md.
  k6-ci-smoke:
    name: "Performance: k6 CI smoke (read + write baseline)"
    needs: dotnet-fast-core
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build API (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Api/ArchLucid.Api.csproj --no-restore -c Release

      - name: Install k6
        shell: bash
        run: bash scripts/ci/install_k6_apt.sh

      - name: Wait for SQL Server to be ready
        uses: ./.github/actions/wait-for-sqlserver

      - name: Create catalog + start API (shared script)
        run: bash scripts/ci/start_api_for_k6.sh ArchLucidK6CiSmoke "${RUNNER_TEMP}/k6-ci-api.log" "${RUNNER_TEMP}/k6-ci-api.pid"

      - name: Run k6 CI smoke
        env:
          BASE_URL: http://127.0.0.1:5128
          # Aligned with docs/library/API_SLOS.md Tier 1/2/3 p95; tests/load/ci-smoke.js + assert_k6_ci_smoke_summary.py â€” override in fork for noisy runners only.
          ARCHLUCID_K6_P95_HEALTH_LIVE_MS: "300"
          ARCHLUCID_K6_P95_HEALTH_READY_MS: "1200"
          ARCHLUCID_K6_P95_TIER2_MS: "928"
          ARCHLUCID_K6_P95_TIER3_MS: "6600"
          ARCHLUCID_K6_HTTP_FAIL_RATE_MAX: "0.02"
        run: |
          set -e
          k6 run "${GITHUB_WORKSPACE}/tests/load/ci-smoke.js" --summary-export "${RUNNER_TEMP}/k6-ci-summary.json"

      # WARN: per-tag p95 budget drift (see k6-smoke-api for rationale). Catastrophic-cliff step below still blocks.
      - name: Assert k6 CI smoke thresholds (per-tag p95 + failed rate — warn on drift)
        continue-on-error: true
        run: python3 scripts/ci/assert_k6_ci_smoke_summary.py "${RUNNER_TEMP}/k6-ci-summary.json" --max-failed-rate 0.02 --max-p95-ms 3000 --per-tag-ci-smoke

      # GATE: catastrophic cliff only (overall p95 > 20s OR > 50% requests failing) — a broken/hung API blocks.
      - name: Assert k6 CI smoke catastrophic cliff (blocking)
        run: python3 scripts/ci/assert_k6_ci_smoke_summary.py "${RUNNER_TEMP}/k6-ci-summary.json" --max-failed-rate 0.5 --max-p95-ms 20000

      - name: k6 CI smoke summary (job log)
        run: python3 scripts/ci/print_k6_summary_metrics.py "${RUNNER_TEMP}/k6-ci-summary.json"

      - name: Upload k6 CI smoke summary
        if: always()
