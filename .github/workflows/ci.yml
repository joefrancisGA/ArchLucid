      - name: Upload Playwright test-results (traces)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-extended-test-results-${{ matrix.shard }}
          path: archlucid-ui/test-results
          if-no-files-found: warn

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-extended-blob-report-${{ matrix.shard }}
          path: archlucid-ui/blob-report
          if-no-files-found: warn

      - name: Upload live API log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-e2e-live-extended-api-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/live-api-extended.log
