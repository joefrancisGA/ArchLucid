          echo $! > "${RUNNER_TEMP}/live-api-extended.pid"

      - name: Wait for API readiness
        env:
          API_URL: http://127.0.0.1:5128
        run: bash scripts/ci/wait-for-api-ready.sh "${RUNNER_TEMP}/live-api-extended.log"

