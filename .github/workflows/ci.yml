          if-no-files-found: warn

  dotnet-coverage-merge:
    name: ".NET: merge coverage + gates"
    needs:
      - dotnet-full-regression-core-api-integration
      - dotnet-full-regression-core-api-unit
      - dotnet-full-regression-core-libs
      - dotnet-full-regression-slow-api
      - dotnet-full-regression-slow-domain
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - uses: actions/download-artifact@v6
        with:
          name: coverage-full-regression-core-api-integration
          path: merge-cov/core-api-integration

      - uses: actions/download-artifact@v6
        with:
          name: coverage-full-regression-core-api-unit
          path: merge-cov/core-api-unit

      - uses: actions/download-artifact@v6
        with:
          name: coverage-full-regression-core-libs
          path: merge-cov/core-libs

      - uses: actions/download-artifact@v6
        with:
          name: coverage-full-regression-slow-api
          path: merge-cov/slow-api
        continue-on-error: true

      - uses: actions/download-artifact@v6
        with:
          name: coverage-full-regression-slow-domain
          path: merge-cov/slow-domain
        continue-on-error: true

      - name: Merge coverage (HTML + GitHub job summary) + enforce gates
        if: success()
        run: |
          set -euo pipefail
          dotnet tool restore
          OUT="${{ runner.temp }}/coverage-report-full"
          mkdir -p "${{ runner.temp }}/coverage-merged-input"
          # Copy any downloaded Cobertura shards (slow shards may be absent if no matching tests ran).
          find merge-cov -type f -name 'coverage.cobertura.xml' -exec cp -t "${{ runner.temp }}/coverage-merged-input" {} +
          COV_DIR="${{ runner.temp }}/coverage-merged-input"
          if [ ! -d "$COV_DIR" ]; then
            echo "::error::Merged coverage staging missing: $COV_DIR"
            exit 1
          fi
          mapfile -d '' -t cov_files < <(find "$COV_DIR" -type f -name 'coverage.cobertura.xml' -print0)
          if [ "${#cov_files[@]}" -eq 0 ]; then
            echo "::error::No coverage.cobertura.xml files from regression shards."
            find merge-cov -type f 2>/dev/null | head -n 200 || true
            exit 1
          fi
          report_list=$(IFS=';'; printf '%s' "${cov_files[*]}")
          dotnet reportgenerator \
            "-reports:${report_list}" \
            "-targetdir:${OUT}" \
            "-reporttypes:Html;TextSummary;MarkdownSummaryGithub;Cobertura" \
            -verbosity:Info
          if [ ! -f "${OUT}/SummaryGithub.md" ]; then
            echo "::error::ReportGenerator did not write SummaryGithub.md under ${OUT}"
            ls -la "$OUT" || true
            exit 1
          fi
          cat "${OUT}/SummaryGithub.md" >> "${GITHUB_STEP_SUMMARY}"
          head -n 50 "${OUT}/Summary.txt" | grep -E 'Line coverage:|Branch coverage:' | sed 's/^[[:space:]]*//' > "${{ runner.temp }}/coverage-metrics.txt"
          ART_DIR="${{ runner.temp }}/coverage-metrics-artifact"
          mkdir -p "${ART_DIR}"
          # Merged line minimum is 95; full ratchet (.coverage-floor) is enabled.
          python3 scripts/ci/assert_merged_line_coverage_min.py \
            "${OUT}/Cobertura.xml" 95 \
            --min-branch-pct 63 \
            --min-package-line-pct 63 \
            --warn-below-package-line-pct 70 \
            --annotations-file "${ART_DIR}/coverage-annotations-assert.txt"
          python3 scripts/ci/assert_coverage_floor_ratchet.py \
            "${OUT}/Cobertura.xml"
          cp "${{ runner.temp }}/coverage-metrics.txt" "${ART_DIR}/coverage-metrics.txt"

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: coverage-metrics
          path: ${{ runner.temp }}/coverage-metrics-artifact/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: coverage-merged-cobertura
          path: ${{ runner.temp }}/coverage-report-full/Cobertura.xml
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: coverage-full-regression-merged-cobertura-files
          path: ${{ runner.temp }}/coverage-merged-input/**
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: coverage-report-full-regression-html
          path: ${{ runner.temp }}/coverage-report-full/**
          if-no-files-found: warn

      - name: Coverage line badge SVG (main push; shields.io) + publish to gh-pages branch
        if: >-
          success()
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          COV_OUT="${{ runner.temp }}/coverage-report-full"
          BADGE_ROOT="${{ runner.temp }}/coverage-badge-publish"
          BADGE_DIR="${BADGE_ROOT}/badges"
          mkdir -p "${BADGE_DIR}"
          python3 scripts/ci/fetch_coverage_badge_shields_svg.py \
            "${COV_OUT}/Cobertura.xml" \
            "${BADGE_DIR}/coverage.svg"

      - uses: actions/upload-artifact@v6
        if: >-
          success()
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: coverage-line-badge-svg
          path: ${{ runner.temp }}/coverage-badge-publish/badges/coverage.svg
          if-no-files-found: error

      - name: Deploy coverage badge — gh-pages badges path
        if: >-
          success()
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/coverage-badge-publish
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore: update coverage badge [skip ci]"

  # Polly Simmy chaos (LLM + SQL-fault + blob compositions). No SQL service container: Persistence
  # Simmy tests use synthetic SqlException and in-memory delegates only.
  #
  # Simmy chaos tests are CI-blocking; failures indicate resilience regressions.
  chaos-tests:
    name: "Resilience: Simmy chaos tests"
    needs:
      - dotnet-full-regression-core-complete
      - dotnet-full-regression-slow-api
      - dotnet-full-regression-slow-domain
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore ArchLucid.sln

      - name: Run AgentRuntime chaos tests
        run: >
          dotnet test ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj
          --no-restore -c Release
          --filter "FullyQualifiedName~Simmy|FullyQualifiedName~Chaos"
          --logger "trx;LogFileName=chaos-agent.trx"

      - name: Run Persistence chaos tests
        run: >
          dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj
          --no-restore -c Release
          --filter "FullyQualifiedName~Simmy|FullyQualifiedName~Chaos"
          --logger "trx;LogFileName=chaos-persistence.trx"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: chaos-test-results
          path: "**/*.trx"
          if-no-files-found: warn

  # Live Azure invoke (budget on your AOAI quota). Runs only after the OpenAPI snapshot job, merged line/branch gates,
  # and Simmy chaos are green (scheduled after `dotnet-coverage-merge` + `chaos-tests`, not on slow shards alone).
  dotnet-azure-openai-live-post-regression:
    name: ".NET optional: live Azure OpenAI (post regression + chaos)"
    needs:
      - openapi-contract-snapshot
      - dotnet-coverage-merge
      - chaos-tests
    # Fork PR workflows do not receive repository secrets — full CI only (`workflow_dispatch`).
    if: >-
      ${{ vars.ARCHLUCID_CI_REAL_AOAI_ENABLED == 'true'
          && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Fail fast when opted in but AOAI CI secrets missing
        env:
          AOAI_ENDPOINT: ${{ secrets.ARCHLUCID_CI_REAL_AOAI_ENDPOINT }}
          AOAI_KEY: ${{ secrets.ARCHLUCID_CI_REAL_AOAI_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AOAI_ENDPOINT:-}" ] || [ -z "${AOAI_KEY:-}" ]; then
            echo "::error::Set repository secrets ARCHLUCID_CI_REAL_AOAI_ENDPOINT and ARCHLUCID_CI_REAL_AOAI_KEY, or disable repository variable ARCHLUCID_CI_REAL_AOAI_ENABLED."
            exit 1
          fi

      - name: Restore and run live AOAI AgentRuntime integration
        env:
          ARCHLUCID_REAL_AOAI_TEST_ENDPOINT: ${{ secrets.ARCHLUCID_CI_REAL_AOAI_ENDPOINT }}
          ARCHLUCID_REAL_AOAI_TEST_KEY: ${{ secrets.ARCHLUCID_CI_REAL_AOAI_KEY }}
          ARCHLUCID_REAL_AOAI_TEST_DEPLOYMENT: ${{ vars.ARCHLUCID_CI_REAL_AOAI_DEPLOYMENT }}
        run: |
          set -euo pipefail
          dotnet restore ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj
          dotnet build ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj \
            --no-restore \
            -c Release \
            /p:SourceRevisionId=$(git rev-parse HEAD)
          dotnet test ArchLucid.AgentRuntime.Tests/ArchLucid.AgentRuntime.Tests.csproj \
            --no-build \
            -c Release \
            --filter "FullyQualifiedName~RealAzureOpenAIEndToEndTests" \
            --logger "trx;LogFilePrefix=live-aoai-"

  publish-api-client-nuget:
    name: "NuGet: pack & push API client (main/master)"
    needs: dotnet-coverage-merge
    if: >-
      github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore
        run: dotnet restore ArchLucid.Api.Client/ArchLucid.Api.Client.csproj

      - name: Pack ArchLucid.Api.Client
        run: |
          dotnet pack ArchLucid.Api.Client/ArchLucid.Api.Client.csproj \
            --no-restore \
            -c Release \
            -o "${RUNNER_TEMP}/nuget" \
            /p:SourceRevisionId=$(git rev-parse HEAD) \
            /p:ArchLucidApiClientPackageVersion=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v6
        with:
          name: archlucid-api-client-nupkg-ci
          path: ${{ runner.temp }}/nuget/*.nupkg

      - name: Push (NuGet.org)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "NUGET_API_KEY is not set; skipping NuGet push (artifact upload still contains the .nupkg)."
            exit 0
          fi
          dotnet nuget push "${RUNNER_TEMP}/nuget/"*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  coverage-pr-comment:
    # Runs after green full regression merge (`workflow_dispatch` full CI); comment steps are same-repo pull_request only.
    name: "PR: coverage comment"
    needs: dotnet-coverage-merge
    if: >-
      github.event_name != 'pull_request'
      && needs.dotnet-coverage-merge.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Decide whether to post PR comment
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "post=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull request; skipping sticky comment."
          elif [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "post=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR; skipping sticky comment (token scope)."
          else
            echo "post=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.post == 'true'

      - uses: actions/download-artifact@v6
        if: steps.gate.outputs.post == 'true'
        with:
          name: coverage-metrics
          path: head-metrics

      - uses: actions/download-artifact@v6
        continue-on-error: true
        if: steps.gate.outputs.post == 'true'
        with:
          name: coverage-merged-cobertura
          path: head-cobertura

      - name: Download base branch coverage metrics (optional)
        continue-on-error: true
        if: steps.gate.outputs.post == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          workflow: ci.yml
          workflow_conclusion: success
          branch: ${{ github.event.pull_request.base.ref }}
          name: coverage-metrics
          path: base-metrics
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Build comment body
        id: cov
        if: steps.gate.outputs.post == 'true'
        env:
          HEAD_FILE: head-metrics/coverage-metrics.txt
          BASE_FILE: base-metrics/coverage-metrics.txt
          COBERTURA_FILE: head-cobertura/Cobertura.xml
          ANNOTATIONS_FILE: head-metrics/coverage-annotations.txt
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/ci/build_coverage_pr_comment.py
          if [ -f head-metrics/coverage-annotations-assert.txt ]; then
            cat head-metrics/coverage-annotations-assert.txt >> head-metrics/coverage-annotations.txt
          fi
          if [ -f head-metrics/coverage-annotations.txt ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              echo "::warning::$line"
            done < head-metrics/coverage-annotations.txt
          fi

      - uses: marocchino/sticky-pull-request-comment@v3
        if: steps.gate.outputs.post == 'true'
        with:
          header: archlucid-coverage
          recreate: true
          number: ${{ github.event.pull_request.number }}
          message: ${{ steps.cov.outputs.body }}

  docker-build-smoke:
    name: "Containers: Docker build smoke"
    needs: gitleaks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      # cache-from always (fork PRs may read base-branch cache). cache-to only on push to main/master
      # — fork PR workflows get a read-only token and fail if we always pass cache-to.
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Assert unique Next.js App Router paths (route-group collision guard)
        run: python3 scripts/ci/assert_archlucid_ui_app_router_unique_paths.py

      - name: Assert Persistence Pilots sources for API Docker context
        run: python3 scripts/ci/assert_persistence_pilots_docker_context.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prefetch Microsoft .NET base images (MCR + BuildKit HEAD 403 mitigation)
        run: bash scripts/ci/prefetch-docker-dotnet-base-images.sh

      - name: Decide whether to write BuildKit GHA cache
        id: gha_cache_write
        run: |
          if { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; } \
            && { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build API image (read/write GHA cache)
        if: steps.gha_cache_write.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ArchLucid.Api/Dockerfile
          tags: archlucid-api:ci
          load: true
          pull: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api-docker-smoke-v2
          cache-to: type=gha,scope=api-docker-smoke-v2,mode=max

      - name: Build API image (read-only GHA cache)
        if: steps.gha_cache_write.outputs.enabled != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ArchLucid.Api/Dockerfile
          tags: archlucid-api:ci
          load: true
          pull: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api-docker-smoke-v2

      - name: Build Operator UI image (read/write GHA cache)
        if: steps.gha_cache_write.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: archlucid-ui/Dockerfile
          tags: archlucid-ui:ci
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ui-docker-smoke
          cache-to: type=gha,scope=ui-docker-smoke,mode=max

      - name: Build Operator UI image (read-only GHA cache)
        if: steps.gha_cache_write.outputs.enabled != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: archlucid-ui/Dockerfile
          tags: archlucid-ui:ci
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ui-docker-smoke

      - name: Install Trivy CLI
        uses: ./.github/actions/install-trivy
        with:
          version: v0.69.3

      - name: Trivy scan API image (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: archlucid-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          cache: false

      - name: Trivy scan Operator UI image (CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: archlucid-ui:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          cache: false

  ui-unit:
    name: "Operator UI: unit (Vitest)"
