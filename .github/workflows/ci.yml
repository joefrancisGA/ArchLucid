              --results-directory "${{ runner.temp }}/coverage-full-slow-domain" \
              --logger "trx;LogFilePrefix=full-slow-domain-" \
              --diag "$diag" \
              --blame-hang --blame-hang-timeout 90min
          done

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dotnet-trx-full-slow-domain
