  ui-playwright-mock-smoke:
    name: "Operator UI: Playwright mock functional (mock API)"
    needs: gitleaks
    if: github.event_name != 'pull_request'
    # Mock journey specs (`e2e/`, `chromium` project). Accessibility scans: job `ui-playwright-accessibility`. Optional visual goldens: `npm run test:e2e:mock:visual` — see playwright.mock.config.ts.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Mock Playwright suite (functional mock specs; excludes visual project)
        working-directory: archlucid-ui
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144
