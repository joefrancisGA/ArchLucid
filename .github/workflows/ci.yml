          ARCHLUCID_DEMO_WORKSPACES_MANIFEST: fixtures/demo-workspaces/demo-workspaces.fixture.manifest.json
        run: bash scripts/ci/wait-for-demo-preview.sh

      - name: Wait for DB-backed pilot-run-deltas (extended live smokes)
        env:
