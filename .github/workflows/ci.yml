          bash ../scripts/ci/wait-for-api-ready.sh "${ARCHLUCID_API_LOG_FILE}"
          bash ../scripts/ci/wait-for-db-backed-pilot-endpoint.sh
          echo "Playwright extended live e2e shard ${{ matrix.shard }}/${{ strategy.job-total }} start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
