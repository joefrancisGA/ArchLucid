          LIVE_JWT_TOKEN: ""
          LIVE_API_KEY: ""
          LIVE_API_KEY_READONLY: ""
          E2E_INFRA_MAX_ATTEMPTS: "12"
          E2E_INFRA_DB_MAX_ATTEMPTS: "25"
          E2E_INFRA_BASE_DELAY_MS: "1000"
          E2E_INFRA_PROBE_ATTEMPTS: "45"
          ARCHLUCID_DEMO_WORKSPACES_MANIFEST: fixtures/demo-workspaces/demo-workspaces.fixture.manifest.json
        run: |
