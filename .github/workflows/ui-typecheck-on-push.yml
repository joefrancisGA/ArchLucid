# Thin master/main push corset — blocking UI typecheck only (WK-11).
# Full CI matrix remains pull_request + workflow_dispatch in ci.yml.
name: UI typecheck on push

on:
  push:
    branches: [main, master]

concurrency:
  group: ui-typecheck-push-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: "Security: gitleaks (secret scan)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: gacts/gitleaks@v1.3.2
        with:
          version: "8.30.1"
          config-path: .gitleaks.toml

  ui-typecheck:
    name: "Operator UI: typecheck (blocking)"
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Install and typecheck
        working-directory: archlucid-ui
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
          npm run typecheck
