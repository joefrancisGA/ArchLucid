# Thin master/main push corset — gitleaks, OpenAPI v1 snapshot, dotnet build + Core/Decisioning
# fast-core tests, UI typecheck, beta-readiness guards (WK-11 / WK-09).
# Full CI matrix remains pull_request + workflow_dispatch in ci.yml.
name: UI typecheck on push

on:
  push:
    branches: [main, master]

concurrency:
  # One running + one pending per ref group: cancel-in-progress protects only the running job,
  # so queued runs are evicted on every new push. Per-commit groups let each push complete.
  group: ui-typecheck-push-${{ github.sha }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_FAST_CORE_TEST_FILTER: Suite=Core&Category!=Slow&Category!=Integration&Category!=GoldenCorpusRecord&FullyQualifiedName!~OpenApiContractSnapshotTests&FullyQualifiedName!~OpenApiBuyerContractSnapshotTests

jobs:
  gitleaks:
    name: "Security: gitleaks (secret scan)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: gacts/gitleaks@v1.3.3
        with:
          version: "8.30.1"
          config-path: .gitleaks.toml

  dotnet-push-corset:
    name: ".NET: push corset (build + fast core Core/Decisioning)"
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Build Active solution and run Core/Decisioning fast-core tests
        run: bash scripts/ci/run_push_corset_dotnet.sh

  openapi-contract-snapshot:
    name: ".NET: OpenAPI v1 contract snapshot (fail-fast)"
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Build + OpenAPI contract snapshot tests (v1 + buyer)
        env:
          ARCHLUCID_OPENAPI_SNAPSHOT_ARTIFACT_PATH: ${{ runner.temp }}/openapi-contract/openapi-v1.generated.canonical.json
        run: bash scripts/ci/check_openapi_contract_snapshot.sh

      - name: Upload generated OpenAPI contract artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-v1-generated-canonical-push
          path: ${{ runner.temp }}/openapi-contract/openapi-v1.generated.canonical.json
          if-no-files-found: warn
          retention-days: 14

  beta-readiness-guards:
    name: "CI: beta-readiness wiring guards"
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Sponsor export + private-beta + release-gate + insight-density guards
        run: |
          python3 scripts/ci/check_no_merge_conflict_markers.py
          python3 scripts/ci/check_sponsor_export_execution_mode_label.py
          python3 scripts/ci/check_live_api_private_beta_access_ci_wiring.py
          python3 scripts/ci/check_ui_jwt_bearer_build_on_push_corset.py
          python3 scripts/ci/check_push_corset_openapi_snapshot.py
          python3 scripts/ci/check_api_types_package_in_sync.py
          python3 scripts/ci/check_release_gate_playwright_wiring.py
          python3 scripts/ci/check_insight_density_advisory_surfaces.py
          python3 scripts/ci/check_policy_pack_finding_delta_offline_packet.py

      - name: Beta-readiness guard unit tests
        run: |
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_no_merge_conflict_markers.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_sponsor_export_execution_mode_label.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_live_api_private_beta_access_ci_wiring.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_ui_jwt_bearer_build_on_push_corset.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_push_corset_openapi_snapshot.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_api_types_package_in_sync.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_release_gate_playwright_wiring.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_insight_density_advisory_surfaces.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_golden_cohort_gate_ruleset_batch.py"
          python3 -m unittest discover -s scripts/ci/tests -p "test_check_policy_pack_finding_delta_offline_packet.py"

  ui-typecheck:
    name: "Operator UI: typecheck (blocking)"
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Install and typecheck
        working-directory: archlucid-ui
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
          python3 ../scripts/ci/assert_single_npm_dependency_version.py @tanstack/query-core --prefix .
          npm run typecheck

  ui-jwt-bearer-build:
    name: "Operator UI: jwt-bearer production build (blocking)"
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Install UI deps & build Next (standalone, jwt-bearer client)
        working-directory: archlucid-ui
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_E2E_ALLOW_DEMO_BLOCKED_ROUTES: "1"
          NEXT_PUBLIC_ARCHLUCID_AUTH_MODE: jwt-bearer
        run: |
          npm ci
          npm run build
