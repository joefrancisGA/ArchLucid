name: RC49 Stabilization Controller
# Manual-only RC49 CI decision workflow. No schedule, workflow_run, or commit-marker
# automation may launch comprehensive RC49 CI without an explicit user dispatch.
on:
  workflow_dispatch:
    inputs:
      ready_sha:
        description: "Exact reviewed RC49 HEAD SHA to authorize (required for a build)"
        required: true
        type: string
      apply:
        description: "Explicitly permit dispatch/cancel actions; unchecked is dry-run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write
concurrency:
  group: rc49-stabilization-controller
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: RC49
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate controller
        run: python -m unittest discover -s scripts/ci/tests -p test_rc49_ci_controller.py
      - name: Observe or explicitly apply RC49 policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READY_SHA: ${{ inputs.ready_sha }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--repo "${{ github.repository }}" --ready-sha "$READY_SHA")
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          python scripts/ci/rc49_ci_controller.py "${args[@]}"
