name: ArchLucid SQL and vector capacity evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]
    paths:
      - 'ArchLucid.Retrieval/**'
      - 'ArchLucid.Retrieval.Tests/**'
      - 'ArchLucid.Persistence.Tests/SqlCapacityBenchmarkTests.cs'
      - 'ArchLucid.Persistence/InfraEvidence/**'
      - 'ArchLucid.Persistence.Tests/InfraEvidence/**'
      - 'scripts/ci/report_archlucid_capacity_trx.py'
      - 'scripts/ci/test_report_archlucid_capacity_trx.py'
      - '.github/workflows/archlucid-sql-vector-capacity.yml'

permissions:
  contents: read

jobs:
  capacity-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'LocalTesting123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -b -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: ./.github/actions/wait-for-sqlserver
      - name: Run in-memory vector search contract suite
        run: >-
          dotnet test ArchLucid.Retrieval.Tests/ArchLucid.Retrieval.Tests.csproj -c Release
          --filter 'FullyQualifiedName~RetrievalQueryServiceTests'
          --logger 'trx;LogFileName=archlucid-vector-capacity.trx'
      - name: Run bounded SQL-backed snapshot path read suite
        env:
          ARCHLUCID_SQL_TEST: 'Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests'
        run: >-
          dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj -c Release
          --filter 'FullyQualifiedName~SqlSecurityEvidencePathRepositorySqlIntegrationTests'
          --logger 'trx;LogFileName=archlucid-sql-capacity.trx'
      - name: Dedicated seeded vector capacity probes
        env:
          ARCHLUCID_CAPACITY_BENCH_OUTPUT: ${{ github.workspace }}/artifacts/capacity/dedicated
        run: >-
          dotnet test ArchLucid.Retrieval.Tests/ArchLucid.Retrieval.Tests.csproj -c Release
          --filter 'FullyQualifiedName~VectorCapacityBenchmarkTests'
          --logger 'trx;LogFileName=archlucid-vector-dedicated.trx'
      - name: Dedicated indexed SQL capacity probes
        env:
          ARCHLUCID_SQL_TEST: 'Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests'
          ARCHLUCID_CAPACITY_BENCH_OUTPUT: ${{ github.workspace }}/artifacts/capacity/dedicated
        run: >-
          dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj -c Release
          --filter 'FullyQualifiedName~SqlCapacityBenchmarkTests'
          --logger 'trx;LogFileName=archlucid-sql-dedicated.trx'
      - name: Benchmark real scoped SQL evidence path repository
        env:
          ARCHLUCID_SQL_TEST: 'Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidPersistenceTests'
          ARCHLUCID_CAPACITY_BENCH_OUTPUT: ${{ github.workspace }}/artifacts/capacity/dedicated
        run: >-
          dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj -c Release
          --filter 'FullyQualifiedName~Benchmark_real_scoped_path_repository_reads'
          --logger 'trx;LogFileName=archlucid-repository-dedicated.trx'
      - name: Validate timing reporter
        run: python3 -m unittest scripts.ci.test_report_archlucid_capacity_trx
      - name: Publish non-calibrated suite timings
        if: always()
        run: |
          python3 scripts/ci/report_archlucid_capacity_trx.py \
            --vector ArchLucid.Retrieval.Tests/TestResults/archlucid-vector-capacity.trx \
            --sql ArchLucid.Persistence.Tests/TestResults/archlucid-sql-capacity.trx \
            --output artifacts/capacity/sql-vector-suite-timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archlucid-sql-vector-suite-timings
          path: |
            **/TestResults/archlucid-*-capacity.trx
            artifacts/capacity/sql-vector-suite-timing.json
            artifacts/capacity/dedicated/*.json
            **/TestResults/archlucid-*-dedicated.trx
          if-no-files-found: warn
