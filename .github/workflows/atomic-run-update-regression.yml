name: Atomic run update regression

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Persistence/Repositories/SqlRunRepository.Write.Save.cs'
      - 'ArchLucid.Persistence/Sql/RunRepositorySql.ArchiveAndExistence.cs'
      - 'scripts/ci/tests/test_atomic_run_update.py'
      - '.github/workflows/atomic-run-update-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/ci/tests -p test_atomic_run_update.py -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ArchLucid.Persistence/ArchLucid.Persistence.csproj --configuration Release
