name: assessment-score-guard

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'docs/assessments/**'
      - 'scripts/ci/check_assessment_score_consistency.py'
      - 'scripts/ci/tests/test_check_assessment_score_consistency.py'

jobs:
  check-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run assessment score consistency unit tests
        run: python3 -m pytest scripts/ci/tests/test_check_assessment_score_consistency.py -q

      - name: Check tracked assessment score consistency
        run: python3 scripts/ci/check_assessment_score_consistency.py --file docs/assessments/LATEST_GPT55.md
