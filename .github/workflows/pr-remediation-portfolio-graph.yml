name: Remediation portfolio graph contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/pr-remediation-portfolio-graph.yml'
      - 'ArchLucid.Application/InfraEvidence/RemediationPortfolio/**'
      - 'ArchLucid.Application/InfraEvidence/RemediationPatterns/**'
      - 'ArchLucid.Application/InfraEvidence/SecureNowArchitect/*CutPoint*.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/RemediationPortfolioGraphTests.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/RemediationPortfolioOptimizationTests.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/RemediationPortfolioImpactTests.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/RemediationPortfolioBenchmarkTests.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/RemediationPortfolioEffectivenessTests.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/RemediationInstanceVerificationEvaluator*Tests.cs'
      - 'ArchLucid.Application/InfraEvidence/RemediationInstances/RemediationInstanceVerificationEvaluator.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/RemediationPatternMatcherServiceTests.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/CutPointAnalysisEngineTests.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/RemediationPrioritization*Tests.cs'
      - 'docs/assurance/FND088_REMEDIATION_PORTFOLIO_GRAPH.md'
      - 'docs/assurance/FND089_REMEDIATION_PORTFOLIO_OPTIMIZER.md'
      - 'docs/assurance/FND090_OFFLINE_PORTFOLIO_IMPACT.md'
      - 'docs/assurance/FND093_PORTFOLIO_ASSURANCE.md'

permissions:
  contents: read

concurrency:
  group: remediation-portfolio-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  graph-contract:
    name: Verify scoped evidence, distinct coverage, and feasible portfolios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run focused Release tests
        env:
          FND093_BENCHMARK_REPORT: ${{ runner.temp }}/remediation-portfolio-graph/fnd093-benchmark.json
        run: >-
          dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj -c Release
          --filter 'FullyQualifiedName~RemediationPortfolioGraphTests|FullyQualifiedName~RemediationPortfolioOptimizationTests|FullyQualifiedName~RemediationPortfolioImpactTests|FullyQualifiedName~RemediationPortfolioBenchmarkTests|FullyQualifiedName~RemediationPortfolioEffectivenessTests|FullyQualifiedName~RemediationInstanceVerificationEvaluatorPropertyTests|FullyQualifiedName~RemediationInstanceVerificationEvaluatorPathTests|FullyQualifiedName~RemediationPatternMatcherServiceTests|FullyQualifiedName~CutPointAnalysisEngineTests|FullyQualifiedName~RemediationPrioritizationAndWaveServiceTests|FullyQualifiedName~RemediationPrioritizationRankBatchTests'
          --results-directory "$RUNNER_TEMP/remediation-portfolio-graph"
          --logger 'trx;LogFileName=application.trx'
      - name: Require executed passing tests
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          result = Path(os.environ["RUNNER_TEMP"]) / "remediation-portfolio-graph" / "application.trx"
          root = ElementTree.parse(result)
          counters = root.find(".//{*}Counters")
          if counters is None:
              raise SystemExit("Test result does not contain counters")
          total, executed, passed = (int(counters.attrib[key]) for key in ("total", "executed", "passed"))
          if not total or total != executed or executed != passed:
              raise SystemExit(f"total={total}, executed={executed}, passed={passed}")
          executed_ids = {
              item.attrib.get("testId")
              for item in root.findall(".//{*}Results/{*}UnitTestResult")
              if item.attrib.get("outcome") == "Passed"
          }
          for suite in (
              "RemediationPortfolioGraphTests", "RemediationPortfolioOptimizationTests",
              "RemediationPortfolioImpactTests", "RemediationPortfolioBenchmarkTests", "RemediationPortfolioEffectivenessTests",
          ):
              suite_ids = {
                  unit.attrib["id"]
                  for unit in root.findall(".//{*}TestDefinitions/{*}UnitTest")
                  if (method := unit.find("{*}TestMethod")) is not None
                  and method.attrib.get("className", "").endswith("." + suite)
              }
              if not executed_ids.intersection(suite_ids):
                  raise SystemExit(f"No {suite} tests executed")
          benchmark = json.loads(result.with_name("fnd093-benchmark.json").read_text(encoding="utf-8"))
          if benchmark["CohortVersion"] != "FND093-synthetic-estates-v1" or {
              row["FixtureId"] for row in benchmark["Measurements"]
          } != {"small", "medium", "large-constrained"}:
              raise SystemExit("FND-093 benchmark evidence does not cover the expected cohort")
          if not all(row["FeasibleAndWithinExpectedQuality"] for row in benchmark["Measurements"]):
              raise SystemExit("FND-093 benchmark evidence failed feasibility or quality")
          print(f"{passed} tests passed")
          PY
      - name: Publish reproducible portfolio assurance evidence
        uses: actions/upload-artifact@v7
        with:
          name: remediation-portfolio-assurance
          path: |
            ${{ runner.temp }}/remediation-portfolio-graph/application.trx
            ${{ runner.temp }}/remediation-portfolio-graph/fnd093-benchmark.json
          if-no-files-found: error
