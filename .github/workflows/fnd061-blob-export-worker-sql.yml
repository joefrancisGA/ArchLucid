name: FND-061 Blob Export Worker SQL

on:
  pull_request:
    branches: [master, main, RC49]
    paths:
      - 'ArchLucid.Persistence/Migrations/*RunExportBlobPush*.sql'
      - 'ArchLucid.Persistence/Coordination/Export/*RunExportBlobPush*.cs'
      - 'ArchLucid.Persistence/Orchestration/DapperAuthorityPipelineWorkRepository.cs'
      - 'ArchLucid.Persistence/Data/Repositories/EvidenceBundleRepository.cs'
      - 'ArchLucid.Persistence.Tests/Contracts/*EvidenceBundleRepositoryContractTests.cs'
      - 'ArchLucid.Persistence.Tests/Coordination/SqlQueueClaimsSnapshotIsolationTests.cs'
      - '.github/workflows/fnd061-blob-export-worker-sql.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  requester-binding-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-authorization-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-authorization-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify worker requester bindings and scoped authority claims on isolated SQL Server
        shell: bash
        run: |
          set -euo pipefail
          pw="Fnd061!$(openssl rand -hex 20)"
          echo "::add-mask::$pw"
          trap 'docker rm -f fnd061-blob-export-sql >/dev/null 2>&1 || true' EXIT
          export MSSQL_SA_PASSWORD="$pw"
          docker run -d --name fnd061-blob-export-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD \
            -e MSSQL_PID=Developer -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          ready=false
          for attempt in {1..45}; do
            if docker exec fnd061-blob-export-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$pw" \
                -C -b -Q "SELECT 1" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs --tail 40 fnd061-blob-export-sql
            exit 1
          fi
          export ARCHLUCID_SQL_TEST="Server=127.0.0.1,1433;Database=ArchLucidFnd061WorkerTests;User ID=sa;Password=$pw;Encrypt=True;TrustServerCertificate=True"
          dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj -c Release \
            --filter 'FullyQualifiedName~Blob_export_claim_preserves_new_requester_binding_and_skips_legacy_rows|FullyQualifiedName~Authority_pipeline_claim_does_not_return_or_lease_foreign_payloads|FullyQualifiedName~DapperEvidenceBundleRepositoryContractTests.Deferred_bundle_binding_rejects_foreign_run_and_scope_and_survives_content_updates' \
            --logger 'trx;LogFileName=fnd061-worker-sql.trx'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          expected = {
              "SqlQueueClaimsSnapshotIsolationTests.Blob_export_claim_preserves_new_requester_binding_and_skips_legacy_rows",
              "SqlQueueClaimsSnapshotIsolationTests.Authority_pipeline_claim_does_not_return_or_lease_foreign_payloads",
              "DapperEvidenceBundleRepositoryContractTests.Deferred_bundle_binding_rejects_foreign_run_and_scope_and_survives_content_updates",
          }
          trx = ET.parse("ArchLucid.Persistence.Tests/TestResults/fnd061-worker-sql.trx")
          definitions = {}
          for unit in trx.findall(".//{*}UnitTest"):
              method = unit.find("{*}TestMethod")
              if method is not None:
                  cls = method.attrib["className"].split(",", 1)[0].rsplit(".", 1)[-1]
                  definitions[unit.attrib["id"]] = f"{cls}.{method.attrib['name']}"
          for name in sorted(expected):
              outcomes = [row.get("outcome") for row in trx.findall(".//{*}UnitTestResult")
                          if definitions.get(row.get("testId")) == name or (row.get("testName") or "").endswith("." + name)]
              if outcomes != ["Passed"]:
                  raise SystemExit(f"Expected one passed SQL execution for {name}; found {outcomes}")
          PY
