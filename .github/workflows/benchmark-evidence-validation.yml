name: Benchmark evidence validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'scripts/ci/compare_benchmark_baseline.py'
      - 'scripts/ci/tests/test_compare_benchmark_evidence.py'
      - '.github/workflows/benchmark-evidence-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/ci/tests -p test_compare_benchmark_evidence.py -v
