name: FND-010 Independent Integrity Monitor Contract
on:
  pull_request:
    branches: [master, main, architecture/fnd010-managed-checkpoint-retention]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install 'cryptography>=44,<47' 'azure-identity>=1.17,<2' 'azure-keyvault-keys>=4.9,<5' 'azure-storage-blob>=12.20,<13'
      - name: Verify independent integrity monitor contract
        run: python -m unittest discover -s scripts/tests -p 'test_fnd010_integrity_monitor.py' -v
