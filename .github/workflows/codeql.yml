# Code scanning for C# (solution) and JavaScript/TypeScript (Operator UI).
# Keep heavyweight CodeQL off the high-churn PR hot path; run it on trunk, weekly, or manually.
name: CodeQL

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "12 9 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Operator UI package directory (`archlucid-ui/`; keep CodeQL source-root in sync with CI).
  ARCHLUCID_UI_DIR: archlucid-ui

concurrency:
  # Per-ref, cancel superseded runs. This replaces the 2026-08-27 per-SHA groups
  # (`codeql-${{ github.sha }}`, cancel-in-progress: false) that analyzed every
  # commit but filled the Actions queue. Trade-off: latest trunk/manual ref wins;
  # intermediate SHAs may never finish. See CODEQL_TRIAGE.md.
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  csharp:
    name: "CodeQL (csharp)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate CodeQL MaD model kinds
        run: python3 scripts/ci/validate_codeql_mad_kinds.py

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended
          # AlertSuppression binds // codeql[rule-id] comments into SARIF suppressions for assert_codeql_sarif_clean.py.
          packs: codeql/csharp-queries:AlertSuppression.ql
          config-file: ./.github/codeql/codeql-config.yml
          # Standalone C# extraction keeps CodeQL independent of a traced build.
          build-mode: none

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      # No traced build: standalone C# extraction. Restore keeps central package management + SDK (global.json) resolvable.
      - name: Restore .NET dependencies
        run: dotnet restore ArchLucid.sln

      # Emit workspace SARIF for a strict trunk/security gate.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: csharp-sarif

      - name: Fail on unresolved CodeQL C# SARIF findings
        run: python3 scripts/ci/assert_codeql_sarif_clean.py csharp-sarif

  javascript:
    name: "CodeQL (javascript)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify UI directory for CodeQL
        run: |
          if [ ! -d "${ARCHLUCID_UI_DIR}" ]; then
            echo "::error::Missing ${ARCHLUCID_UI_DIR}/ — update ARCHLUCID_UI_DIR in .github/workflows/codeql.yml if the UI folder was renamed."
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-extended
          packs: codeql/javascript-queries:AlertSuppression.ql
          source-root: ${{ env.ARCHLUCID_UI_DIR }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.ARCHLUCID_UI_DIR }}/package-lock.json

      - name: Install and build UI
        working-directory: ${{ env.ARCHLUCID_UI_DIR }}
        run: |
          npm ci
          npm run build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: javascript-sarif

      - name: Fail on unresolved CodeQL JavaScript SARIF findings
        run: python3 scripts/ci/assert_codeql_sarif_clean.py javascript-sarif
