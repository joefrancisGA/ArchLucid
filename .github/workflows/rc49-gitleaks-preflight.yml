name: RC49 GitLeaks preflight

on:
  pull_request:
    branches: [RC49]

permissions:
  contents: read

# Report findings before changes enter RC49, independently of serialized full CI.
concurrency:
  group: rc49-gitleaks-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install GitLeaks
        id: install
        uses: gacts/gitleaks@4fd785dcdaf557fda64e05b0ae033b8f7d82fb81 # v1.3.3
        with:
          version: "8.30.1"
          run: "false"

      - name: Scan proposed commits, or full history when scanner policy changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS: ${{ steps.install.outputs.gitleaks-bin }}
        run: |
          set -euo pipefail
          scope=()
          if git diff --quiet "$BASE_SHA" HEAD -- .gitleaks.toml .gitleaksignore .github/workflows/rc49-gitleaks-preflight.yml; then
            scope=(--log-opts="$BASE_SHA..HEAD")
          fi
          "$GITLEAKS" git --config .gitleaks.toml --redact --verbose "${scope[@]}" .
