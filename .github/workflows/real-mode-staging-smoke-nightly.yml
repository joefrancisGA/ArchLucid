# Nightly **staging** real-mode smoke (assessment improvement #7 — Tier 2).
#
# What it does:
#   1. Golden-cohort budget probe (Q15 kill-switch — $15/mo cap, 80% warn / 95% kill).
#   2. CLI smoke: `archlucid real-mode smoke --staging` (create → execute w/ pilot real header → poll).
#   3. On failure, posts a single line to STAGING_ONCALL_WEBHOOK_URL (soft no-op when unset).
#
# Opt-in: set repository variable ARCHLUCID_REAL_MODE_STAGING_SMOKE_ENABLED=true and secret
# ARCHLUCID_STAGING_SMOKE_API_KEY (service API key scoped to a smoke tenant on staging).
#
# Stop-and-ask boundaries:
#   - Do not provision Azure OpenAI or rotate production secrets from this workflow.
#   - Do not enable unattended runs until budget probe + staging key are validated manually once.
name: real-mode-staging-smoke-nightly

on:
  workflow_dispatch:
    inputs:
      override_api_base_url:
        description: "Override staging API base URL (default: https://staging.archlucid.net)."
        required: false
        type: string
      skip_budget_probe:
        description: "Skip budget probe (manual debugging only — not for scheduled runs)."
        type: boolean
        default: false
  schedule:
    - cron: "25 5 * * *"

permissions:
  contents: read

concurrency:
  group: real-mode-staging-smoke-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-mode-staging-smoke:
    if: github.event.repository.fork == false
    name: "Nightly: real-mode smoke — staging (budget-capped)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      ARCHLUCID_API_BASE_URL: ${{ inputs.override_api_base_url || vars.ARCHLUCID_STAGING_API_BASE_URL || 'https://staging.archlucid.net' }}
      ARCHLUCID_API_KEY: ${{ secrets.ARCHLUCID_STAGING_SMOKE_API_KEY }}
    steps:
      - name: Gate (opt-in var + staging API key)
        id: gate
        run: |
          if [ "${{ vars.ARCHLUCID_REAL_MODE_STAGING_SMOKE_ENABLED }}" != "true" ]; then
            echo "ARCHLUCID_REAL_MODE_STAGING_SMOKE_ENABLED is not true — exiting 0."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${ARCHLUCID_API_KEY:-}" ]; then
            echo "ARCHLUCID_STAGING_SMOKE_API_KEY secret is not set — exiting 0."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.skipped != 'true'

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.skipped != 'true'
        with:
          python-version: "3.12"

      - name: Install requests (budget probe)
        if: steps.gate.outputs.skipped != 'true' && inputs.skip_budget_probe != true
        run: python -m pip install --upgrade pip && pip install requests

      - name: Azure login (Cost Management / management plane)
        if: steps.gate.outputs.skipped != 'true' && inputs.skip_budget_probe != true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - id: budget
        name: Golden cohort budget probe ($15/mo cap, 80% warn / 95% kill)
        if: steps.gate.outputs.skipped != 'true' && inputs.skip_budget_probe != true
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARCHLUCID_GOLDEN_COHORT_AZURE_OPENAI_RESOURCE_ID: ${{ secrets.ARCHLUCID_GOLDEN_COHORT_AZURE_OPENAI_RESOURCE_ID }}
        run: bash scripts/ci/run_golden_cohort_budget_probe_ci.sh "Real-mode staging smoke"

      - name: Skip smoke when budget kill-switch tripped
        if: steps.gate.outputs.skipped != 'true' && inputs.skip_budget_probe != true && (steps.budget.outputs.exit_code == '2' || steps.budget.outputs.exit_code == '3')
        run: |
          echo "Budget probe exit ${{ steps.budget.outputs.exit_code }} — real-mode staging smoke skipped (workflow stays green)."

      - uses: actions/setup-dotnet@v6
        if: steps.gate.outputs.skipped != 'true' && (inputs.skip_budget_probe == true || steps.budget.outputs.exit_code == '0' || steps.budget.outputs.exit_code == '1')
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - name: Restore & build CLI (Release)
        if: steps.gate.outputs.skipped != 'true' && (inputs.skip_budget_probe == true || steps.budget.outputs.exit_code == '0' || steps.budget.outputs.exit_code == '1')
        run: |
          dotnet restore ArchLucid.Cli/ArchLucid.Cli.csproj
          dotnet build ArchLucid.Cli/ArchLucid.Cli.csproj --no-restore -c Release

      - name: archlucid real-mode smoke --staging (one-line PASS/FAIL)
        id: cli-smoke
        if: steps.gate.outputs.skipped != 'true' && (inputs.skip_budget_probe == true || steps.budget.outputs.exit_code == '0' || steps.budget.outputs.exit_code == '1')
        run: |
          set +e
          out="$(dotnet run --no-build -c Release --project ArchLucid.Cli/ArchLucid.Cli.csproj -- \
            real-mode smoke --staging 2>&1)"
          echo "$out"
          echo "cli_summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if echo "$out" | grep -q '^PASS '; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "result=fail" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Page on-call (placeholder webhook)
        if: failure() && steps.gate.outputs.skipped != 'true'
        env:
          STAGING_ONCALL_WEBHOOK_URL: ${{ secrets.STAGING_ONCALL_WEBHOOK_URL }}
          CLI_SUMMARY: ${{ steps.cli-smoke.outputs.cli_summary }}
          CLI_RESULT: ${{ steps.cli-smoke.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${STAGING_ONCALL_WEBHOOK_URL:-}" ]; then
            echo "STAGING_ONCALL_WEBHOOK_URL secret is not set — printing summary instead of paging."
            echo "cli_result=${CLI_RESULT:-unknown}"
            echo "run_url=${RUN_URL}"
            echo "cli_summary=${CLI_SUMMARY:-<none>}"
            exit 0
          fi
          payload=$(jq -n \
            --arg text "real-mode-staging-smoke FAILED — cli=${CLI_RESULT:-unknown}. Run: ${RUN_URL}. CLI: ${CLI_SUMMARY:-<none>}" \
            '{text: $text}')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$payload" "$STAGING_ONCALL_WEBHOOK_URL" || \
            echo "WARNING: on-call webhook POST failed (non-fatal — workflow already in failure state)."
