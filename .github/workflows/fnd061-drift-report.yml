name: FND-061 Drift report authorization

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Application/InfraEvidence/AzureInventoryDriftClassificationService.cs'
      - 'ArchLucid.Api.Tests/InfraEvidence/DriftReportCitedRunHttpTests.cs'
      - '.github/workflows/fnd061-drift-report.yml'
      - 'ArchLucid.Api/Controllers/InfraEvidence/InfraEvidenceInventoryController*.cs'
      - 'ArchLucid.Application/InfraEvidence/Mermaid/InfraEvidenceSnapshotSealedManifestHashGuard.cs'
      - 'ArchLucid.Application/InfraEvidence/IInfraEvidenceRunReadAccess.cs'
      - 'ArchLucid.Api/Support/AskEvidenceAccess.cs'
      - 'ArchLucid.Api/Support/*ShareAccessGate.cs'
      - 'ArchLucid.Persistence/InfraEvidence/SqlAzureInventoryDriftApprovalRepository.cs'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  drift-report-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-authorization-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-authorization-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: >-
          dotnet test ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj -c Release
          --filter 'FullyQualifiedName~DriftReportCitedRunHttpTests'
          --logger 'console;verbosity=normal'
