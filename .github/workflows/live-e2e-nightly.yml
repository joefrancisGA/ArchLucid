          LIVE_API_KEY_READONLY: nightly-apikey-readonly
          LIVE_E2E_SKIP_NEXT_BUILD: "1"
          LIVE_E2E_HARNESS_SECRET: "ci-live-e2e-harness-secret-min16!"
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-live-e2e-apikey-playwright-report
