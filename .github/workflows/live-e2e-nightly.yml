  live-e2e-nightly-jwt:
    if: github.event.repository.fork == false
    name: "Nightly: live-api full (JwtBearer + local PEM)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "LocalTesting123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalTesting123!' -C -Q \"SELECT 1\" || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5.2.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            global.json
            **/*.csproj

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: archlucid-ui/package-lock.json

      - name: Restore & build API (Release)
        run: |
          dotnet restore ArchLucid.sln
          dotnet build ArchLucid.Api/ArchLucid.Api.csproj --no-restore -c Release

      - name: Install UI deps & build Next (standalone)
        working-directory: archlucid-ui
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_E2E_ALLOW_DEMO_BLOCKED_ROUTES: "1"
        run: |
          npm ci
          npm run build

      - name: Generate RSA keys & PyJWT (nightly JWT mint)
        run: |
          set -e
          pip install --quiet PyJWT cryptography
          openssl genrsa -out "${RUNNER_TEMP}/nightly-jwt-priv.pem" 2048
          openssl rsa -in "${RUNNER_TEMP}/nightly-jwt-priv.pem" -pubout -out "${RUNNER_TEMP}/nightly-jwt-pub.pem"

      - name: Wait for SQL Server to be ready
        uses: ./.github/actions/wait-for-sqlserver

      - name: Create SQL catalog (JwtBearer nightly)
        run: |
          set -e
          docker run --rm --network host --entrypoint /opt/mssql-tools18/bin/sqlcmd \
            mcr.microsoft.com/mssql/server:2022-latest \
            -S 127.0.0.1,1433 -U sa -P 'LocalTesting123!' -C \
            -Q "IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name = N'ArchLucidLiveE2eNightlyJwt') CREATE DATABASE ArchLucidLiveE2eNightlyJwt;"

      - name: Start ArchLucid.Api (JwtBearer + local PEM)
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5128
          ConnectionStrings__ArchLucid: "Server=127.0.0.1,1433;User Id=sa;Password=LocalTesting123!;TrustServerCertificate=True;Initial Catalog=ArchLucidLiveE2eNightlyJwt"
          ArchLucid__StorageProvider: Sql
          ArchLucidAuth__Mode: JwtBearer
          ArchLucidAuth__Authority: ""
          ArchLucidAuth__Audience: ""
          ArchLucidAuth__JwtSigningPublicKeyPemPath: ${{ runner.temp }}/nightly-jwt-pub.pem
          ArchLucidAuth__JwtLocalIssuer: "https://nightly.archlucid.local"
          ArchLucidAuth__JwtLocalAudience: "api://archlucid-live-e2e-nightly-jwt"
          Authentication__ApiKey__DevelopmentBypassAll: "false"
          AgentExecution__Mode: Simulator
          RateLimiting__Registration__PermitLimit: "500"
          ArchLucid__E2eHarness__SharedSecret: "ci-live-e2e-harness-secret-min16!"
          Cors__AllowedOrigins__0: "http://127.0.0.1:3000"
          Cors__AllowedOrigins__1: "http://localhost:3000"
          DataConsistency__InitialDelaySeconds: "0"
          HostLeaderElection__Enabled: "false"
          Observability__ConsoleExporter__Enabled: "false"
        run: |
          set -e
          nohup dotnet run --no-build -c Release --project ArchLucid.Api/ArchLucid.Api.csproj > "${RUNNER_TEMP}/live-api-nightly-jwt.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/live-api-nightly-jwt.pid"

      - name: Wait for API readiness
        env:
          API_URL: http://127.0.0.1:5128
        run: bash scripts/ci/wait-for-api-ready.sh "${RUNNER_TEMP}/live-api-nightly-jwt.log"

      - name: Playwright full live suite (JwtBearer)
        working-directory: archlucid-ui
        env:
          CI: true
          LIVE_API_URL: http://127.0.0.1:5128
          LIVE_E2E_SKIP_NEXT_BUILD: "1"
          LIVE_E2E_HARNESS_SECRET: "ci-live-e2e-harness-secret-min16!"
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -e
          python3 "${GITHUB_WORKSPACE}/scripts/ci/mint_ci_jwt.py" \
            --private-key "${RUNNER_TEMP}/nightly-jwt-priv.pem" \
            --issuer "https://nightly.archlucid.local" \
            --audience "api://archlucid-live-e2e-nightly-jwt" \
            --out-token "${RUNNER_TEMP}/nightly-jwt-token.txt"
          python3 "${GITHUB_WORKSPACE}/scripts/ci/mint_ci_jwt.py" \
            --private-key "${RUNNER_TEMP}/nightly-jwt-priv.pem" \
            --issuer "https://nightly.archlucid.local" \
            --audience "api://archlucid-live-e2e-nightly-jwt" \
            --name "e2e-peer-reviewer" \
            --sub "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb" \
            --out-token "${RUNNER_TEMP}/nightly-jwt-peer-token.txt"
          python3 "${GITHUB_WORKSPACE}/scripts/ci/mint_ci_jwt.py" \
            --private-key "${RUNNER_TEMP}/nightly-jwt-priv.pem" \
            --issuer "https://nightly.archlucid.local" \
            --audience "api://archlucid-live-e2e-nightly-jwt" \
            --name "e2e-rejector" \
            --sub "eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee" \
            --out-token "${RUNNER_TEMP}/nightly-jwt-rejector-token.txt"
          TOKEN="$(tr -d '\n\r' < "${RUNNER_TEMP}/nightly-jwt-token.txt")"
          PEER_TOKEN="$(tr -d '\n\r' < "${RUNNER_TEMP}/nightly-jwt-peer-token.txt")"
          REJECTOR_TOKEN="$(tr -d '\n\r' < "${RUNNER_TEMP}/nightly-jwt-rejector-token.txt")"
          echo "::add-mask::${TOKEN}"
          echo "::add-mask::${PEER_TOKEN}"
          echo "::add-mask::${REJECTOR_TOKEN}"
          export LIVE_JWT_TOKEN="${TOKEN}"
          export LIVE_JWT_PEER_TOKEN="${PEER_TOKEN}"
          export LIVE_JWT_REJECTOR_TOKEN="${REJECTOR_TOKEN}"
          export ARCHLUCID_PROXY_BEARER_TOKEN="${TOKEN}"
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-live-e2e-jwt-playwright-report
          path: archlucid-ui/playwright-report
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-live-e2e-jwt-test-results
          path: archlucid-ui/test-results
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: nightly-live-e2e-jwt-blob-report
          path: archlucid-ui/blob-report
          if-no-files-found: warn

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: nightly-live-e2e-jwt-log
          path: ${{ runner.temp }}/live-api-nightly-jwt.log
          if-no-files-found: warn
