name: Evidence hub pagination regression

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Application/InfraEvidence/CloudResourceEvidenceHubService.cs'
      - 'ArchLucid.Application.Tests/InfraEvidence/CloudResourceEvidenceHubServiceTests.cs'
      - '**/CloudResourceAuditLineageResolver*.cs'
      - '**/SqlAuditEvidenceSnapshotRepository.cs'
      - '**/SqlCloudResourceIdentityDirectory.cs'
      - '**/SqlAuditEvidenceProjectIsolationTests.cs'
      - 'scripts/tests/test_evidence_hub_pagination_order.py'
      - '.github/workflows/evidence-hub-pagination-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify deterministic ordering before pagination
        run: python -m unittest discover -s scripts/tests -p test_evidence_hub_pagination_order.py -v
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run evidence hub behavioral regression
        run: dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj --configuration Release --filter 'FullyQualifiedName~CloudResourceEvidenceHubServiceTests|FullyQualifiedName~CloudResourceAuditLineageResolverTests' --logger 'console;verbosity=normal'

  focused-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Start disposable SQL Server
        shell: bash
        run: |
          set -euo pipefail
          password="InventoryProof!$(openssl rand -hex 20)"
          echo "::add-mask::$password"
          docker run -d --name hub-lineage-sql -e ACCEPT_EULA=Y \
            -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$password" \
            -p 127.0.0.1:1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          connection="Server=127.0.0.1,1433;Initial Catalog=ArchLucidPersistenceTests;User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5"
          echo "::add-mask::$connection"
          echo "ARCHLUCID_SQL_TEST=$connection" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if docker exec hub-lineage-sql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$password" -C -l 2 -b -Q 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Disposable SQL Server did not become ready"
          exit 1
      - name: Run project isolation and hub lineage on disposable SQL
        run: |
          dotnet test ArchLucid.Persistence.Tests/ArchLucid.Persistence.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~Architecture_links_are_visible_only_to_owning_project_and_foreign_writes_fail' \
            --logger 'trx;LogFileName=hub-lineage.trx' \
            --results-directory TestResults/hub-lineage
      - name: Require the SQL test to execute and pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse(Path("TestResults/hub-lineage/hub-lineage.trx")).getroot()
          rows = root.findall(".//{*}UnitTestResult")
          if len(rows) != 1 or rows[0].get("outcome") != "Passed":
              raise SystemExit("The disposable SQL isolation test did not execute and pass.")
          PY
      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f hub-lineage-sql || true
