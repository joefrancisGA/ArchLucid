# TB-907: scheduled near-expiry audit for Terraform-managed Key Vault secrets.
# Requires AZURE_CREDENTIALS (or OIDC) with Key Vault Secrets User on the target vault.
name: key-vault-expiration-audit (scheduled)

on:
  workflow_dispatch:
    inputs:
      vault_name:
        description: Key Vault name (not URI)
        required: true
        default: archlucid-kv
      days_ahead:
        description: Flag items expiring within this many days
        required: true
        default: "30"

  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: "Key Vault expiration audit"
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Audit expiring and missing-expiration secrets
        shell: pwsh
        env:
          VAULT_NAME: ${{ github.event.inputs.vault_name }}
          DAYS_AHEAD: ${{ github.event.inputs.days_ahead }}
        run: |
          $vaultName = $env:VAULT_NAME
          if ([string]::IsNullOrWhiteSpace($vaultName)) {
            $vaultName = 'archlucid-kv'
          }

          $daysAhead = 30
          if (-not [string]::IsNullOrWhiteSpace($env:DAYS_AHEAD)) {
            $daysAhead = [int]$env:DAYS_AHEAD
          }

          ./scripts/azure/Audit-KeyVaultExpirations.ps1 `
            -VaultName $vaultName `
            -DaysAhead $daysAhead `
            -FlagMissingExpiration `
            -AsJson
