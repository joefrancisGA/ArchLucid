name: Focused API SQL validation

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/pr-focused-api-sql.yml'
      - 'scripts/ci/run_disposable_api_sql_smoke.sh'
      - 'scripts/ci/run_focused_api_sql.py'
      - 'ArchLucid.Api.Tests/AuthorityPipelineCommittedInventorySqlIntegrationTests.cs'
      - 'ArchLucid.Application.Tests/Runs/Orchestration/Commit/AuthorityCommitRecoveryVerifierTests.cs'
      - 'ArchLucid.Api.Tests/Security/AuditExportTenantIsolationIntegrationTests.cs'
      - 'ArchLucid.Application/Runs/Finalization/**'
      - 'ArchLucid.Application/Runs/Orchestration/Pipeline/Stages/AuthorityPipelineArtifactsStage.cs'

permissions:
  contents: read

concurrency:
  group: focused-api-sql-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-api-sql:
    name: Focused API SQL cases
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build API test project in Release
        run: dotnet build ArchLucid.Api.Tests/ArchLucid.Api.Tests.csproj -c Release -p:TreatWarningsAsErrors=true

      - name: Run the focused application fixture and recovery tests
        run: >-
          dotnet test ArchLucid.Application.Tests/ArchLucid.Application.Tests.csproj
          -c Release --no-build
          --filter 'FullyQualifiedName~AuthorityPipelineDecisioningStageTests|FullyQualifiedName~AuthorityPipelineArtifactsStageLegacyRunIdTests|FullyQualifiedName~AuthorityCommitRecoveryVerifierTests'

      # Verify this follow-up's isolated case before running the normal smoke lane.
      - name: Verify the invalid-inventory case in isolation
        if: github.event.pull_request.head.ref == 'test-aspects/verify-inventory-conflict'
        run: >-
          bash scripts/ci/run_disposable_api_sql_smoke.sh "$RUNNER_TEMP/focused-api-sql-isolated"
          --case ArchLucid.Api.Tests.AuthorityPipelineCommittedInventorySqlIntegrationTests.Repeat_finalize_rejects_a_corrupt_persisted_inventory_hash

      - name: Run three cases against disposable SQL Server
        run: bash scripts/ci/run_disposable_api_sql_smoke.sh "$RUNNER_TEMP/focused-api-sql"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: focused-api-sql-summary
          path: |
            ${{ runner.temp }}/focused-api-sql/summary.json
            ${{ runner.temp }}/focused-api-sql-isolated/summary.json
          retention-days: 3
          if-no-files-found: ignore
