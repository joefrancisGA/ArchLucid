name: FND-005-010-014-015 Consolidated Reference Verification
on:
  pull_request:
    branches: [master, main, architecture/fnd014-isolated-dry-run-runner]
  merge_group:
    branches: [master, main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  reference-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install JSON Schema validator used by existing evidence contract tests
        run: python -m pip install 'jsonschema[format]==4.23.0' 'cryptography>=44,<47' 'azure-identity>=1.17,<2' 'azure-keyvault-keys>=4.9,<5' 'azure-storage-blob>=12.20,<13'
      - name: Verify evidence, authorization, simulation and rollback
        run: |
          python -m unittest discover -s scripts/tests -p 'test_fnd005_*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_fnd010_*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_fnd014_*.py' -v
          python -m unittest discover -s scripts/tests -p 'test_fnd015_*.py' -v
