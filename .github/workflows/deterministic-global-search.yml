name: Deterministic global search ordering

on:
  pull_request:
    branches: [master]
    paths:
      - 'ArchLucid.Persistence/Search/SqlGlobalSearchRepository.cs'
      - 'scripts/tests/test_global_search_deterministic_order.py'
      - '.github/workflows/deterministic-global-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordering-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -p test_global_search_deterministic_order.py -v
