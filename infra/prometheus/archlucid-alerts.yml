# ArchLucid paging / severity-equivalent alerts (Prometheus rule groups).
# Required audit trail (TB-955 / INV-003) — pageable on abandon + domain↔audit orphans.
groups:
  - name: archlucid-required-audit-trail
    rules:
      - alert: ArchLucidRequiredAuditWriteAbandon
        expr: sum(increase(archlucid_required_audit_write_abandons_total[15m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Required durable audit write abandoned after LogOrThrow retries
          description: >-
            One or more Required audit writes failed after bounded retries
            (fail-closed path). Triage: docs/runbooks/REQUIRED_AUDIT_TRAIL_ORPHAN_TRIAGE.md.
            Informational TryLogAsync soft-fail is intentionally excluded.

      - alert: ArchLucidRequiredAuditTrailOrphans
        expr: sum(increase(archlucid_required_audit_trail_orphan_alerts_total[1h])) > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: Required audit trail orphan probe detected missing Expected audit events
          description: >-
            Governance approve/reject or golden-manifest finalize rows lack matching
            Required AuditEvents after the grace window. Triage:
            docs/runbooks/REQUIRED_AUDIT_TRAIL_ORPHAN_TRIAGE.md.
