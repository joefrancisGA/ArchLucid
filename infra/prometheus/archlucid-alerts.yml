# Recording / alert rules for ArchLucid when scraping OTLP â†’ Prometheus or app metrics.
# Adjust metric names to match your Prometheus scrape (e.g. OTel SDK exporter naming).
groups:
  - name: archlucid-authority
    rules:
      - alert: ArchLucidAuthorityRunErrors
        expr: |
          sum(rate(traces_span_count{span_name="AuthorityRun",status_code="ERROR"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Authority pipeline spans reporting ERROR
          description: Check API/worker logs and SQL outbox `AuthorityPipelineWorkOutbox` for stuck rows.

      - alert: ArchLucidAuthorityPipelineWorkBacklog
        expr: |
          archlucid_authority_pipeline_work_pending > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Authority pipeline work outbox backlog high
          description: >-
            Observable gauge `archlucid_authority_pipeline_work_pending` (meter ArchLucid) is fed by
            `OutboxOperationalMetricsHostedService` from `dbo.AuthorityPipelineWorkOutbox`. Investigate
            workers/API authority pipeline; use GET /v1/admin/diagnostics/outboxes for detail.

      - alert: ArchLucidAuthorityPipelineWorkStale
        expr: |
          archlucid_authority_pipeline_work_oldest_pending_age_seconds > 3600
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: Oldest authority outbox row is very old
          description: >-
            `archlucid_authority_pipeline_work_oldest_pending_age_seconds` exceeds 1h. Indicates stuck
            processing or sustained overload.


      - alert: ArchLucidAuthorityPipelineWorkDeadLetters
        expr: |
          archlucid_authority_pipeline_work_dead_letter > 0
        for: 30m
        labels:
          severity: critical
          tier: p0
        annotations:
          summary: Authority pipeline outbox rows exhausted retries
          description: >-
            `archlucid_authority_pipeline_work_dead_letter` is non-zero (`dbo.AuthorityPipelineWorkOutbox.DeadLetteredUtc`).
            Runs may miss authority snapshot ids; inspect `LastAttemptError`, worker logs, GET /v1/admin/diagnostics/outboxes.

      - alert: ArchLucidRetrievalIndexingOutboxBacklog
        expr: |
          archlucid_retrieval_indexing_outbox_pending > 100
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: Retrieval indexing outbox backlog high
          description: >-
            Gauge `archlucid_retrieval_indexing_outbox_pending` from SQL `dbo.RetrievalIndexingOutbox`.
            Check retrieval indexer worker and SQL connectivity.

      - alert: ArchLucidRetrievalIndexingOutboxStale
        expr: |
          archlucid_retrieval_indexing_outbox_oldest_pending_age_seconds > 7200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Retrieval indexing backlog is aging
          description: >-
            Oldest pending retrieval outbox row over 2h (`archlucid_retrieval_indexing_outbox_oldest_pending_age_seconds`).

      - alert: ArchLucidIntegrationEventOutboxPublishBacklog
        expr: |
          archlucid_integration_event_outbox_publish_pending > 200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Integration publish outbox backlog high
          description: >-
            Actionable rows in `dbo.IntegrationEventOutbox` (gauge `archlucid_integration_event_outbox_publish_pending`).
            Check Service Bus publisher / integration worker.

      - alert: ArchLucidIntegrationEventOutboxPublishStale
        expr: |
          archlucid_integration_event_outbox_oldest_actionable_pending_age_seconds > 3600
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: Integration outbox publish queue is stale
          description: >-
            Oldest actionable integration outbox row over 1h
            (`archlucid_integration_event_outbox_oldest_actionable_pending_age_seconds`).

      - alert: ArchLucidIntegrationEventOutboxConvergenceSlow
        expr: |
          archlucid_integration_event_outbox_oldest_actionable_pending_age_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Integration outbox publish latency exceeding tight convergence target
          description: >-
            Oldest actionable integration outbox row over 60s for 5m. Tune in noisy environments;
            see docs/API_SLOS.md Â§ Outbox convergence. Severe backlog: ArchLucidIntegrationEventOutboxPublishStale (1h).

      - alert: ArchLucidIntegrationEventOutboxDeadLetter
        expr: |
          archlucid_integration_event_outbox_dead_letter > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Integration event outbox has dead-letter rows
          description: >-
            Gauge `archlucid_integration_event_outbox_dead_letter` counts dead-lettered integration outbox rows.
            Use admin diagnostics and dead-letter retry flows; fix root cause before clearing.

  - name: archlucid-data-consistency
    rules:
      - alert: ArchLucidDataConsistencyOrphansDetected
        expr: |
          sum(rate(archlucid_data_consistency_orphans_detected_total[1h])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Orphan rows detected vs authority Runs
          description: >-
            `DataConsistencyOrphanProbeHostedService` incremented `archlucid_data_consistency_orphans_detected_total`
            (labels `table` = ComparisonRecords, GoldenManifests, or FindingsSnapshots; `column` = LeftRunId, RightRunId, or RunId).
            Investigate missing `dbo.Runs` keys; for comparison rows see `docs/runbooks/COMPARISON_RECORD_ORPHAN_REMEDIATION.md`.
            Probe is detection-only.

      - alert: ArchLucidDataConsistencyAlertsRaised
        expr: |
          sum(rate(archlucid_data_consistency_alerts_total[1h])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Data consistency enforcement signaled orphan threshold
          description: >-
            `archlucid_data_consistency_alerts_total` increased â€” `DataConsistency:Enforcement:Mode` is `Alert` or
            `Quarantine` on this host and at least one table/column slice met `AlertThreshold`. See
            `docs/data-consistency/DATA_CONSISTENCY_ENFORCEMENT.md`; operator checklist `docs/runbooks/DATA_CONSISTENCY_ENFORCEMENT.md`.

      - alert: ArchLucidDataConsistencyOrphansQuarantinedActivity
        expr: |
          sum(rate(archlucid_data_consistency_orphans_quarantined_total[1h])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Data consistency quarantine inserts observed
          description: >-
            `archlucid_data_consistency_orphans_quarantined_total` increased over 1h â€” rows were inserted into
            `dbo.DataConsistencyQuarantine` (golden-manifest orphan path). Intended to be rare; **30m `for`** avoids paging on
            one-off seeds. Tune per environment after reviewing steady-state baselines. Runbook:
            `docs/runbooks/DATA_CONSISTENCY_ENFORCEMENT.md`.

  - name: archlucid-explainability
    rules:
      - alert: ArchLucidExplanationFaithfulnessFallbackTrend
        expr: |
          increase(archlucid_explanation_aggregate_faithfulness_fallback_total[1h]) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Elevated aggregate explanation faithfulness fallbacks
          description: >-
            Counter `archlucid_explanation_aggregate_faithfulness_fallback_total` rose more than three times in 1h.
            Stakeholder aggregate explanations may be substituting deterministic narrative for LLM text; review
            finding trace completeness and explanation quality. Tune threshold per environment.
            Operator context: docs/EXPLAINABILITY_TRACE_COVERAGE.md; API narrative field: OpenAPI
            `FindingExplainabilityResult.narrativeText` (see docs/API_ERROR_CONTRACT.md for error shape elsewhere).

      - alert: ArchLucidExplanationFaithfulnessFallbackBudgetExceeded
        expr: |
          rate(archlucid_explanation_aggregate_faithfulness_fallback_total[1h])
          >
          archlucid:slo:explanation_faithfulness_fallback_budget
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Aggregate explanation faithfulness fallback rate exceeds SLO budget
          description: >-
            `rate(archlucid_explanation_aggregate_faithfulness_fallback_total[1h])` exceeded the recording rule
            `archlucid:slo:explanation_faithfulness_fallback_budget` (see infra/prometheus/archlucid-slo-rules.yml,
            group `archlucid-slo-explanation-faithfulness`) for 30m. Treat as sustained substitution of deterministic
            narrative for LLM aggregate text; see docs/EXPLAINABILITY_TRACE_COVERAGE.md.

      - alert: ArchLucidExplainabilityTraceCompletenessP10Low
        expr: |
          histogram_quantile(
            0.1,
            sum(rate(archlucid_explainability_trace_completeness_ratio_bucket[30m])) by (le)
          ) < 0.35
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Advisory explainability trace completeness p10 is low
          description: >-
            The 10th percentile of `archlucid_explainability_trace_completeness_ratio` fell below 0.35 over a 30m
            rate window for 2h. Advisory scans may be missing explainability traces expected for stakeholder narratives.
            Tune threshold per environment; see docs/EXPLAINABILITY_TRACE_COVERAGE.md and docs/OBSERVABILITY.md.
            If the histogram is absent in Prometheus (exporter rename), fix scrape config before relying on this alert.

  - name: archlucid-trial-funnel
    rules:
      - alert: ArchLucidTrialSignupFailuresHigh
        expr: sum(rate(archlucid_trial_signup_failures_total[1m])) > (5.0 / 60.0)
        for: 10m
        labels:
          severity: critical
          tier: p0
        annotations:
          summary: Trial signup failures sustained above 5/min
          description: >-
            `archlucid_trial_signup_failures_total` rate exceeded 5 events/min for 10m. Check registration / local identity /
            trial bootstrap logs; see docs/runbooks/TRIAL_FUNNEL.md.

      - alert: ArchLucidTrialFirstRunLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(archlucid_trial_first_run_seconds_bucket[15m])) by (le)
          ) > 600
        for: 30m
        labels:
          severity: warning
          escalation: ticket
        annotations:
          summary: Trial time-to-first-manifest p95 exceeds 600s
          description: >-
            p95 of `archlucid_trial_first_run_seconds` is above 600s for 30m. Treat as product funnel friction; see
            docs/runbooks/TRIAL_FUNNEL.md and Grafana dashboard `archlucid-trial-funnel`.

  - name: archlucid-resilience
    rules:
      - alert: ArchLucidCircuitBreakerOpen
        expr: archlucid_circuit_breaker_state > 0
        for: 5m
        labels:
          severity: critical
          tier: p0
        annotations:
          summary: OpenAI circuit breaker not fully closed
          description: >-
            Gauge `archlucid_circuit_breaker_state` (label `gate`) reports HalfOpen(1) or Open(2). LLM completions or
            embeddings may be degraded; see also authenticated GET `/health` circuit breaker check and audit events
            `CircuitBreakerStateTransition`.

  - name: archlucid-agent-output-quality
    rules:
      # Histogram names must match your Prometheus/OTel scrape (typically `*_bucket` with `le` label).
      # If series are absent after deploy, fix export path first (`scripts/report_observability_export_readiness.py`).
      - alert: ArchLucidAgentOutputQualityGateRejected
        expr: |
          sum(rate(archlucid_agent_output_quality_gate_total{outcome="rejected"}[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Agent output quality gate is rejecting results
          description: >-
            `archlucid_agent_output_quality_gate_total{outcome="rejected"}` rate is non-zero â€” requires reject floors
            enabled under `ArchLucid:AgentOutput:QualityGate`. Tune thresholds or prompts; see
            `docs/library/AGENT_OUTPUT_EVALUATION.md`.

      - alert: ArchLucidAgentOutputSemanticScoreP10Low
        expr: |
          histogram_quantile(
            0.1,
            sum(rate(archlucid_agent_output_semantic_score_bucket[30m])) by (le, agent_type)
          ) < 0.35
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Agent semantic score p10 is low (per agent_type)
          description: >-
            10th percentile of `archlucid_agent_output_semantic_score` below 0.35 over 30m rate window. The series is a
            heuristic JSON-structure score (optional LLM judge), not embedding similarity or ground truth. Tune threshold
            after baseline; correlate with prompt/model changes. See `docs/library/OBSERVABILITY.md`.

      - alert: ArchLucidAgentOutputSemanticScoreP50Low
        expr: |
          histogram_quantile(
            0.5,
            sum(rate(archlucid_agent_output_semantic_score_bucket[30m])) by (le, agent_type)
          ) < 0.45
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Agent semantic score p50 is low (per agent_type)
          description: >-
            Median heuristic/optional-judge semantic score below 0.45 â€” broader regression than p10 alone. Verify exporter
            mapping if histogram is missing from Prometheus.

      - alert: ArchLucidAgentOutputParseFailures
        expr: |
          sum(rate(archlucid_agent_output_parse_failures_total[15m])) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Agent output JSON parse failures for metrics path
          description: >-
            Non-zero rate on `archlucid_agent_output_parse_failures_total` â€” `ParsedResultJson` failed JSON parse or
            non-object root when recording evaluation metrics. See `docs/library/AGENT_OUTPUT_EVALUATION.md`.

      - alert: ArchLucidAgentTraceBlobUploadFailures
        expr: |
          sum(rate(archlucid_agent_trace_blob_upload_failures_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Agent trace blob uploads exhausted retries
          description: >-
            `archlucid_agent_trace_blob_upload_failures_total` â€” blob persistence for full prompts/responses failed after
            retries. Check blob storage ACLs and `docs/library/AGENT_TRACE_FORENSICS.md`.

  - name: archlucid-marketing-pricing-quote-sla
    rules:
      - alert: ArchLucidPricingQuoteAcknowledgementBreach
        expr: |
          histogram_quantile(
            1,
            sum(rate(archlucid_pricing_quote_request_age_hours_bucket[10m])) by (le)
          ) > 24
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Marketing pricing quote acknowledgement SLA breached
          description: >-
            At least one row in dbo.MarketingPricingQuoteRequests has been unanswered for more than 24 hours (UTC).
            Review GET /v1/admin/marketing/pricing-quote-aging and docs/runbooks/MARKETING_PRICING_QUOTE_NOTIFICATIONS.md.


  - name: archlucid-llm-safety
    rules:
      - alert: ArchLucidHighPromptRedactionRate
        expr: |
          sum(rate(archlucid_llm_prompt_redactions_total[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Elevated LLM prompt redaction rate
          description: >-
            Aggregate deny-list redactions exceed 5/s for 10m on `archlucid_llm_prompt_redactions_total`.
            Investigate prompt injection attempts, overly aggressive deny-list rules, or upstream data quality.
            Grafana: `infra/grafana/dashboard-archlucid-llm-usage.json` (Prompt redaction panels).

  - name: archlucid-sql-pool
    rules:
      - alert: SqlPoolNearExhaustion
        expr: |
          (
            archlucid_sql_pool_active_connections
            /
            (archlucid_sql_pool_active_connections + archlucid_sql_pool_idle_connections)
          ) > 0.80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: SQL connection pool above 80% utilisation for 2 minutes
          description: >-
            Microsoft.Data.SqlClient pool active connections exceed 80% of active+idle capacity for 2m.
            Investigate connection leaks or increase Max Pool Size after profiling.

  - name: archlucid-authority-outbox-depth
    rules:
      - alert: AuthorityOutboxStalled
        expr: archlucid_authority_pipeline_work_oldest_pending_age_seconds > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Authority pipeline outbox has items older than 5 minutes
          description: >-
            Oldest pending authority pipeline work exceeds 300 seconds. See dashboard-archlucid-authority.json.

      - alert: IntegrationOutboxDeadLetterGrowing
        expr: archlucid_integration_event_outbox_dead_letter_count > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Integration event outbox has dead-lettered items
          description: >-
            archlucid_integration_event_outbox_dead_letter_count is above zero. Triage integration outbox DLQ.

  - name: archlucid-p0
    rules:
      - alert: ArchLucidApiUnavailable
        expr: |
          absent(up{job="archlucid-api"}) or sum(up{job="archlucid-api"}) == 0
        for: 2m
        labels:
          severity: critical
          tier: p0
        annotations:
          summary: "ArchLucid API is unreachable — no healthy instances"
          description: >-
            All API instances are down or the scrape target is missing. Customers cannot submit
            requests. Check Container Apps health, recent deployments, and SQL connectivity.

      - alert: ArchLucidSqlConnectionFailuresSustained
        expr: |
          archlucid_sql_connection_failures_total > 0
        for: 3m
        labels:
          severity: critical
          tier: p0
        annotations:
          summary: "SQL connection failures — database may be unreachable"
          description: >-
            archlucid_sql_connection_failures_total is non-zero for 3 minutes. Runs, governance
            resolution, and outbox processing are all failing. Check database health and
            failover group status. See docs/runbooks/DATABASE_FAILOVER.md.

      - alert: ArchLucidHealthCheckUnhealthy
        expr: |
          archlucid_health_check_status{status="Unhealthy"} > 0
        for: 2m
        labels:
          severity: critical
          tier: p0
        annotations:
          summary: "ArchLucid /health/ready reporting Unhealthy"
          description: >-
            At least one health check is in Unhealthy state (not Degraded) for 2 minutes.
            This means the readiness probe is failing and Container Apps may be restarting.
