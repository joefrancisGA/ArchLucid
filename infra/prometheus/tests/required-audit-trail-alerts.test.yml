# promtool test rules required-audit-trail-alerts.test.yml
rule_files:
  - ../archlucid-alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'archlucid_required_audit_write_abandons_total{event_type="GovernanceApprovalApproved"}'
        values: "0+1x20"
    alert_rule_test:
      eval_time: 20m
      exp_alerts:
        - alertname: ArchLucidRequiredAuditWriteAbandon

  - interval: 1m
    input_series:
      - series: 'archlucid_required_audit_trail_orphan_alerts_total{domain="governance_approved"}'
        values: "0+1x80"
    alert_rule_test:
      eval_time: 80m
      exp_alerts:
        - alertname: ArchLucidRequiredAuditTrailOrphans
