# ArchLucid — minimal local dependencies (SQL only)
# ────────────────────────────────────────────────────────────────────
# Overlay for API-only / hot-reload dev when Azurite and Redis are not needed.
# Matches default appsettings.Development.json: Sql storage against the ArchLucid catalog,
# in-process background jobs, HotPathCache disabled. Override with user secrets
# ArchLucid:StorageProvider=InMemory for throwaway API-only runs without SQL.
#
# Usage (merge with base compose):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#   dotnet run --project ArchLucid.Api
#
# Or: dotnet run --project ArchLucid.Cli -- dev up --sql-only
#
# To start Azurite + Redis as well on this overlay:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile local-with-sidecars up -d
# ────────────────────────────────────────────────────────────────────

services:
  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: archlucid-smtp4dev
    ports:
      - "2525:25"
      - "8025:80"
    restart: unless-stopped

  azurite:
    profiles: ["local-with-sidecars"]

  redis:
    profiles: ["local-with-sidecars"]
