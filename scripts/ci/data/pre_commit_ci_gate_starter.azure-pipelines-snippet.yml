# Azure DevOps snippet — pre-commit governance gate (OpenAPI v1).
# Paste into a PR validation pipeline; configure variable group archlucid-ci.
#
# Variables (variable group archlucid-ci):
#   ARCHLUCID_API_URL          — API base (no trailing slash)
#   ARCHLUCID_API_KEY          — secret, Operator-scoped
#   ARCHLUCID_RUN_ID           — existing review runId
#   ARCHLUCID_GATE_MODE        — simulate | commit (default simulate)

trigger: none

variables:
  - group: archlucid-ci
  - name: ARCHLUCID_GATE_MODE
    value: simulate
  - name: ARCHLUCID_CORRELATION_ID
    value: ado-precommit-$(Build.BuildId)

pool:
  vmImage: ubuntu-latest

steps:
  - bash: |
      set -euo pipefail
      if [[ -z "${ARCHLUCID_API_URL:-}" || -z "${ARCHLUCID_API_KEY:-}" ]]; then
        echo "Configure variable group archlucid-ci with ARCHLUCID_API_URL and secret ARCHLUCID_API_KEY" >&2
        exit 2
      fi
      if [[ -z "${ARCHLUCID_RUN_ID:-}" ]]; then
        echo "Set pipeline variable ARCHLUCID_RUN_ID to an existing review runId" >&2
        exit 2
      fi
      API="${ARCHLUCID_API_URL%/}"
      RUN_ID="${ARCHLUCID_RUN_ID}"
      MODE="${ARCHLUCID_GATE_MODE:-simulate}"

      if [[ "$MODE" == "simulate" ]]; then
        BODY="$(jq -n --arg runId "$RUN_ID" '{ runId: $runId, syntheticSeverity: "Critical", syntheticCount: 1 }')"
        HTTP="$(curl -sS -o gate.json -w "%{http_code}" -X POST "$API/v1/governance/pre-commit/simulate" \
          -H "X-Api-Key: ${ARCHLUCID_API_KEY}" \
          -H "X-Correlation-ID: ${ARCHLUCID_CORRELATION_ID}" \
          -H "Content-Type: application/json" \
          -d "$BODY")"
        if [[ "$HTTP" != "200" ]]; then
          echo "Simulate failed: HTTP $HTTP" >&2
          cat gate.json >&2
          exit 2
        fi
        BLOCKED="$(jq -r '.blocked // false' gate.json)"
        if [[ "$BLOCKED" == "true" ]]; then
          echo "Pre-commit gate WOULD BLOCK commit" >&2
          jq '{ blocked, blockingFindingIds, policyPackId, minimumBlockingSeverity }' gate.json >&2
          exit 1
        fi
        echo "Pre-commit simulate PASS"
        exit 0
      fi

      if [[ "$MODE" == "commit" ]]; then
        HTTP="$(curl -sS -o gate.json -w "%{http_code}" -X POST "$API/v1/architecture/run/${RUN_ID}/commit" \
          -H "X-Api-Key: ${ARCHLUCID_API_KEY}" \
          -H "X-Correlation-ID: ${ARCHLUCID_CORRELATION_ID}" \
          -H "Content-Type: application/json" \
          -d '{}')"
        if [[ "$HTTP" == "200" ]]; then
          echo "Commit PASS"
          exit 0
        fi
        if [[ "$HTTP" == "409" ]]; then
          TYPE="$(jq -r '.type // .Type // empty' gate.json)"
          if [[ "$TYPE" == *"governance-pre-commit-blocked"* ]]; then
            echo "Governance pre-commit blocked (409 #governance-pre-commit-blocked)" >&2
            cat gate.json >&2
            exit 1
          fi
        fi
        echo "Commit failed: HTTP $HTTP" >&2
        cat gate.json >&2
        exit 2
      fi

      echo "Unknown ARCHLUCID_GATE_MODE: $MODE" >&2
      exit 2
    displayName: ArchLucid pre-commit governance gate
    env:
      ARCHLUCID_API_URL: $(ARCHLUCID_API_URL)
      ARCHLUCID_API_KEY: $(ARCHLUCID_API_KEY)
      ARCHLUCID_RUN_ID: $(ARCHLUCID_RUN_ID)
      ARCHLUCID_GATE_MODE: $(ARCHLUCID_GATE_MODE)
      ARCHLUCID_CORRELATION_ID: $(ARCHLUCID_CORRELATION_ID)
